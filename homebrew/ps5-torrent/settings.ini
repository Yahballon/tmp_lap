# Torrent Flow v0.4.2 - default configuration
# The native app creates /data/ps5-torrent/settings.ini on first launch.
# Changes made in the Settings UI are saved automatically.
# Auto-download only scans while the application is running.
[downloads]
auto_download=0
max_active_downloads=2
delete_completed_torrents=1
scan_interval_seconds=3
storage=internal
