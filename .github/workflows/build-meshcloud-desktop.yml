name: MeshCloud Desktop (Windows Linux macOS)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'homebrew/ps5-meshcloud/**'
      - '.github/workflows/build-meshcloud-desktop.yml'
  pull_request:
    paths:
      - 'homebrew/ps5-meshcloud/**'
      - '.github/workflows/build-meshcloud-desktop.yml'
permissions:
  contents: read
jobs:
  desktop:
    name: Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: meshcloud-linux-x64
          - os: windows-2022
            artifact: meshcloud-windows-x64
          - os: macos-15
            artifact: meshcloud-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Linux OpenSSL
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev libsqlite3-dev
      - name: macOS OpenSSL
        if: runner.os == 'macOS'
        run: brew install openssl@3 sqlite
      - name: Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg" install openssl:x64-windows sqlite3:x64-windows
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S homebrew/ps5-meshcloud -B build/meshcloud -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S homebrew/ps5-meshcloud -B build/meshcloud -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S homebrew/ps5-meshcloud -B build/meshcloud -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" -DSQLite3_INCLUDE_DIR="$(brew --prefix sqlite)/include" -DSQLite3_LIBRARY="$(brew --prefix sqlite)/lib/libsqlite3.dylib"
      - name: Build
        run: cmake --build build/meshcloud --config Release --parallel 4
      - name: Security and CID tests
        run: ctest --test-dir build/meshcloud -C Release --output-on-failure
      - name: Validate CLI help and streamed CID
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then EXE=build/meshcloud/Release/meshcloud.exe; else EXE=build/meshcloud/meshcloud; fi
          "$EXE" --help
          printf "hello" > meshcloud-smoke.txt
          "$EXE" --cid-file meshcloud-smoke.txt
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item build/meshcloud/Release/meshcloud.exe package/
          Copy-Item homebrew/ps5-meshcloud/README.md package/
          Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" | Copy-Item -Destination package/ -ErrorAction SilentlyContinue
          Set-Content package/NOT_A_NETWORK_CLIENT_YET.txt 'Pre-alpha local disk diagnostic: networking disabled'
      - name: Package Unix
        if: runner.os != 'Windows'
        run: |
          mkdir -p package
          cp build/meshcloud/meshcloud package/
          cp homebrew/ps5-meshcloud/README.md package/
          printf '%s\n' 'Pre-alpha local disk diagnostic: networking disabled' > package/NOT_A_NETWORK_CLIENT_YET.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package/
          if-no-files-found: error

  release:
    name: Publish verified pre-alpha desktop archives
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: meshcloud-*
          path: gathered
      - name: Create platform archives
        run: |
          mkdir -p release
          for directory in gathered/meshcloud-*; do
            test -d "$directory"
            name="$(basename "$directory")"
            (cd "$directory" && zip -qr "../../release/$name.zip" .)
          done
          test "$(find release -name '*.zip' | wc -l)" -eq 3
      - name: Create prerelease if new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=meshcloud-desktop-v0.3.0-prealpha
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Pre-alpha release already exists; no rewrite"
            exit 0
          fi
          gh release create "$tag" release/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MeshCloud desktop v0.3.0 pre-alpha (offline only)" \
            --prerelease \
            --notes "OFFLINE pre-alpha: encrypted streaming vault, CIDv1, 90-day cleanup, GF256 Reed-Solomon 10+20/10+100 redundancy module, quorum-signed Ed25519 membership verification and strict member-only wire framing. There is NO P2P transport, real storage audit network or PS5 package. All public network functions remain disabled."
