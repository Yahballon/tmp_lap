name: Build PS5 MeshCloud Native
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'homebrew/ps5-meshcloud/ps5/**'
      - 'homebrew/ps5-meshcloud/src/**'
      - '.github/workflows/build-ps5-meshcloud.yml'
  push:
    branches: [main]
    paths:
      - 'homebrew/ps5-meshcloud/ps5/**'
      - '.github/workflows/build-ps5-meshcloud.yml'
permissions:
  contents: write
jobs:
  ps5:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 ninja-build make wget curl unzip tar git python3 python3-pil pkg-config ca-certificates
      - name: Test native read-only storage diagnostics on host
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Ihomebrew/ps5-meshcloud/ps5/native homebrew/ps5-meshcloud/ps5/native/diagnostics.cpp homebrew/ps5-meshcloud/ps5/tests/test_diagnostics.cpp -o /tmp/meshcloud-ps5-test
          /tmp/meshcloud-ps5-test
      - name: Host-verify PS5 storage auditor without C++ exceptions
        run: |
          g++ -std=c++20 -fno-exceptions -fno-rtti -O2 -Wall -Wextra -Wpedantic -Werror \
            -Ihomebrew/ps5-meshcloud/src \
            homebrew/ps5-meshcloud/src/core.cpp \
            homebrew/ps5-meshcloud/src/admission.cpp \
            homebrew/ps5-meshcloud/src/storage_audit.cpp \
            homebrew/ps5-meshcloud/tests/test_storage_audit.cpp \
            -lcrypto -o /tmp/meshcloud-storage-audit-ps5-host
          /tmp/meshcloud-storage-audit-ps5-host
      - name: Host-test pinned remote TLS storage audits without C++ exceptions
        run: |
          g++ -std=c++20 -fno-exceptions -fno-rtti -O2 -Wall -Wextra -Wpedantic -Werror \
            -Ihomebrew/ps5-meshcloud/src \
            homebrew/ps5-meshcloud/src/core.cpp \
            homebrew/ps5-meshcloud/src/admission.cpp \
            homebrew/ps5-meshcloud/src/storage_audit.cpp \
            homebrew/ps5-meshcloud/src/audit_net.cpp \
            homebrew/ps5-meshcloud/tests/test_audit_net.cpp \
            -lssl -lcrypto -pthread -o /tmp/meshcloud-auditnet-ps5-host
          /tmp/meshcloud-auditnet-ps5-host
      - name: Host-test 3-auditor ticket assembly without C++ exceptions
        run: |
          g++ -std=c++20 -fno-exceptions -fno-rtti -O2 -Wall -Wextra -Wpedantic -Werror \
            -Ihomebrew/ps5-meshcloud/src \
            homebrew/ps5-meshcloud/src/core.cpp \
            homebrew/ps5-meshcloud/src/admission.cpp \
            homebrew/ps5-meshcloud/src/storage_audit.cpp \
            homebrew/ps5-meshcloud/src/ticket_issue.cpp \
            homebrew/ps5-meshcloud/src/p2p_tls.cpp \
            homebrew/ps5-meshcloud/src/p2p_config.cpp \
            homebrew/ps5-meshcloud/src/peer_discovery.cpp \
            homebrew/ps5-meshcloud/src/exchange.cpp \
            homebrew/ps5-meshcloud/src/vault.cpp \
            homebrew/ps5-meshcloud/src/cid.cpp \
            homebrew/ps5-meshcloud/src/stream.cpp \
            homebrew/ps5-meshcloud/src/catalog.cpp \
            homebrew/ps5-meshcloud/src/wire.cpp \
            homebrew/ps5-meshcloud/tests/test_ticket_issue.cpp \
            -lssl -lcrypto -lsqlite3 -pthread -o /tmp/meshcloud-tickets-ps5-host
          /tmp/meshcloud-tickets-ps5-host
      - name: Host-test 13GiB stream protocol under PS5 no-exceptions rules
        run: |
          g++ -std=c++20 -fno-exceptions -fno-rtti -O2 -Wall -Wextra -Wpedantic -Werror \
            -Ihomebrew/ps5-meshcloud/src \
            homebrew/ps5-meshcloud/src/core.cpp \
            homebrew/ps5-meshcloud/src/admission.cpp \
            homebrew/ps5-meshcloud/src/storage_audit.cpp \
            homebrew/ps5-meshcloud/src/provision.cpp \
            homebrew/ps5-meshcloud/tests/test_provision.cpp \
            -lssl -lcrypto -pthread -o /tmp/meshcloud-provisioning-ps5-host
          /tmp/meshcloud-provisioning-ps5-host
      - name: Prepare native PS5 application scaffold
        run: |
          git clone --depth=1 https://github.com/Yahballon/PS5-DevBridge.git /tmp/devbridge
          cp -a /tmp/devbridge/templates/simple-calc ./app
          # zlib.net/fossils intermittently supplies an unexpected response; use
          # the official current zlib 1.3.2 URL with the SAME pinned SHA-256.
          sed -i 's@https://zlib.net/fossils/zlib-@https://zlib.net/zlib-@' app/tools/setup-native-dependencies.sh
          cp homebrew/ps5-meshcloud/ps5/native/*.cpp homebrew/ps5-meshcloud/ps5/native/*.hpp app/src/
          for name in core cid stream catalog vault admission wire exchange p2p_tls p2p_config peer_discovery storage_audit audit_net ticket_issue provision; do
            cp "homebrew/ps5-meshcloud/src/$name.cpp" "app/src/$name.cpp"
          done
          cp homebrew/ps5-meshcloud/src/*.hpp app/src/
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('app/sce_sys/param.json')
          d=json.loads(p.read_text())
          d.update(titleId='PPSA99718',conceptId='99718',contentId='UP9000-PPSA99718_00-MESHCLOUDPS5APP1',contentVersion='01.000.006')
          d['localizedParameters']['en-US']['titleName']='MeshCloud by YAHBALLON'
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          python3 homebrew/ps5-meshcloud/ps5/assets/generate_icon.py app/sce_sys/icon0.png
          mkdir -p app/assets
          cp app/sce_sys/icon0.png app/assets/icon0.png
      - name: Inspect upstream official OpenGL SDK release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          for version in ("v1.0.0","v1.0.1","v1.0.2"):
              endpoint=f"https://api.github.com/repos/blackbearreloaded/ps5-opengl/releases/tags/{version}"
              headers={"Accept":"application/vnd.github+json",
                       "User-Agent":"MeshCloud-SDK-Audit",
                       "Authorization":"Bearer "+os.environ["GH_TOKEN"]}
              try:
                  with urllib.request.urlopen(urllib.request.Request(endpoint,headers=headers),timeout=30) as r:
                      release=json.load(r)
                  print(version,[(asset["name"],asset["size"],asset.get("digest")) for asset in release["assets"]])
              except (urllib.error.HTTPError,urllib.error.URLError) as e:
                  print(version, "GitHub release asset query failed:",str(e))
          PY
      - name: Prepare PS5 OpenGL SDK
        working-directory: app
        env:
          USE_CCACHE: '0'
          BUILD_JOBS: '4'
          PS5_CLANG: clang-18
        run: bash tools/prepare-opengl.sh
      - name: Resolve PS5 OpenSSL and SQLite from SHA-pinned PacBrew SDK
        working-directory: app
        run: |
          root="$(bash tools/setup-pacbrew-dependencies.sh --all)"
          echo "PacBrew static crypto/SQLite archives:"
          find "$root/user/homebrew/lib" -maxdepth 2 -type f \( -name '*ssl*.a' -o -name '*crypto*.a' -o -name '*sqlite*.a' \) -print
          for archive in lib/libssl.a lib/libcrypto.a lib/libsqlite3.a; do
            test -s "$root/user/homebrew/$archive" || { echo "Missing $archive" >&2; exit 1; }
          done
      - name: Prepare POSIX compatibility symbols
        run: |
          mkdir -p app/build/jb-json
          cp app/.deps/native/ps5-payload-sdk/target/lib/libc.a app/build/jb-json/libjb-posix.a
          llvm-objcopy-18 --redefine-sym=openlog=jb_sdk_openlog --redefine-sym=closelog=jb_sdk_closelog --redefine-sym=mkstemp=jb_sdk_mkstemp --redefine-sym=mkstemps=jb_sdk_mkstemps --redefine-sym=getpwuid_r=jb_sdk_getpwuid_r app/build/jb-json/libjb-posix.a
      - name: Compile native PS5 executable
        working-directory: app
        env:
          USE_CCACHE: '0'
          BUILD_JOBS: '4'
          PS5_CLANG: clang-18
          PACBREW_INCLUDE_PATHS: 'include'
          PACBREW_STATIC_ARCHIVES: 'lib/libssl.a lib/libcrypto.a lib/libsqlite3.a'
        run: make USE_CCACHE=0 BUILD_JOBS=4 app
      - name: Verify installer metadata, ELF and assets
        run: |
          python3 - <<'PY'
          import json,pathlib,struct,zipfile
          app=pathlib.Path('app/dist/PPSA99718')
          elf=(app/'eboot.bin').read_bytes()
          assert len(elf)>1000 and struct.unpack('<I',elf[:4])[0]==0x1d3d154f
          assert b'v0.6.0' in elf
          p=json.loads((app/'sce_sys/param.json').read_text())
          assert p['titleId']=='PPSA99718'
          assert p['contentId']=='UP9000-PPSA99718_00-MESHCLOUDPS5APP1'
          assert p['contentVersion']=='01.000.006'
          for filename in ['sce_sys/icon0.png','sce_module/libc.prx','assets/fonts/inter-semibold.huifont']:
              assert (app/filename).is_file(),filename
          with zipfile.ZipFile('app/dist/PPSA99718.zip') as z:
              assert z.testzip() is None
              for filename in ['eboot.bin','sce_sys/icon0.png','sce_module/libc.prx','assets/fonts/inter-semibold.huifont']:
                  assert 'PPSA99718/'+filename in z.namelist(),filename
          print('MeshCloud PS5 native pre-alpha installer verification passed')
          PY
      - name: Upload PS5 installable archive
        uses: actions/upload-artifact@v4
        with:
          name: MeshCloud-PS5-v0.6.0-PPSA99718
          path: app/dist/PPSA99718.zip
          if-no-files-found: error
      - name: Publish native prototype pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view meshcloud-ps5-v0.6.0-prealpha >/dev/null 2>&1; then
            echo 'Already released'
            exit 0
          fi
          gh release create meshcloud-ps5-v0.6.0-prealpha app/dist/PPSA99718.zip --target "$GITHUB_SHA" --prerelease --title "MeshCloud PS5 v0.6.0 (audited direct TLS P2P prototype)" --notes-file homebrew/ps5-meshcloud/ps5/RELEASE_NOTES.md
  # Separate real native fallback; GUI ps5 job above remains independently checked.
  ps5-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install native PS5 toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 ninja-build make wget curl unzip tar git python3 python3-pil pkg-config ca-certificates
      - name: Native PS5 application scaffold
        run: |
          git clone --depth=1 https://github.com/Yahballon/PS5-DevBridge.git /tmp/devbridge
          cp -a /tmp/devbridge/templates/simple-calc ./app
          # The UI scaffold's .env hardcodes OpenGL includes and archives.
          # Replace it for this separate, graphics-free native network service.
          printf 'APP_SOURCE_DIR=src/meshcloud-daemon\nAPP_INCLUDE_PATHS=src/meshcloud-daemon\nAPP_STATIC_ARCHIVES=build/jb-json/libmeshcloud-cxx-runtime.a\nAPP_IMPORT_STUBS=\nAPP_RUNTIME_MODULES=\nAPP_WRAP_SYMBOLS=\n' > app/.env
          # Do NOT silently replace the graphical build. This is a separately
          # named no-OpenGL security/network-node alternative.
          sed -i 's@https://zlib.net/fossils/zlib-@https://zlib.net/zlib-@' app/tools/setup-native-dependencies.sh
          mkdir -p app/src/meshcloud-daemon
          cp homebrew/ps5-meshcloud/ps5/headless/main.cpp app/src/meshcloud-daemon/main.cpp
          for module in core cid stream catalog vault erasure admission wire exchange published p2p_tls p2p_config peer_discovery storage_audit audit_net ticket_issue provision; do
            cp "homebrew/ps5-meshcloud/src/$module.cpp" "app/src/meshcloud-daemon/$module.cpp"
          done
          cp homebrew/ps5-meshcloud/src/*.hpp app/src/meshcloud-daemon/
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('app/sce_sys/param.json')
          d=json.loads(p.read_text())
          d.update(titleId='PPSA99718',conceptId='99718',contentId='UP9000-PPSA99718_00-MESHCLOUDPS5APP1',contentVersion='01.000.006')
          d['localizedParameters']['en-US']['titleName']='MeshCloud Node by YAHBALLON'
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          python3 homebrew/ps5-meshcloud/ps5/assets/generate_icon.py app/sce_sys/icon0.png
          mkdir -p app/assets
          cp app/sce_sys/icon0.png app/assets/icon0.png
      - name: Prepare signed pinned native SDK (no graphics download)
        working-directory: app
        run: |
          bash tools/setup-native-dependencies.sh
          root="$(bash tools/setup-pacbrew-dependencies.sh --all)"
          for archive in lib/libssl.a lib/libcrypto.a lib/libsqlite3.a; do
            test -s "$root/user/homebrew/$archive" || { echo "Missing $archive" >&2; exit 1; }
          done
      - name: Prepare POSIX compatibility symbols
        run: |
          mkdir -p app/build/jb-json
          cp app/.deps/native/ps5-payload-sdk/target/lib/libc.a app/build/jb-json/libjb-posix.a
          llvm-objcopy-18 --redefine-sym=openlog=jb_sdk_openlog --redefine-sym=closelog=jb_sdk_closelog --redefine-sym=mkstemp=jb_sdk_mkstemp --redefine-sym=mkstemps=jb_sdk_mkstemps --redefine-sym=getpwuid_r=jb_sdk_getpwuid_r app/build/jb-json/libjb-posix.a
          # The bundled OpenGL linker group previously supplied libc++.
          # A headless C++ binary still NEEDS SDK libc++, libc++abi, unwind
          # and clang compiler-rt, all from pinned native toolchain binaries.
          target="app/.deps/native/ps5-payload-sdk/target/lib"
          builtins="$(clang-18 --print-resource-dir)/lib/linux/libclang_rt.builtins-x86_64.a"
          for lib in "$target/libc++.a" "$target/libc++abi.a" "$target/libunwind.a" "$builtins"; do
            test -s "$lib" || { echo "Missing C++ runtime: $lib" >&2; exit 1; }
          done
          printf 'GROUP ( "%s" "%s" "%s" "%s" )\n' \
            "$PWD/$target/libc++.a" "$PWD/$target/libc++abi.a" \
            "$PWD/$target/libunwind.a" "$builtins" \
            > app/build/jb-json/libmeshcloud-cxx-runtime.a
      - name: Compile native PS5 daemon using shared TLS/P2P core
        working-directory: app
        env:
          USE_CCACHE: '0'
          BUILD_JOBS: '4'
          PS5_CLANG: clang-18
          APP_SOURCE_DIR: src/meshcloud-daemon
          PACBREW_INCLUDE_PATHS: include
          PACBREW_STATIC_ARCHIVES: 'lib/libssl.a lib/libcrypto.a lib/libsqlite3.a'
        run: make USE_CCACHE=0 BUILD_JOBS=4 app
      - name: Verify signed native PS5 installer and icon
        run: |
          python3 - <<'PY'
          import json,pathlib,struct,zipfile
          folder=pathlib.Path('app/dist/PPSA99718')
          code=(folder/'eboot.bin').read_bytes()
          assert len(code)>10000 and struct.unpack('<I',code[:4])[0]==0x1d3d154f
          assert b'MeshCloud v0.12' in code and b'39718' in code or b'39720' in code
          metadata=json.loads((folder/'sce_sys/param.json').read_text())
          assert metadata['titleId']=='PPSA99718' and metadata['contentVersion']=='01.000.006'
          for required in ['sce_sys/icon0.png','sce_module/libc.prx']:
            assert (folder/required).is_file(),required
          zipped=pathlib.Path('app/dist/PPSA99718.zip')
          with zipfile.ZipFile(zipped) as archive:
            assert archive.testzip() is None
            for required in ['eboot.bin','sce_sys/icon0.png','sce_module/libc.prx']:
              assert 'PPSA99718/'+required in archive.namelist()
          print('PS5 MeshCloud native secure headless-node installer verified')
          PY
      - name: Upload PS5 runnable network-node ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MeshCloud-PS5-Network-Node-v0.12-PPSA99718
          path: app/dist/PPSA99718.zip
          if-no-files-found: error
      - name: Publish explicitly labeled PS5 network-node prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view meshcloud-ps5-node-v0.12.0-prealpha >/dev/null 2>&1; then exit 0; fi
          gh release create meshcloud-ps5-node-v0.12.0-prealpha app/dist/PPSA99718.zip --target "$GITHUB_SHA" --prerelease --title "MeshCloud PS5 Network Node v0.12 (HEADLESS, no graphical UI)" --notes "Runs encrypted 13-GiB provisioning, independently signed audits and membership-gated P2P after explicit /data/PS5MeshCloud/node.conf setup. No OpenGL graphical UI. Independent auditor trust is mandatory. This is a PS5 native engineering preview."
