name: ThemeChanger PS5 FFmpeg capability test
on:
  push:
    branches: [fix/themechanger-v0.3.10-playback-persistence]
    paths: ['.github/workflows/themechanger-ffmpeg-capability.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y pkg-config clang-18 lld-18 libssl-dev wget
      - name: Probe portable PS5 ffmpeg/x264 static libraries
        run: |
          set -eu
          git clone --depth=1 https://github.com/Yahballon/PS5-DevBridge.git /tmp/devbridge
          cp -a /tmp/devbridge/templates/simple-calc ./app
          cd app
          bash tools/setup-pacbrew-dependencies.sh --list | grep -Ei 'avcodec|avformat|avutil|swscale|x264|openssl' || true
          bash tools/setup-pacbrew-dependencies.sh --resolve libavformat libavcodec libswscale libavutil x264 | head -c 2500
