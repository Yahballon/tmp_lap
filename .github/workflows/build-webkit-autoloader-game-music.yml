name: Build WebKit Autoloader GAME - Custom Icon, Music and Background
on:
  workflow_dispatch:
    inputs:
      soundtrack_url:
        description: 'Optional HTTPS URL to an MP3 you may redistribute (or commit soundtrack.mp3)'
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - 'homebrew/ps5-webkit-autoloader-game/soundtrack.mp3'
      - 'homebrew/ps5-webkit-autoloader-game/icon.png'
      - 'homebrew/ps5-webkit-autoloader-game/background.png'
permissions:
  contents: read
jobs:
  build-game-with-menu-music:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      MUSIC_URL: ${{ inputs.soundtrack_url || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Get soundtrack
        run: |
          set -euo pipefail
          mkdir -p /tmp/wkal-audio
          if [ -f 'homebrew/ps5-webkit-autoloader-game/soundtrack.mp3' ]; then
            cp 'homebrew/ps5-webkit-autoloader-game/soundtrack.mp3' /tmp/wkal-audio/song.mp3
          elif [ -n "$MUSIC_URL" ]; then
            [[ "$MUSIC_URL" == https://* ]] || { echo 'HTTPS URL required'; exit 1; }
            curl --fail --location --retry 3 --max-time 120 --max-filesize 20000000 "$MUSIC_URL" -o /tmp/wkal-audio/song.mp3
          else
            echo 'Missing soundtrack.mp3. Upload it to homebrew/ps5-webkit-autoloader-game/ or provide an HTTPS URL when dispatching.'
            exit 1
          fi
          test -s /tmp/wkal-audio/song.mp3
      - name: Verify user-supplied 512x512 JAILBREAK ME icon
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('homebrew/ps5-webkit-autoloader-game/icon.png')
          if not p.is_file():
              raise SystemExit('ERROR: Upload your JAILBREAK ME icon.png to homebrew/ps5-webkit-autoloader-game/ before building. Refusing to release default icon.')
          b=p.read_bytes()
          if b[:8]!=b'\x89PNG\r\n\x1a\n' or len(b)<32:
              raise SystemExit('icon.png must be a valid PNG')
          dims=tuple(int.from_bytes(b[o:o+4],'big') for o in (16,20))
          if dims!=(512,512):
              raise SystemExit(f'icon.png must be 512x512, got {dims}')
          print('Custom game tile icon verified:',len(b),'bytes')
          PY
      - name: Verify uploaded game selection background
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('homebrew/ps5-webkit-autoloader-game/background.png')
          if not p.is_file():
              raise SystemExit('Upload the provided background.png to homebrew/ps5-webkit-autoloader-game/ to include the 4K home-screen artwork.')
          if p.stat().st_size > 15000000:
              raise SystemExit('Background PNG exceeds 15MB limit')
          if p.read_bytes()[:8]!=b'\x89PNG\r\n\x1a\n':
              raise SystemExit('background.png is not a PNG')
          print('User-provided background found:',p.stat().st_size,'bytes')
          PY
      - name: Fetch pinned WebKit v0.4.0 and PS5 AT9 encoder
        run: |
          set -euo pipefail
          git clone https://github.com/itsPLK/ps5-webkit-autoloader.git upstream-wkal
          git -C upstream-wkal checkout --detach 137f065d2ba8022ba8e796895e7cb05c204f2ce9
          git -C upstream-wkal submodule update --init --recursive
          git clone --depth 1 --branch v0.1.0 https://github.com/blackbearreloaded/ps5-at9-converter.git /tmp/ps5-at9-converter
          cp homebrew/ps5-webkit-autoloader-game/icon.png upstream-wkal/assets/icon-custom.png
      - name: Encode 60-second looping PS5 selection music
        run: |
          set -euo pipefail
          python3 -m venv /tmp/wkal-at9-venv
          /tmp/wkal-at9-venv/bin/pip install 'numpy>=1.20,<3'
          /tmp/wkal-at9-venv/bin/python /tmp/ps5-at9-converter/ps5_at9.py \
            --input /tmp/wkal-audio/song.mp3 \
            --output upstream-wkal/assets/snd0.at9 \
            --start 0 --duration 60 --bitrate 192 --workers 4 \
            --param-json upstream-wkal/assets/param.json.template
      - name: Encode 4K BC7 DDS for PS5 Game selection and launch
        timeout-minutes: 35
        run: |
          set -euo pipefail
          /tmp/wkal-at9-venv/bin/pip install 'Pillow>=10,<13'
          /tmp/wkal-at9-venv/bin/python homebrew/ps5-webkit-autoloader-game/prepare_background.py \
            homebrew/ps5-webkit-autoloader-game/background.png upstream-wkal/assets --prepare
          git clone https://github.com/richgel999/bc7enc_rdo.git /tmp/wkal-bc7enc
          git -C /tmp/wkal-bc7enc checkout --detach b9438627eef73a1157e84201b6fa6eb2ffd6d9f0
          cmake -S /tmp/wkal-bc7enc -B /tmp/wkal-bc7enc/build \
            -DCMAKE_BUILD_TYPE=Release -DSUPPORT_BC7E=FALSE
          cmake --build /tmp/wkal-bc7enc/build -j 4
          /tmp/wkal-bc7enc/build/bc7enc -q -g -C -u3 \
            upstream-wkal/assets/background-4k.png upstream-wkal/assets/pic0.dds
          /tmp/wkal-at9-venv/bin/python \
            homebrew/ps5-webkit-autoloader-game/prepare_background.py \
            upstream-wkal/assets/pic0.dds --verify
          cp upstream-wkal/assets/pic0.dds upstream-wkal/assets/pic1.dds
      - name: Patch game identity, icon, home screen music and registration
        run: |
          set -euo pipefail
          python3 homebrew/ps5-webkit-autoloader-game/patch_game.py upstream-wkal
          python3 homebrew/ps5-webkit-autoloader-game/patch_music.py upstream-wkal
          python3 homebrew/ps5-webkit-autoloader-game/stage_sqlite.py upstream-wkal
          python3 homebrew/ps5-webkit-autoloader-game/patch_presentation.py upstream-wkal
          python3 homebrew/ps5-webkit-autoloader-game/patch_background.py upstream-wkal
          python3 homebrew/ps5-webkit-autoloader-game/patch_icon.py upstream-wkal
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('upstream-wkal')
          j=json.loads((root/'assets/param.json.template').read_text())
          song=(root/'assets/snd0.at9').read_bytes()
          assert j['titleId']=='WKAG00001' and j['applicationCategoryType']==0
          assert j['deeplinkUri']=='http://127.0.0.1:18181/app/index.html'
          assert j['pubtools']['loudnessSnd0']
          assert song.startswith(b'RIFF') and song[8:12]==b'WAVE'
          assert len(song)<=2097152
          installer=(root/'src/app_installer.c').read_text()
          assert '/user/appmeta/%s/icon0.png' in installer
          assert '/user/appmeta/%s/snd0.at9' in installer
          assert 'MUSIC_DB_REGISTER' in installer
          assert 'BACKGROUND_DB_REGISTER' in installer
          assert 'pic0_dds' in installer
          assert 'vendor/sqlite/sqlite3.c' in (root/'Makefile').read_text()
          print(f'PS5 Game selection music ready ({len(song)} bytes)')
          PY
      - name: Build PS5 SDK image
        working-directory: upstream-wkal
        run: docker build --pull -t ps5-webkit-autoloader-sdk -f Dockerfile.sdk .
      - name: Compile WebKit installer and PC host
        working-directory: upstream-wkal
        env:
          BUILD_TYPE: stable
        run: |
          set -euo pipefail
          ./build_release.sh
          test -s webkit-autoloader-installer_v0.4.0.elf
          test -s webkit-autoloader-host_v0.4.0.py
      - name: Verify music embedded in native ELF and stage test files
        working-directory: upstream-wkal
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('assets/param.json').read_text())
          assert p['titleId']=='WKAG00001'
          assert p['applicationCategoryType']==0 and p['pubtools']['loudnessSnd0']
          elf=Path('webkit-autoloader-installer_v0.4.0.elf').read_bytes()
          icon=Path('assets/icon0.png').read_bytes()
          custom=Path('assets/icon-custom.png').read_bytes()
          assert icon==custom, 'ERROR: original icon overwrote JAILBREAK ME icon'
          assert icon in elf, 'ERROR: user-supplied PS5 game icon not embedded in installer'
          sound=Path('assets/snd0.at9').read_bytes()
          assert b'WKAG00001' in elf
          assert sound in elf, 'ERROR: soundtrack not embedded in installer'
          background=Path('assets/pic0.dds').read_bytes()
          assert background==Path('assets/pic1.dds').read_bytes()
          assert background in elf, 'ERROR: user-provided 4K Game background not embedded in installer'
          assert b'BACKGROUND_DB_REGISTER' in elf
          assert b'http://127.0.0.1:18181/app/index.html' in elf
          print('ELF contains custom JAILBREAK ME icon + snd0.at9 + 4K BC7 background + Game category')
          PY
          mkdir -p ../game-build-with-music
          cp webkit-autoloader-installer_v0.4.0.elf ../game-build-with-music/webkit-autoloader-GAME-ICON-MUSIC-BG-installer_v0.4.0.elf
          cp webkit-autoloader-host_v0.4.0.py ../game-build-with-music/webkit-autoloader-GAME-MUSIC-host_v0.4.0.py
          cp assets/snd0.at9 ../game-build-with-music/snd0.at9
          cp assets/icon0.png ../game-build-with-music/icon0.png
          cp assets/pic0.dds ../game-build-with-music/pic0.dds
          cp assets/pic1.dds ../game-build-with-music/pic1.dds
          cp assets/param.json ../game-build-with-music/param.json
          (cd ../game-build-with-music && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: PS5-WebKit-Autoloader-GAME-ICON-MUSIC-BG-v0.4.0
          path: game-build-with-music/
          if-no-files-found: error
          retention-days: 30
