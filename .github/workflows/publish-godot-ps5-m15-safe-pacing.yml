name: Publish Godot PS5 M15 Safe Pacing TESTBUILD
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful signed M13 native frame profiler build from trusted feature branch"
        required: true
  workflow_run:
    workflows: ['Godot PS5 M15 Safe Present Pacing MainLoop Profiler v0.1.9']
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-godot-ps5-m15-safe-pacing
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'perf/godot-ps5-m15-safe-pacing' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == 'Yahballon/tmp_lap')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Strictly verify successful signed native build from trusted branch
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.PS5_RELEASE_TOKEN || github.token }}
          PARENT_RUN: ${{ github.event.workflow_run.id || '0' }}
          REQUESTED_RUN: ${{ inputs.run_id || '0' }}
        run: |
          set -euo pipefail
          run="$PARENT_RUN"
          if [ "$run" = 0 ]; then run="$REQUESTED_RUN"; fi
          [[ "$run" =~ ^[0-9]+$ ]] || exit 2
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > /tmp/m15-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" > /tmp/m15-artifacts.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.load(open('/tmp/m15-run.json'))
          assert r['repository']['full_name']=='Yahballon/tmp_lap'
          assert r['head_repository']['full_name']=='Yahballon/tmp_lap'
          assert r['head_branch']=='perf/godot-ps5-m15-safe-pacing'
          assert r['name']=='Godot PS5 M15 Safe Present Pacing MainLoop Profiler v0.1.9'
          assert r['event']=='push'
          assert r['status']=='completed' and r['conclusion']=='success'
          matches=[a for a in json.load(open('/tmp/m15-artifacts.json'))['artifacts']
            if a['name']=='Godot-PS5-M15-SAFE-PACING-v0.1.9-PS5-HARDWARE-UNTESTED'
            and not a['expired'] and a.get('workflow_run',{}).get('head_sha')==r['head_sha']]
          assert len(matches)==1, f'M13 signed native profiler artifact missing: {matches}'
          Path('/tmp/m15-build-sha').write_text(r['head_sha'])
          print('GODOT_PS5_M15_SIGNED_RELEASE_SOURCE_VERIFIED',r['id'],r['head_sha'])
          PY
          mkdir -p /tmp/m15-release
          gh run download "$run" --repo "$GITHUB_REPOSITORY" \
            --name Godot-PS5-M15-SAFE-PACING-v0.1.9-PS5-HARDWARE-UNTESTED \
            --dir /tmp/m15-release
          test -s /tmp/m15-release/PPSA99847.zip
      - name: Independently validate installable PS5 signed AudioOut title
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,struct,zipfile
          p=Path('/tmp/m15-release/PPSA99847.zip')
          assert p.stat().st_size>1_000_000
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert all(n.startswith('PPSA99847/') and '..' not in Path(n).parts for n in names)
              for name in ('eboot.bin','assets/godot/visual-smoke.pck',
                    'assets/godot/physics-smoke.pck','assets/godot/m10b-font-ui.pck'):
                  assert 'PPSA99847/'+name in names
              data=z.read('PPSA99847/eboot.bin')
              assert len(data)>5_000_000 and data[:4]==struct.pack('<I',0x1d3d154f)
              meta=json.loads(z.read('PPSA99847/sce_sys/param.json'))
              assert meta['titleId']=='PPSA99847'
              assert meta['contentId']=='UP9000-PPSA99847_00-GODOTGLES3CANVAS'
              assert meta['contentVersion']=='01.000.010'
          print('GODOT_PS5_M15_SIGNED_ZIP_OK',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Publish v0.1.9 PS5 native frame-profiler TESTBUILD (experimental)
        env:
          GH_TOKEN: ${{ secrets.PS5_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          tag=godot-ps5-gles3-canvas-v0.1.9
          cat > /tmp/m15-notes.md <<'NOTES'
          Godot PS5 v0.1.9 – SAFE VSync DEFAULT, bounded file IO diagnostics and main thread profiler.
          
          Physical M14 v0.1.8 PS5 TAR #33 verified that immediate EGL swap interval=0 caused severe 1–2 second CPU-before-swap stalls. This v0.1.9 returns to original working interval=1 whenever present_mode.txt is absent. Explicit "immediate" remains optional for controlled experiments; "vsync" enforces the stable mode.
          Godot's PS5 resource reader now limits successful OPEN_OK logging to eight occurrences, avoiding repeated unbuffered log writes in gameplay. File IO functionality and failure reporting remain unchanged.
          M15 new diagnostic logs report exact main thread phases (controller polling, display events, Main::iteration, outside loop): GODOT_PS5_M15_ITER_SPIKE and GODOT_PS5_M15_ITER_5S. M13 CPU/EGL swap profiler remains available.
          This is a regression rollback plus diagnostics, not a proven cure for the original 133–150ms stalls. Keep m12d-platformer-asset2201.pck, original game assets/saves, audio and controls.
          Reinstall v0.1.7 if needed. Read: https://github.com/Yahballon/tmp_lap/pull/256

          NOTES
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx PPSA99847.zip
          else
            gh release create "$tag" /tmp/m15-release/PPSA99847.zip \
              --repo "$GITHUB_REPOSITORY" --target perf/godot-ps5-m15-safe-pacing \
              --title 'Godot PS5 GLES3 Canvas v0.1.9 – Safe VSync and MainLoop Profiler' \
              --notes-file /tmp/m15-notes.md --prerelease
          fi
      - name: Update TESTBUILDS version.json with verified release
        env:
          GH_TOKEN: ${{ secrets.PS5_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          python3 tools/test-version-catalog.py
          python3 tools/test-catalog-triggers.py
          python3 tools/update-version.py
          python3 -m json.tool version.json >/dev/null
          python3 - <<'PY'
          import json
          j=json.load(open('version.json'))
          matches=[x for x in j['apps'] if x['title_id']=='PPSA99847']
          assert len(matches)==1
          app=matches[0]
          assert app['version']=='0.1.9'
          assert app['tag']=='godot-ps5-gles3-canvas-v0.1.9'
          assert app['zip_url'].endswith('/PPSA99847.zip')
          assert j['app_count']==len(j['apps'])
          print('GODOT_PS5_M15_TESTBUILD_CATALOG_OK')
          PY
          if [ -n "$(git status --porcelain -- version.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add version.json
            git commit -m 'chore(testbuilds): publish Godot PS5 safe pacing v0.1.9 [skip ci]'
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              git push origin HEAD:main && exit 0
              sleep 3
            done
            exit 1
          fi
