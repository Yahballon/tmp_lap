name: Validate Godot PS5 Engine Foundation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'homebrew/godot-ps5/**'
      - '.github/workflows/build-godot-ps5.yml'
  push:
    branches: [main, feature/godot-ps5-engine-foundation]
    paths:
      - 'homebrew/godot-ps5/**'
      - '.github/workflows/build-godot-ps5.yml'
permissions:
  contents: write
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate platform overlay and PCK screening
        run: |
          set -euo pipefail
          python3 -m py_compile homebrew/godot-ps5/engine/platform/ps5/detect.py
          python3 homebrew/godot-ps5/scripts/check_overlay.py
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror homebrew/godot-ps5/tests/pck_locator_test.cpp -o /tmp/godot-ps5-test
          /tmp/godot-ps5-test
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror homebrew/godot-ps5/tests/pck_native_mock_test.cpp -o /tmp/godot-ps5-native-mock
          /tmp/godot-ps5-native-mock
          python3 homebrew/godot-ps5/tests/test_static_bundle.py
          python3 homebrew/godot-ps5/tests/test_native_link_stage.py
          python3 homebrew/godot-ps5/tests/test_resolve_weak_tls.py
          python3 homebrew/godot-ps5/tests/test_patch_ps5_kvm.py
          python3 homebrew/godot-ps5/tests/test_engine_phases.py
          python3 homebrew/godot-ps5/tests/test_patch_ps5_setup_trace.py
          python3 homebrew/godot-ps5/tests/test_ps5_path_override.py
          python3 homebrew/godot-ps5/tests/test_path_override_build_flag.py
          python3 homebrew/godot-ps5/tests/test_native_file_access.py
          python3 -m py_compile homebrew/godot-ps5/scripts/patch_ps5_post_settings_trace.py
          python3 homebrew/godot-ps5/tests/test_post_settings_trace.py
      - name: Produce and execute genuine Godot 4.7.2 smoke PCK on Linux
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot-linux.zip
          mkdir -p /tmp/godot-linux
          unzip -q /tmp/godot-linux.zip -d /tmp/godot-linux
          godot=/tmp/godot-linux/Godot_v4.7.2-stable_linux.x86_64
          chmod +x "$godot"
          "$godot" --headless --path homebrew/godot-ps5/samples/script-smoke \
            --script res://make_pack.gd | tee /tmp/godot-pack-log.txt
          grep -Fq GODOT_PS5_PCK_WRITTEN /tmp/godot-pack-log.txt
          test -s homebrew/godot-ps5/samples/script-smoke/smoke.pck
          "$godot" --headless --main-pack homebrew/godot-ps5/samples/script-smoke/smoke.pck \
            --quit-after 60 | tee /tmp/godot-run-log.txt
          grep -Fq GODOT_PS5_SMOKE_READY /tmp/godot-run-log.txt
      - name: Upload genuine Godot 4 GDScript fixture (NOT a PS5 executable)
        uses: actions/upload-artifact@v4
        with:
          name: godot-4-gdscript-smoke-pck-NOT-PS5
          path: homebrew/godot-ps5/samples/script-smoke/smoke.pck
          if-no-files-found: error

  engine-cross-compile:
    runs-on: ubuntu-24.04
    needs: host-tests
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot SCons + PS5 toolchain prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 lld-18 scons \
            git make pkg-config python3 unzip wget ca-certificates
      - name: Clone pinned Godot 4.7.2 and DevBridge
        run: |
          git clone --depth=1 --branch 4.7.2-stable https://github.com/godotengine/godot.git /tmp/godot
          git clone --depth=1 https://github.com/Yahballon/PS5-DevBridge.git /tmp/devbridge
      - name: Set up pinned open PS5 payload SDK
        run: |
          set -euo pipefail
          # Use the official zlib 1.3.2 GitHub release mirror, preserving
          # DevBridge's pinned SHA-256 verification unchanged.
          sed -i 's|https://zlib.net/fossils/|https://github.com/madler/zlib/releases/download/v1.3.2/|g' \
            /tmp/devbridge/templates/simple-calc/tools/setup-native-dependencies.sh
          bash /tmp/devbridge/templates/simple-calc/tools/setup-native-dependencies.sh
      - name: Cross-compile real upstream Godot source
        env:
          GODOT_SOURCE: /tmp/godot
          PS5_PAYLOAD_SDK: /tmp/devbridge/templates/simple-calc/.deps/native/ps5-payload-sdk
          PS5_CLANG: clang-18
          BUILD_JOBS: '4'
        run: |
          set -euo pipefail
          bash homebrew/godot-ps5/scripts/build-engine.sh
          # SCons emits separate core/main/scene/servers/GDScript .a libs.
          # The original upload of bin/*.a only had a 21 KB platform shim.
          python3 homebrew/godot-ps5/scripts/package_static_engine.py \
            /tmp/godot /tmp/Godot-PS5-FULL-STATIC-ENGINE-NOT-PLAYABLE.zip --min-archives 8
      - name: Retrieve genuine Godot 4 GDScript smoke fixture
        uses: actions/download-artifact@v4
        with:
          name: godot-4-gdscript-smoke-pck-NOT-PS5
          path: /tmp/godot-smoke-pck
      - name: Attempt native PS5 eboot link against ACTUAL Godot engine
        id: godot_link
        continue-on-error: true
        run: |
          set -euo pipefail
          cp -a /tmp/devbridge/templates/simple-calc /tmp/godot-link-app
          mkdir -p /tmp/godot-link-app/assets/godot
          cp /tmp/godot-smoke-pck/smoke.pck /tmp/godot-link-app/assets/godot/smoke.pck
          python3 homebrew/godot-ps5/scripts/stage_native_link.py \
            --godot /tmp/godot \
            --app /tmp/godot-link-app \
            --entry homebrew/godot-ps5/native/engine_smoke_main.cpp
          if (
            cd /tmp/godot-link-app
            env PS5_CLANG=clang-18 USE_CCACHE=0 BUILD_JOBS=4 \
              make USE_CCACHE=0 BUILD_JOBS=4 app
          ) 2>&1 | tee /tmp/godot-ps5-native-link.log; then
            echo "PS5 engine binary linked and converted on first pass"
          else
            test -s /tmp/godot-link-app/build/llvm-pie.elf
            python3 homebrew/godot-ps5/scripts/resolve_weak_tls.py \
              --elf /tmp/godot-link-app/build/llvm-pie.elf \
              --build-sh /tmp/godot-link-app/tools/build.sh | tee -a /tmp/godot-ps5-native-link.log
            (
              cd /tmp/godot-link-app
              env PS5_CLANG=clang-18 USE_CCACHE=0 BUILD_JOBS=4 \
                make USE_CCACHE=0 BUILD_JOBS=4 app
            ) 2>&1 | tee -a /tmp/godot-ps5-native-link.log
          fi
          test -s /tmp/godot-link-app/dist/PPSA99843/eboot.bin
          echo "GODOT_ENGINE_EBOOT_LINK_SUCCESS" | tee -a /tmp/godot-ps5-native-link.log
      - name: Validate native Godot engine smoke installer
        if: steps.godot_link.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json, pathlib, struct, zipfile
          app=pathlib.Path("/tmp/godot-link-app/dist/PPSA99843")
          elf=(app/"eboot.bin").read_bytes()
          assert len(elf)>4096 and elf[:4]==struct.pack("<I",0x1d3d154f)
          meta=json.loads((app/"sce_sys/param.json").read_text())
          assert meta["titleId"]=="PPSA99843"
          assert meta["contentId"]=="UP9000-PPSA99843_00-GODOTPS5HEADLESS"
          assert meta["contentVersion"]=="01.000.010"
          archive=app.parent/"PPSA99843.zip"
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              assert "PPSA99843/eboot.bin" in z.namelist()
              assert "PPSA99843/assets/godot/smoke.pck" in z.namelist()
          print("Genuine Godot engine headless PS5 binary linked and package structurally verified.")
          PY
      - name: Upload REAL Godot engine headless installer for hardware testing
        if: steps.godot_link.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Godot-PS5-GDScript-Engine-Smoke-v0.2.9-UNVERIFIED-ON-CONSOLE
          path: /tmp/godot-link-app/dist/PPSA99843.zip
          if-no-files-found: error
      # Publishing is handled by the trusted default-branch workflow
      # .github/workflows/publish-godot-ps5-engine.yml (workflow_run).
      # Never create GitHub releases from the feature-branch engine builder:
      # gh release create --target feature SHA returns HTTP 403 here.
      - name: Upload PS5 linker diagnostics for unresolved symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-ps5-native-link-logs
          path: /tmp/godot-ps5-native-link.log
          if-no-files-found: warn
      - name: Archive FULL engine static libraries (NOT a PS5 app)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-ps5-complete-static-archives-NOT-PLAYABLE
          path: /tmp/Godot-PS5-FULL-STATIC-ENGINE-NOT-PLAYABLE.zip
          if-no-files-found: error
      - name: Require real Godot native linker success
        if: steps.godot_link.outcome == 'failure'
        run: |
          echo "Godot cross-compiled, but native PS5 eboot link has unresolved errors." >&2
          echo "Inspect godot-ps5-native-link-logs artifact; do not publish a fake gameplay release." >&2
          exit 1
