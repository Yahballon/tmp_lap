name: Verify WKAL GAME Presentation Patches
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'homebrew/ps5-webkit-autoloader-game/patch_*.py'
      - '.github/workflows/verify-webkit-autoloader-patches.yml'
permissions:
  contents: read
jobs:
  smoke-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Lint patch scripts
        run: |
          set -euo pipefail
          python3 -m py_compile homebrew/ps5-webkit-autoloader-game/patch_*.py
      - name: Fetch pinned v0.4.0 upstream with submodules
        run: |
          set -euo pipefail
          git clone https://github.com/itsPLK/ps5-webkit-autoloader.git upstream-wkal
          git -C upstream-wkal checkout --detach 137f065d2ba8022ba8e796895e7cb05c204f2ce9
          git -C upstream-wkal submodule update --init --recursive
      - name: Create synthetic test-only icon and sound fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,struct,zlib
          base=Path('upstream-wkal/assets')
          # Synthetic icon has a unique known CRC. NEVER upload this as an app.
          w=h=512
          scan=b''.join(b'\x00'+b'\x00\x88\xcc\xff'*w for _ in range(h))
          def chunk(t,v):
              return struct.pack('>I',len(v))+t+v+struct.pack('>I',zlib.crc32(t+v)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(scan,9))+chunk(b'IEND',b'')
          (base/'icon-custom.png').write_bytes(png)
          dummy=b'RIFF'+struct.pack('<I',300)+b'WAVE'+b'\x00'*(308-12)
          (base/'snd0.at9').write_bytes(dummy)
          meta=base/'param.json.template'
          obj=json.loads(meta.read_text())
          obj['pubtools']={'loudnessSnd0':'-28.00'}
          meta.write_text(json.dumps(obj,indent=2)+'\n')
          # DX10 BC7 4K DDS header with dummy payload (only for ELF smoke tests).
          hdr=bytearray(148)
          hdr[0:4]=b'DDS '
          struct.pack_into('<I',hdr,4,124)
          struct.pack_into('<II',hdr,12,2160,3840)
          struct.pack_into('<I',hdr,28,1)
          hdr[84:88]=b'DX10'
          struct.pack_into('<IIIII',hdr,128,98,3,0,1,0)
          (base/'pic0.dds').write_bytes(hdr + bytes((3840//4)*(2160//4)*16))
          print('Created synthetic fixtures (NOT for PS5 use)')
          PY
      - name: Apply all patches
        run: |
          set -euo pipefail
          python3 homebrew/ps5-webkit-autoloader-game/patch_game.py upstream-wkal
          python3 homebrew/ps5-webkit-autoloader-game/patch_music.py upstream-wkal
          python3 homebrew/ps5-webkit-autoloader-game/stage_sqlite.py upstream-wkal
          python3 homebrew/ps5-webkit-autoloader-game/patch_presentation.py upstream-wkal
          python3 homebrew/ps5-webkit-autoloader-game/patch_background.py upstream-wkal
          python3 homebrew/ps5-webkit-autoloader-game/patch_icon.py upstream-wkal
          python3 homebrew/ps5-webkit-autoloader-game/patch_title.py upstream-wkal
          cp homebrew/ps5-webkit-autoloader-game/background.png upstream-wkal/frontend/installer-page/background.png
          python3 homebrew/ps5-webkit-autoloader-game/patch_cyber_ui.py upstream-wkal
          python3 homebrew/ps5-webkit-autoloader-game/patch_exploit_ui.py upstream-wkal
          grep -F 'MUSIC_DB_REGISTER' upstream-wkal/src/app_installer.c
      - name: Validate embedded browser JavaScript and installer behavior
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          page=Path('upstream-wkal/frontend/installer-page/index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',page,re.S)
          assert len(scripts)==2, 'Expected cyber status hook and intact upstream WebKit installer logic'
          for i,code in enumerate(scripts):
              Path(f'/tmp/wkal-js-{i}.js').write_text(code)
          for needed in ('/logs?pos=', '/install', '/version', 'applicationCache', '/clear-webkit-data', 'setCacheCorrupted', 'goToAutoloader', 'window.wkalCyberStage'):
              assert needed in page, needed
          assert '<aside class="rail"' in page and 'AUTO-INSTALL SEQUENCE' in page
          assert 'ui=cyberpirate1' in Path('upstream-wkal/src/main.c').read_text()
          app=Path('upstream-wkal/frontend/autoloader')
          assert 'JAILBREAK ME' in (app/'index.html').read_text()
          assert 'jailbreakHeader' in (app/'index.html').read_text()
          assert 'MAX_LOG_LINES = 48' in (app/'app.js').read_text()
          assert 'JAILBREAK ME Cyber Pirate' in (app/'style.css').read_text()
          assert "exploitEl.src = EXPLOIT_URL" in (app/'app.js').read_text()
          assert 'Launch Exploit' not in page and 'Open Payloads' not in page
          print('Original installer logic and buttonless live UI both preserved')
          PY
          node --check /tmp/wkal-js-0.js
          node --check /tmp/wkal-js-1.js
          node --check upstream-wkal/frontend/autoloader/app.js
      - name: Build PS5 SDK environment
        working-directory: upstream-wkal
        run: docker build --pull -t ps5-webkit-autoloader-sdk -f Dockerfile.sdk .
      - name: Native PS5 ELF smoke build
        working-directory: upstream-wkal
        env:
          BUILD_TYPE: stable
        run: |
          set -euo pipefail
          ./build_release.sh
          python3 - <<'PY'
          from pathlib import Path
          elf=Path('webkit-autoloader-installer_v0.4.0.elf').read_bytes()
          icon=Path('assets/icon-custom.png').read_bytes()
          snd=Path('assets/snd0.at9').read_bytes()
          assert Path('assets/icon0.png').read_bytes()==icon
          assert icon in elf and snd in elf
          background=Path('assets/pic0.dds').read_bytes()
          assert background in elf
          assert b'BACKGROUND_DB_REGISTER' in elf
          assert b'TITLE_DB_REGISTER' in elf
          assert b'JAILBREAK ME' in elf
          registry=Path('include/file_registry.c').read_text()
          page=Path('frontend/dist/index.html').read_text()
          assert 'AUTO-INSTALL SEQUENCE' in page
          assert '/index.html' in registry and '/background.png' in registry
          app_index=list(Path('frontend/dist/app').glob('v*/index.html'))
          assert len(app_index)==1 and 'JAILBREAK ME' in app_index[0].read_text()
          assert b'jailbreakHeader' in elf and b'jailbreakFirmware' in elf
          assert b'/index.html' in elf and b'/background.png' in elf
          import json
          param=json.loads(Path('assets/param.json').read_text())
          assert param['localizedParameters']['en-US']['titleName']=='JAILBREAK ME'
          for token in (b'WKAG00001',b'/user/appmeta/%s/snd0.at9',b'/user/appmeta/%s/icon0.png',b'snd0info'):
              assert token in elf, token
          print('PS5 ELF smoke-build passed: both cyber-pirate UI pages + original exploit chain; synthetic assets NOT published')
          PY
