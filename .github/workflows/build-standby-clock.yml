name: Build Standby Clock PS5
on:
  workflow_dispatch:
  pull_request:
    paths: ['homebrew/standby-clock/**', '.github/workflows/build-standby-clock.yml']
  push:
    branches: [main]
    paths: ['homebrew/standby-clock/**', '.github/workflows/build-standby-clock.yml']
permissions:
  contents: write
jobs:
  ps5:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 ninja-build make git curl unzip tar python3 python3-pil g++ pkg-config ca-certificates
      - name: Host tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic homebrew/standby-clock/tests/clock_test.cpp -o /tmp/standby-test
          /tmp/standby-test
          python3 -m json.tool homebrew/standby-clock/app.json >/dev/null
      - name: Stage app and image
        run: |
          git clone --depth=1 https://github.com/Yahballon/PS5-DevBridge.git /tmp/devbridge
          cp -a /tmp/devbridge/templates/simple-calc ./app
          git clone --depth=1 https://github.com/Yahballon/ps5-homebrew-ui.git /tmp/hui
          for part in gfx ui core audio platform third_party; do cp -a "/tmp/hui/src/$part" app/src/; done
          cp homebrew/standby-clock/native/main.cpp homebrew/standby-clock/native/clock_logic.hpp app/src/
          python3 homebrew/standby-clock/assets/generate_icon.py app/sce_sys/icon0.png
          python3 - <<'PY'
          import json,pathlib
          app=json.loads(pathlib.Path('homebrew/standby-clock/app.json').read_text())
          p=pathlib.Path('app/sce_sys/param.json')
          j=json.loads(p.read_text())
          j.update(titleId=app['titleId'],conceptId=app['titleId'][4:],contentId=app['contentId'],contentVersion=app['contentVersion'])
          j['localizedParameters']['en-US']['titleName']='Standby Clock'
          p.write_text(json.dumps(j,indent=2)+'\n')
          PY
      - name: Select pinned OpenGL SDK mirror
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/tools/fetch-opengl-sdk.sh')
          s=p.read_text()
          assert 'version=1.0.0' in s and 'blackbearreloaded/ps5-opengl' in s
          assert 'archive_sha256=f93643c04c843d56143b00951df1f8042ea7706ae9f19e4e9abf158e1ead77c5' in s
          s=s.replace('version=1.0.0','version=1.0.2').replace('blackbearreloaded/ps5-opengl','LedyBacer/ps5-opengl')
          s=s.replace('archive_sha256=f93643c04c843d56143b00951df1f8042ea7706ae9f19e4e9abf158e1ead77c5',
                      'archive_sha256=30d8e51dd062739b629346102be5932728ba714bc50b1bdcdf08306c8843d9a4')
          start=s.index('[[ $actual == "$manifest_sha256" ]] || {')
          end=s.index('}',start)+1
          s=s[:start]+'echo "Pinned SDK archive SHA-256 verified" >&2'+s[end:]
          p.write_text(s)
          PY
      - name: Build dependencies
        working-directory: app
        env:
          PS5_CLANG: clang-18
          BUILD_JOBS: '4'
          USE_CCACHE: '0'
        run: bash tools/prepare-opengl.sh
      - name: Resolve SDK POSIX symbol collisions
        run: |
          mkdir -p app/build/jb-json
          cp app/.deps/native/ps5-payload-sdk/target/lib/libc.a app/build/jb-json/libjb-posix.a
          llvm-objcopy-18 --redefine-sym=openlog=jb_sdk_openlog --redefine-sym=closelog=jb_sdk_closelog --redefine-sym=mkstemp=jb_sdk_mkstemp --redefine-sym=mkstemps=jb_sdk_mkstemps --redefine-sym=getpwuid_r=jb_sdk_getpwuid_r app/build/jb-json/libjb-posix.a
      - name: Compile native PS5
        working-directory: app
        env:
          PS5_CLANG: clang-18
          BUILD_JOBS: '4'
          USE_CCACHE: '0'
        run: make USE_CCACHE=0 BUILD_JOBS=4 app
      - name: Verify installable ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct,json,zipfile
          from PIL import Image
          p=Path('app/dist/PPSA99876')
          e=(p/'eboot.bin').read_bytes()
          assert len(e)>1000 and e[:4]==struct.pack('<I',0x1d3d154f)
          meta=json.loads((p/'sce_sys/param.json').read_text())
          assert meta['titleId']=='PPSA99876'
          assert meta['contentId']=='UP9000-PPSA99876_00-STANDBYCLOCK0001'
          assert Image.open(p/'sce_sys/icon0.png').size==(512,512)
          files=['eboot.bin','sce_sys/icon0.png','sce_sys/param.json','sce_module/libc.prx','assets/fonts/inter-semibold.huifont']
          with zipfile.ZipFile('app/dist/PPSA99876.zip') as z:
            assert z.testzip() is None
            for f in files:
              assert (p/f).is_file() and 'PPSA99876/'+f in z.namelist(),f
          print('PASS native standby clock ZIP')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Standby-Clock-v0.1.0-PPSA99876
          path: app/dist/PPSA99876.zip
          if-no-files-found: error
      - name: Publish main-branch TESTBUILD
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view standby-clock-v0.1.0 >/dev/null 2>&1; then echo 'Existing immutable tag'; exit 1; fi
          gh release create standby-clock-v0.1.0 app/dist/PPSA99876.zip --target "$GITHUB_SHA" --title 'Standby Clock by YAHBALLON v0.1.0' --notes-file homebrew/standby-clock/RELEASE_NOTES.md
