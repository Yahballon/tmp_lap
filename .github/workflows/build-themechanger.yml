name: Build PS5 ThemeChanger
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'homebrew/themechanger/**'
      - '.github/workflows/build-themechanger.yml'
  pull_request:
    paths:
      - 'homebrew/themechanger/**'
      - '.github/workflows/build-themechanger.yml'
permissions:
  contents: write
jobs:
  native-ps5:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 ninja-build make wget curl unzip tar git python3 python3-pil pkg-config ca-certificates ffmpeg g++ libssl-dev
      - name: Discover complete MotionBGS sitemap and tag catalog
        timeout-minutes: 15
        run: python3 homebrew/themechanger/assets/motionbgs_catalog.py
      - name: Probe MotionBGS HD MP4 response
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          rows=[l.split('\t') for l in Path('homebrew/themechanger/generated/motionbgs/catalog.tsv').read_text().splitlines() if l and not l.startswith('#')]
          for row in [r for r in rows if r[3].startswith("https://motionbgs.com/dl/hd/")][:3]:
              url=row[3]
              assert url.startswith('https://motionbgs.com/dl/hd/')
              req=Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'video/mp4,*/*','Range':'bytes=0-63'})
              with urlopen(req,timeout=15) as response:
                  data=response.read(64)
                  print(row[1],response.status,response.headers.get('Content-Type'),response.geturl(),'ftyp=',data[4:8],flush=True)
                  assert data[4:8]==b'ftyp' and 'video' in response.headers.get('Content-Type','')
          PY
      - name: Prepare existing native PS5 UI kit
        run: |
          git clone --depth=1 https://github.com/Yahballon/PS5-DevBridge.git /tmp/devbridge
          cp -a /tmp/devbridge/templates/simple-calc ./app
          cp homebrew/themechanger/native/* app/src/
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/nothings/stb/2c980bb59875b0d32144a71867fbdebb2f77cd20/stb_image.h -o app/src/stb_image.h
          mkdir -p app/assets/motionbgs
          cp homebrew/themechanger/generated/motionbgs/catalog.tsv app/assets/motionbgs/catalog.tsv
          python3 - <<'PY'
          from pathlib import Path
          pem=Path('/etc/ssl/certs/ca-certificates.crt').read_text()
          Path('app/src/ca_bundle.inc').write_text('static constexpr char kCaBundle[] = R"PS5CABUNDLE('+pem+')PS5CABUNDLE";\n')
          PY
          python3 - <<'PY'
          import pathlib,json
          d=json.loads(pathlib.Path('homebrew/themechanger/app.json').read_text())
          p=pathlib.Path('app/sce_sys/param.json')
          j=json.loads(p.read_text())
          j.update(titleId=d['titleId'],conceptId=d['titleId'][-5:],contentId=d['contentId'],contentVersion=d['contentVersion'])
          j['localizedParameters']['en-US']['titleName']=d['name']
          p.write_text(json.dumps(j,indent=2)+'\n')
          PY
      - name: Verify native MotionBGS HTTPS downloader with real HD MP4
        timeout-minutes: 2
        run: |
          g++ -std=c++20 -O2 -pthread -Iapp/src \
            homebrew/themechanger/tests/test_native_download.cpp \
            app/src/motion_download.cpp -lssl -lcrypto \
            -o /tmp/themechanger-native-http-test
          preview=$(python3 - <<'PY'
          from pathlib import Path
          rows=[line.split('\t') for line in Path('homebrew/themechanger/generated/motionbgs/catalog.tsv').read_text().splitlines() if not line.startswith('#')]
          urls=[row[4] for row in rows if len(row)>=5 and row[4].startswith('https://motionbgs.com/')]
          print(urls[0] if urls else '')
          PY
          )
          test -n "$preview"
          timeout 65s /tmp/themechanger-native-http-test "$preview"
      - name: Test LiveShell API response and playback selection
        timeout-minutes: 2
        run: |
          g++ -std=c++20 -O2 -pthread -Ihomebrew/themechanger/native \
            homebrew/themechanger/tests/mock_liveshell.cpp \
            homebrew/themechanger/native/liveshell_client.cpp \
            homebrew/themechanger/native/theme_log.cpp \
            -o /tmp/themechanger-live-api-test
          python3 homebrew/themechanger/tests/mock_liveshell.py >/tmp/themechanger-mock.log 2>&1 &
          mock_pid=$!
          trap 'kill "$mock_pid" 2>/dev/null || true' EXIT
          sleep 1
          /tmp/themechanger-live-api-test
      - name: Prepare PS5 graphics SDK
        working-directory: app
        env:
          PS5_CLANG: clang-18
          USE_CCACHE: '0'
          BUILD_JOBS: '4'
        run: bash tools/prepare-opengl.sh
      - name: Compile integrated LiveShell from GPL source (no Media tile)
        timeout-minutes: 35
        env:
          PS5_CLANG: clang-18
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/aydencharles/onionHEN.git /tmp/theme-onionhen
          git clone --depth=1 --branch v1.1 https://github.com/ZiZc3/LiveShell.git /tmp/theme-upstream-liveshell
          python3 homebrew/themechanger/liveshell_build/patch_liveshell.py /tmp/theme-upstream-liveshell
          mkdir -p /tmp/theme-onionhen/source/liveshell
          cp /tmp/theme-upstream-liveshell/src/* /tmp/theme-onionhen/source/liveshell/
          cp /tmp/theme-upstream-liveshell/assets/icon0.png /tmp/theme-onionhen/source/liveshell/icon0.png
          # Build only payload dependencies required by LiveShell.
          # The unrelated OnionHEN utility app requires PS5 libcurl/Keystone,
          # which ThemeChanger neither links nor ships.
          sed -i -e '/^add_subdirectory(util)$/d' \
                 -e '/^add_subdirectory(bootstrapper)$/d' \
                 -e '/^add_subdirectory(unpacker)$/d' \
                 -e '/^add_subdirectory(daemon)$/d' \
                 -e '/^add_subdirectory(shellui)$/d' \
                 /tmp/theme-onionhen/source/CMakeLists.txt
          printf '\nadd_subdirectory(liveshell)\n' >> /tmp/theme-onionhen/source/CMakeLists.txt
          bash /tmp/theme-onionhen/scripts/sync_dependencies.sh
          export PS5_PAYLOAD_SDK="$GITHUB_WORKSPACE/app/.deps/native/ps5-payload-sdk"
          export PATH="/usr/lib/llvm-18/bin:$PS5_PAYLOAD_SDK/bin:$PATH"
          export LLVM_CONFIG=/usr/lib/llvm-18/bin/llvm-config
          "$PS5_PAYLOAD_SDK/bin/prospero-cmake" \
            -S /tmp/theme-onionhen/source \
            -B /tmp/theme-onionhen/build \
            -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DONIONHEN_KSTUFF_ELF=/tmp/theme-onionhen/.cache/dependencies/kstuff.elf \
            -DPS5_PAYLOAD_SDK="$PS5_PAYLOAD_SDK"
          cmake --build /tmp/theme-onionhen/build -j 4 --target liveshell
          cp /tmp/theme-onionhen/build/bin/liveshell.elf app/liveshell.elf
          python3 - <<'PY'
          from pathlib import Path
          src=Path('/tmp/theme-onionhen/source/liveshell/liveshell_daemon.cpp').read_text()
          elf=Path('app/liveshell.elf').read_bytes()
          assert 'strcmp(id, "PPSA99891") != 0' in src
          assert 'start_thread(after_start_thread);' not in src
          web=Path('/tmp/theme-onionhen/source/liveshell/liveshell_web.cpp').read_text()
          assert 'themechanger_engine' in web and '0.3.6' in web
          assert elf.startswith(b'\x7fELF\x02') and len(elf)>100000
          print('Custom GPL LiveShell, no Media tile, gamepause fix:',len(elf),'bytes')
          PY
      - name: Prepare POSIX compat
        run: |
          mkdir -p app/build/jb-json
          cp app/.deps/native/ps5-payload-sdk/target/lib/libc.a app/build/jb-json/libjb-posix.a
          llvm-objcopy-18 --redefine-sym=openlog=jb_sdk_openlog --redefine-sym=closelog=jb_sdk_closelog --redefine-sym=mkstemp=jb_sdk_mkstemp --redefine-sym=mkstemps=jb_sdk_mkstemps --redefine-sym=getpwuid_r=jb_sdk_getpwuid_r app/build/jb-json/libjb-posix.a
      - name: Build FSELF installer
        working-directory: app
        env:
          PS5_CLANG: clang-18
          USE_CCACHE: '0'
          BUILD_JOBS: '4'
        run: make USE_CCACHE=0 BUILD_JOBS=4 PACBREW_PACKAGES=openssl APP_ROOT_FILES=liveshell.elf app
      - name: Verify installer and assets
        run: |
          python3 - <<'PY'
          import pathlib,zipfile,struct,json
          title='PPSA99891'
          root=pathlib.Path('app/dist')/title
          binary=(root/'eboot.bin').read_bytes()
          assert len(binary)>1000
          assert struct.unpack('<I',binary[:4])[0]==0x1d3d154f
          j=json.loads((root/'sce_sys/param.json').read_text())
          assert j['titleId']==title
          assert not (root/'assets/wallpapers').exists(), 'Old bundled wallpapers must not be shipped'
          app_src=pathlib.Path('homebrew/themechanger/native/main.cpp').read_text()
          assert 'ThemeChanger-baseball.png' not in app_src
          assert 'const int total=12+' not in app_src
          assert 'consume_installed()' in app_src
          assert (root/'liveshell.elf').stat().st_size>100000
          manifest=(root/'assets/motionbgs/catalog.tsv').read_text()
          assert len(manifest.splitlines())>8000, 'Full sitemap should contain thousands of desktop wallpaper entries'
          assert any(len(r.split('\t'))>=6 for r in manifest.splitlines()[1:])
          assert 'https://motionbgs.com/dl/hd/' in manifest
          assert '/i/c/960x540/media/' in manifest
          with zipfile.ZipFile(f'app/dist/{title}.zip') as z:
              assert z.testzip() is None
              assert f'{title}/eboot.bin' in z.namelist()
              assert f'{title}/liveshell.elf' in z.namelist()
              assert f'{title}/assets/motionbgs/catalog.tsv' in z.namelist()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ThemeChanger-v0.3.8-PPSA99891
          path: app/dist/PPSA99891.zip
          if-no-files-found: error
      - name: Publish TESTBUILD-compatible release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view themechanger-v0.3.8 >/dev/null 2>&1; then exit 0; fi
          gh release create themechanger-v0.3.8 app/dist/PPSA99891.zip --target "$GITHUB_SHA" --title "ThemeChanger v0.3.8" --notes-file homebrew/themechanger/RELEASE_NOTES.md
