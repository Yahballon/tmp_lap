name: AndroidFlow Hydroid overlay checks
on:
  push:
    branches: [main, feature/androidflow-hydroid-coverflow]
    paths:
      - 'homebrew/androidflow/**'
      - '.github/workflows/check-androidflow.yml'
  pull_request:
    paths:
      - 'homebrew/androidflow/**'
      - '.github/workflows/check-androidflow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  overlay-host-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test GBAXY Coverflow pose math and wraparound
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic homebrew/androidflow/tests/coverflow_test.c -lm -o /tmp/androidflow-test
          /tmp/androidflow-test
      - name: Prepare icon image
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pil
          python3 homebrew/androidflow/assets/generate_icon.py /tmp/androidflow-icon.png
          python3 - <<'PY'
          from PIL import Image
          assert Image.open('/tmp/androidflow-icon.png').size == (512, 512)
          PY
      - name: Patch pinned upstream Hydroid sources
        run: |
          set -euo pipefail
          git clone https://github.com/ZiZc3/Hydroid.git .work/hydroid
          git -C .work/hydroid checkout --detach d8371afd75e3da6ab888d467d1e6bb00c32d2beb
          python3 homebrew/androidflow/tools/apply_overlay.py --source .work/hydroid
          grep -q 'yah_coverflow_pick' .work/hydroid/src/app_main.c
          grep -q 'game_file yah_coverflow net_shim' .work/hydroid/title/build-title.sh
          grep -q 'androidflow.flag' .work/hydroid/title/build-title.sh
          python3 -m json.tool .work/hydroid/title/sce_sys/param.json >/dev/null
          test -s .work/hydroid/title/sce_sys/icon0.png
          gcc -std=gnu11 -Wall -Wextra -Werror -fsyntax-only -I .work/hydroid/src             .work/hydroid/src/yah_coverflow.c
          gcc -std=gnu11 -Wall -Wextra -Werror -fsyntax-only \
            -I .work/hydroid/src -I .work/hydroid/third_party/FalsoJNI \
            .work/hydroid/src/godot_host.c
          gcc -std=c11 -Wall -Wextra -Werror homebrew/androidflow/tests/godot_touch_cursor_test.c \
            -lm -o /tmp/androidflow-godot-cursor-test
          /tmp/androidflow-godot-cursor-test
          grep -q 'pad_touch_events = 1; // AndroidFlow' .work/hydroid/src/app_main.c
          grep -q 'Godot touchscreen' .work/hydroid/src/godot_host.c
          grep -q 'godot_clear_previous_cursor();' .work/hydroid/src/godot_host.c
          grep -q 'avoid triple Play click' .work/hydroid/src/godot_host.c
          grep -q 'scene BEFORE step' .work/hydroid/src/godot_host.c
          grep -q 'persistent log file' .work/hydroid/src/app_main.c
          grep -q '/data/AndroidFlow/logs/crash.txt' .work/hydroid/src/arm_cpu.cpp
          grep -q 'before risky JNI call' .work/hydroid/src/godot_host.c
          grep -q 'com.king.candycrushsaga,page.codeberg.marshreaper.fruitygame' .work/hydroid/src/arm_imports.c
          grep -q 'androidflow: ARM64-native' .work/hydroid/src/arm_imports.c
          grep -Fq 'if (is_longjmp(name)) return &code[84];' .work/hydroid/src/arm_imports.c
          python3 -m py_compile homebrew/androidflow/tools/patch_arm_jmp.py
          python3 -m py_compile homebrew/androidflow/tools/patch_persistent_logs.py
          python3 -m unittest discover -s homebrew/androidflow/tests -p 'test_*.py' -v
          grep -q 'fix_dynarmic_log.py' .work/hydroid/third_party/build-dynarmic.sh
          python3 -m py_compile homebrew/androidflow/tools/fix_dynarmic_log.py homebrew/androidflow/tools/patch_godot_input.py
          python3 -m py_compile homebrew/androidflow/tools/apply_overlay.py             homebrew/androidflow/tools/isolate_radv.py             homebrew/androidflow/tools/package_native.py
      - name: Clear scope notice
        run: |
          echo 'This workflow verifies the overlay, C math and icon only. No PS5 eboot.bin or installable TESTBUILD ZIP is generated.'
