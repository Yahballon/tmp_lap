name: Build Starbound Rebased (ShadowMount test)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'homebrew/starbound-rebased/**'
      - '.github/workflows/build-starbound-rebased.yml'
  push:
    branches: [main]
    paths:
      - 'homebrew/starbound-rebased/**'
      - '.github/workflows/build-starbound-rebased.yml'
permissions:
  contents: write
jobs:
  native-title:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 ninja-build make wget unzip tar git pkg-config python3 python3-pil fonts-liberation2
      - name: Fetch MIT engine and native app scaffold
        run: |
          bash homebrew/starbound-rebased/tools/fetch-engine.sh
          python3 homebrew/starbound-rebased/tools/audit-upstream-assets.py
          git clone --depth=1 https://github.com/Yahballon/PS5-DevBridge.git /tmp/ps5-devbridge
          cp -a /tmp/ps5-devbridge/templates/simple-calc app
          # PacBrew's SDL2 pkg-config erroneously places -D_THREAD_SAFE in Libs.
          # This belongs in compiler flags, never in the native linker arguments.
          sed -i 's/if flag == "-pthread":/if flag == "-pthread" or flag.startswith("-D"):/g' app/tools/setup-pacbrew-dependencies.sh
      - name: Generate original replacement assets
        run: |
          python3 homebrew/starbound-rebased/tools/generate-original-media.py
          python3 homebrew/starbound-rebased/tools/upgrade-media.py
          python3 homebrew/starbound-rebased/tools/rework-world-assets.py
          python3 homebrew/starbound-rebased/tools/adapt-ps5-engine.py build/gold872-engine
          cp homebrew/starbound-rebased/ps5/StarboundAssetPaths.hpp build/gold872-engine/include/StarboundAssetPaths.hpp
          python3 homebrew/starbound-rebased/tools/resolve-resource-paths.py build/gold872-engine
          python3 homebrew/starbound-rebased/tools/upgrade-renderer.py build/gold872-engine
          python3 homebrew/starbound-rebased/tools/optimize-ps5-renderer.py build/gold872-engine
          python3 homebrew/starbound-rebased/tools/rebrand-game-hud.py build/gold872-engine
          python3 - <<'PY'
          from pathlib import Path
          root=Path("build/gold872-engine")
          main=(root/"src/main.cpp").read_text()
          assert 'boot_trace("BOOT00 entered main before resource setup");' in main
          assert 'getcwd(' not in main
          assert 'chdir(' not in main, "SDL assets may not depend on chdir"
          assert 'SB_ASSET_PATH("res/sprites/icons/logo.png")' in main
          assert 'SB_ASSET_PATH("res/fonts/press-start-2p.ttf")' in main
          assert 'SB_ASSET_PATH("res/data/MenuBackground/MenuBackground_Background.csv")' in main
          assert 'SB_ASSET_PATH("res/sounds/music/overworld.wav")' in main
          text=(root/"include/StarboundAssetPaths.hpp").read_text()
          assert "/app0/assets/" in text and "/data/homebrew/PPSA99642/assets/" in text
          assert 'ASSET_ROOT_FOUND' in text
          assert '"YAHBALLON"' in (root/'src/systems/ScoreSystem.cpp').read_text()
          texture=(root/"src/TextureManager.cpp").read_text()
          assert 'SDL_TEXTUREACCESS_TARGET' in texture and 'PERF01 native 800x480 offscreen target enabled' in texture
          assert 'SDL_RenderCopy(renderer, sbSceneTarget, nullptr, &screen)' in texture
          assert 'SDL_RenderCopy(renderer, texture.get(), &sourceRect, &destRect)' in texture
          print("Validated efficient PS5 software render-target path")
          print("Validated full absolute asset resolver, original boot traces and menu paths")
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path("build/gold872-engine/src/main.cpp")
          s=p.read_text()
          assert 'boot_trace("BOOT00 entered main before resource setup");' in s
          assert 'getcwd(' not in s, 'Unsafe pre-log getcwd reintroduced'
          assert 'chdir(' not in s
          assert s.index('boot_trace("01: main entered");') < s.index('ASSET01 menu logo found')
          assert 'ASSET04 music found' in s
          print("Verified BOOT00 is present; resource loads never depend on cwd")
          PY
          # Current GCC relied on transitive cstdint includes; Clang 18 requires this explicit include.
          sed -i '1a #include <cstdint>' build/gold872-engine/include/ECS/ECS.h
          cp app/src/startup.cpp /tmp/starbound-startup.cpp
          rm -rf app/src
          mkdir -p app/src
          cp /tmp/starbound-startup.cpp app/src/startup.cpp
          cp -a build/gold872-engine/src/. app/src/
          cp -a build/gold872-engine/include/. app/src/
          cp homebrew/starbound-rebased/ps5/sdl_video_bridge.cpp app/src/sdl_video_bridge.cpp
          test -s homebrew/starbound-rebased/res/data/MenuBackground/MenuBackground_Background.csv
          cp -a homebrew/starbound-rebased/res app/res
          # Keep the original Gold872 "res/..." relative paths intact.
          # The app runtime chdirs to /app0/assets (or the ShadowMount equivalent),
          # so it must contain the directory "res" rather than bare "sprites".
          mkdir -p app/assets/res
          cp -a app/res/. app/assets/res/
          test -s app/assets/res/sprites/icons/logo.png
          test -s app/assets/res/fonts/press-start-2p.ttf
          test -s app/assets/res/data/MenuBackground/MenuBackground_Background.csv
          cp build/gold872-engine/LICENSE app/UPSTREAM-MIT-LICENSE.txt
          python3 - <<'PY'
          import json,pathlib
          path=pathlib.Path('app/sce_sys/param.json')
          data=json.loads(path.read_text())
          data['titleId']='PPSA99642'
          data['conceptId']='99642'
          data['contentId']='UP9000-PPSA99642_00-STARBOUNDREBASE1'
          data['contentVersion']='01.000.012'
          data['localizedParameters']['en-US']['titleName']='Starbound Rebased'
          path.write_text(json.dumps(data,indent=2)+'\n')
          PY
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('app/res/sprites/icons/windowicon.png').convert('RGBA')
          im.resize((512,512),Image.Resampling.LANCZOS).save('app/sce_sys/icon0.png')
          PY
      - name: Compile and package native app
        working-directory: app
        env:
          USE_CCACHE: "0"
          BUILD_JOBS: "4"
          PS5_CLANG: clang-18
          PACBREW_PACKAGES: "sdl2 SDL2_image SDL2_mixer SDL2_ttf"
          PACBREW_INCLUDE_PATHS: "include"
          APP_INCLUDE_PATHS: "src"
        run: |
          bash tools/setup-pacbrew-dependencies.sh --list | grep -Ei 'sdl'
          bash tools/setup-native-dependencies.sh
          mkdir -p build/jb-json
          cp .deps/native/ps5-payload-sdk/target/lib/libc.a build/jb-json/libjb-posix.a
          llvm-objcopy-18 --redefine-sym=openlog=jb_sdk_openlog --redefine-sym=closelog=jb_sdk_closelog --redefine-sym=mkstemp=jb_sdk_mkstemp --redefine-sym=mkstemps=jb_sdk_mkstemps --redefine-sym=getpwuid_r=jb_sdk_getpwuid_r build/jb-json/libjb-posix.a
          mkdir -p compatlibs
          test -s .deps/native/ps5-payload-sdk/target/lib/libc++.a
          test -s .deps/native/ps5-payload-sdk/target/lib/libc++abi.a
          test -s .deps/native/ps5-payload-sdk/target/lib/libunwind.a
          ln -s ../.deps/native/ps5-payload-sdk/target/lib/libc++.a compatlibs/libcxx.a
          ln -s ../.deps/native/ps5-payload-sdk/target/lib/libc++abi.a compatlibs/libcxxabi.a
          ln -s ../.deps/native/ps5-payload-sdk/target/lib/libunwind.a compatlibs/libunwind.a
          make APP_INCLUDE_PATHS=src APP_SOURCE_DIR=src APP_ASSETS=assets APP_STATIC_ARCHIVES="compatlibs/libcxx.a compatlibs/libcxxabi.a compatlibs/libunwind.a" APP_ROOT_FILES=UPSTREAM-MIT-LICENSE.txt APP_WRAP_SYMBOLS="PS5_Remote_Init PS5_Keyboard_Init PS5_Keyboard_Open PS5_Keyboard_PumpEvents sceSystemServiceHideSplashScreen" APP_IMPORT_STUBS= APP_RUNTIME_MODULES= APP_DEFINITIONS= USE_CCACHE=0 BUILD_JOBS=4 app
      - name: Verify new ShadowMount title ZIP
        run: |
          python3 - <<'PY'
          import json,zipfile,pathlib,struct
          p=pathlib.Path('app/dist/PPSA99642.zip')
          assert p.is_file() and p.stat().st_size>500000
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              root='PPSA99642/'
              assert root+'eboot.bin' in names
              assert root+'sce_sys/param.json' in names
              assert root+'sce_sys/icon0.png' in names
              assert root+'assets/res/sprites/characters/PlayerSpriteSheet.png' in names
              assert root+'assets/res/data/World1-1/World1-1_Foreground.csv' in names
              assert root+'assets/res/sprites/icons/logo.png' in names
              assert root+'assets/res/fonts/press-start-2p.ttf' in names
              assert root+'assets/res/data/MenuBackground/MenuBackground_Background.csv' in names
              assert root+'assets/res/sounds/effects/jump.wav' in names
              assert root+'assets/res/sounds/music/overworld.wav' in names
              assert root+'assets/res/sprites/backgrounds/alien_sky.png' in names
              from PIL import Image
              import io
              assert Image.open(io.BytesIO(z.read(root+'assets/res/sprites/blocks/BlockTileSheet.png'))).size==(1536,704)
              assert Image.open(io.BytesIO(z.read(root+'assets/res/sprites/characters/PlayerSpriteSheet.png'))).size==(800,512)
              for required in (
                  'res/sprites/characters/PlayerSpriteSheet.png',
                  'res/sprites/icons/logo.png',
                  'res/fonts/press-start-2p.ttf',
                  'res/data/MenuBackground/MenuBackground_Background.csv',
                  'res/sounds/effects/jump.wav',
              ):
                  assert root+'assets/'+required in names,required
              menu=z.read(root+'assets/res/data/MenuBackground/MenuBackground_Background.csv').decode()
              rows=[r.split(',') for r in menu.strip().splitlines()]
              assert len(rows)==15 and all(len(row)==25 for row in rows)
              assert any(int(x)>=0 for row in rows for x in row)
              print('Validated every exact game-relative path under /app0/assets')
              data=json.loads(z.read(root+'sce_sys/param.json'))
              assert data['titleId']=='PPSA99642'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Starbound-Rebased-PPSA99642
          path: app/dist/PPSA99642.zip
          if-no-files-found: error
      - name: Publish TESTBUILDS release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=starbound-rebased-v0.1.11
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          gh release create "$tag" app/dist/PPSA99642.zip --target "$GITHUB_SHA" --title "Starbound Rebased v0.1.11 World Assets and HUD (PS5 experimental)" --notes "Fix cropped menu title and opaque option panels, YAHBALLON score HUD, clearer unique tiles and 32 original Gold872-compatible levels. Preserves v0.1.10 rendering performance. PS5 testing pending."
