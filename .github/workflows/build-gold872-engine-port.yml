name: Build Gold872 Engine Port (source smoke test)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'homebrew/starbound-rebased/**'
      - '.github/workflows/build-gold872-engine-port.yml'
  push:
    branches: [main]
    paths:
      - 'homebrew/starbound-rebased/**'
      - '.github/workflows/build-gold872-engine-port.yml'
permissions:
  contents: read
jobs:
  real-engine-desktop-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 dependencies for upstream engine compilation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev python3-pil fonts-liberation2
      - name: Fetch pinned MIT engine source (NO Nintendo resources)
        run: bash homebrew/starbound-rebased/tools/fetch-engine.sh
      - name: Generate and verify original media and 32 replacement levels
        run: |
          python3 homebrew/starbound-rebased/tools/generate-original-media.py
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path("homebrew/starbound-rebased/res")
          assert Image.open(root/"sprites/characters/PlayerSpriteSheet.png").size==(400,256)
          assert Image.open(root/"sprites/characters/EnemySpriteSheet.png").size==(560,240)
          assert Image.open(root/"sprites/blocks/BlockTileSheet.png").size==(768,352)
          assert len(list((root/"data").glob("World*-*/World*-*.levelproperties")))==32
          assert len(list((root/"sounds").rglob("*.wav")))==27
          assert (root/"fonts/press-start-2p.ttf").is_file()
          for path in (root/"data").glob("World*-*/*.csv"):
              rows=[line.split(",") for line in path.read_text().splitlines()]
              assert len(rows)==15 and all(len(row)==128 for row in rows),path
          menu=root/"data/MenuBackground/MenuBackground_Background.csv"
          rows=[line.split(",") for line in menu.read_text().splitlines()]
          assert rows and len({len(row) for row in rows})==1
          print("32 original levels, 27 tracks/effects, image dimensions and font verified")
          PY
          python3 homebrew/starbound-rebased/tools/install-campaign.py build/gold872-engine
          python3 homebrew/starbound-rebased/tools/check-campaign.py homebrew/starbound-rebased/res/data
          python3 homebrew/starbound-rebased/tools/test-campaign.py
      - name: Compile real upstream ECS/physics/scenes/SDL2 source
        run: |
          set -euo pipefail
          mapfile -d '' sources < <(find build/gold872-engine/src -type f -name '*.cpp' -print0)
          test "${#sources[@]}" -gt 20
          g++ -std=c++17 -O1 -include cstdint -Ibuild/gold872-engine/include "${sources[@]}" -o /tmp/starbound-rebased-desktop \
            $(sdl2-config --cflags --libs) -lSDL2_image -lSDL2_mixer -lSDL2_ttf -pthread
          g++ -std=c++17 -include cstdint -Ibuild/gold872-engine/include homebrew/starbound-rebased/tools/test-level-parser.cpp -o /tmp/test-level-parser \
            $(sdl2-config --cflags --libs) -lSDL2_image -lSDL2_mixer -lSDL2_ttf
          /tmp/test-level-parser homebrew/starbound-rebased/res/data
          python3 homebrew/starbound-rebased/tools/audit-upstream-assets.py build/gold872-engine
          test -s /tmp/starbound-rebased-desktop
          echo "Real engine compilation passed; not PS5-runnable yet"

# The actual PS5 cross-compile is intentionally separate from the host smoke test.
# It must run only after a pinned SDK + PacBrew sysroot with SDL archives is provisioned.

  ps5-payload-crossbuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install PS5 SDK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 ninja-build make wget curl unzip tar git pkg-config python3 python3-pil fonts-liberation2
      - name: Fetch pinned source and verified native PS5 SDK
        run: |
          bash homebrew/starbound-rebased/tools/fetch-engine.sh
          python3 homebrew/starbound-rebased/tools/audit-upstream-assets.py
          git clone --depth=1 https://github.com/Yahballon/PS5-DevBridge.git /tmp/ps5-devbridge
          cp -a /tmp/ps5-devbridge/templates/simple-calc /tmp/ps5-toolchain
          BUILD_JOBS=4 bash /tmp/ps5-toolchain/tools/setup-native-dependencies.sh
      - name: Fetch verified PacBrew SDL2 and addons
        run: |
          bash /tmp/ps5-toolchain/tools/setup-pacbrew-dependencies.sh --all
          SDK=/tmp/ps5-toolchain/.deps/native/ps5-payload-sdk
          SYS=/tmp/ps5-toolchain/.deps/pacbrew/v0.40.2/sysroot/user/homebrew
          test -d "$SYS/lib" && test -d "$SYS/include"
          mkdir -p "$SDK/target/user"
          rm -rf "$SDK/target/user/homebrew"
          ln -s "$SYS" "$SDK/target/user/homebrew"
          ls -lah "$SDK/target/user/homebrew/lib"/libSDL2*.a
          for lib in libSDL2.a libSDL2main.a libSDL2_image.a libSDL2_ttf.a libSDL2_mixer.a; do
            test -s "$SYS/lib/$lib" || (echo "Missing PacBrew archive: $lib"; exit 1)
          done
      - name: Generate original replacement resources
        run: |
          python3 homebrew/starbound-rebased/tools/generate-original-media.py
          test -s homebrew/starbound-rebased/res/sprites/characters/PlayerSpriteSheet.png
      - name: Apply PS5-specific input and resource path adapters
        run: |
          python3 homebrew/starbound-rebased/tools/adapt-ps5-engine.py build/gold872-engine
      - name: Cross-compile original SDL2 engine as PS5 payload ELF
        env:
          PS5_PAYLOAD_SDK: /tmp/ps5-toolchain/.deps/native/ps5-payload-sdk
        run: |
          cd homebrew/starbound-rebased/ps5
          make -j4 UPSTREAM=../../../build/gold872-engine
          test -s build/starbound-gold872.elf
      - name: Package playable-format PS5 ELF prototype with original resources
        run: |
          python3 - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path("homebrew/starbound-rebased")
          target=pathlib.Path("StarboundRebased-ELF-PROTOTYPE.zip")
          files=[(root/"ps5/build/starbound-gold872.elf","starbound-gold872.elf")]
          files += [(p,"STARBOUND_REBASED/"+p.relative_to(root).as_posix()) for p in (root/"res").rglob("*") if p.is_file()]
          files.append((pathlib.Path("build/gold872-engine/LICENSE"),"STARBOUND_REBASED/UPSTREAM-MIT-LICENSE.txt"))
          with zipfile.ZipFile(target,"w",compression=zipfile.ZIP_DEFLATED) as z:
              for path,name in files:z.write(path,name)
          with zipfile.ZipFile(target) as z:
              assert z.testzip() is None
              assert "starbound-gold872.elf" in z.namelist()
              assert "STARBOUND_REBASED/res/sprites/characters/PlayerSpriteSheet.png" in z.namelist()
          print("ELF prototype size",target.stat().st_size,"bytes")
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gold872-ps5-payload-prototype-not-release
          path: StarboundRebased-ELF-PROTOTYPE.zip
          if-no-files-found: error
