name: Build PS5NESX Native
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/ps5nesx-porpoise-original', 'fix/ps5nesx-porpoise-visible-v1017']
    paths:
      - 'homebrew/ps5nesx/nes/**'
      - 'homebrew/ps5nesx/ps5/**'
      - 'homebrew/ps5nesx/3rdparty/**'
      - 'homebrew/ps5nesx/app.json'
      - 'homebrew/ps5nesx/tests/**'
      - '.github/workflows/build-ps5nesx.yml'
permissions:
  contents: write
concurrency:
  group: ps5nesx-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Verify imported source and release version
        id: info
        shell: bash
        run: |
          set -euo pipefail
          test -s homebrew/ps5nesx/nes/tools/build_shelf.py
          test -s homebrew/ps5nesx/ps5/frontend/fe_app.cpp
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          x=json.loads(Path('homebrew/ps5nesx/app.json').read_text())
          assert x['titleId']=='PPSA99204' and x['slug']=='ps5nesx'
          assert re.fullmatch(r'\d+\.\d+\.\d+',x['version'])
          assert x['releaseTag']==f"ps5nesx-v{x['version']}"
          with open(os.environ['GITHUB_OUTPUT'],'a') as o:
              o.write(f"version={x['version']}\n")
              o.write(f"tag={x['releaseTag']}\n")
          print('Build native PS5NESX',x['releaseTag'])
          PY
      - name: Test Wii-style CoverFlow geometry on host
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Ihomebrew/ps5nesx/ps5/frontend \
            homebrew/ps5nesx/tests/coverflow_layout_test.cpp \
            -o /tmp/ps5nesx-layout-test
          /tmp/ps5nesx-layout-test
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Ihomebrew/ps5nesx/ps5/frontend \
            homebrew/ps5nesx/tests/porpoise_coverflow_test.cpp \
            -o /tmp/ps5nesx-porpoise-layout-test
          /tmp/ps5nesx-porpoise-layout-test
          python3 homebrew/ps5nesx/tests/test_porpoise_integration.py
          python3 homebrew/ps5nesx/tests/test_porpoise_visible.py
          python3 homebrew/ps5nesx/tests/ui_layout_check.py
          python3 homebrew/ps5nesx/tests/test_hdpack_integration.py
          python3 homebrew/ps5nesx/tests/test_hd_visual_regressions.py
      - name: Install toolchain packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git wget curl unzip zip make cmake ninja-build clang-18 lld-18 llvm-18 \
            build-essential pkg-config meson glslang-tools zstd bison flex \
            libssl-dev libzstd-dev libx11-dev libgl1-mesa-dev \
            python3 python3-mako python3-numpy python3-pil
          echo '/usr/lib/llvm-18/bin' >> "$GITHUB_PATH"
      - name: Embed verified Porpoise cover navigation sounds
        shell: bash
        run: |
          set -euo pipefail
          rev=2ed1ab5a06995aa198f7bccd4da0f90c3fc29d39
          root="$GITHUB_WORKSPACE/homebrew/ps5nesx/ps5/frontend/assets/sounds"
          mkdir -p "$root"
          for entry in \
            'game-row.wav d10d7d6ef5f8cb7343539e8aafb57fcb49f90a0f' \
            'menu-scroll.wav abab02c03a9a8181f3c81ad6d027de6b9940213a'; do
            read -r name expected <<< "$entry"
            curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
              "https://raw.githubusercontent.com/elripalda/Porpoise-Dolphin-Emulator-for-PS5/$rev/assets/sounds/$name" \
              -o "$root/$name"
            test "$(git hash-object "$root/$name")" = "$expected" || { echo "Porpoise WAV hash mismatch: $name" >&2; exit 1; }
          done
          python3 - <<'PY'
          import wave
          from pathlib import Path
          root=Path("homebrew/ps5nesx/ps5/frontend/assets/sounds")
          for name in ("game-row.wav", "menu-scroll.wav"):
              with wave.open(str(root/name),'rb') as f:
                  assert f.getnchannels()==2 and f.getframerate()==48000 and f.getsampwidth()==2
                  assert 0 < f.getnframes() <= 48000*3
                  print("Verified Porpoise sound:",name,"frames=",f.getnframes())
          PY
      - name: Rebuild modified native background SPIR-V
        run: |
          bash homebrew/ps5nesx/ps5/frontend/build_shaders.sh
          test -s homebrew/ps5nesx/ps5/frontend/fe_shaders.inc
          grep -q 'static const uint32_t fe_spv_bg_frag\[\]' homebrew/ps5nesx/ps5/frontend/fe_shaders.inc
      - name: Prepare exact Porpoise renderer include dependencies
        shell: bash
        run: |
          set -euo pipefail
          src=homebrew/ps5nesx/ps5/porpoise_original/src
          third=homebrew/ps5nesx/ps5/frontend/third_party
          mkdir -p "$src/stb"
          cp "$third/stb_image.h" "$src/stb/stb_image.h"
          cp "$third/stb_truetype.h" "$src/stb/stb_truetype.h"
          # The exact upstream UI shader bytecode is kept unchanged.
          test -s "$src/ui_frag.inc" && test -s "$src/ui_vert.inc"
          root=homebrew/ps5nesx/ps5/porpoise_original/assets
          mkdir -p "$root/fonts" "$root/brand" "$root/ui"
          rev=2ed1ab5a06995aa198f7bccd4da0f90c3fc29d39
          for spec in \
            'fonts/Nunito-Regular.ttf 2f4a2f8467657c1f039800f7af0f85d719d92bf6' \
            'fonts/Nunito-SemiBold.ttf 2588d394a7b5773e8355c1d923877bef338f2adf' \
            'fonts/Nunito-Bold.ttf c642a28adb3b5b89bc37dca9b76b81fa114c022b' \
            'fonts/Nunito-ExtraBold.ttf 5dab2fd42d061b7f69ecbee7ac3f73d50053978c' \
            'brand/dolphin-mask.png bd51e74f7e11c79de9d40d626d3685038cf5d792' \
            'ui/buttons.png 43902f0bccdab08fb74efb0a99ae3f282299543a'; do
            read -r name expected <<< "$spec"
            curl -fL --retry 5 --retry-all-errors --connect-timeout 15 \
              "https://raw.githubusercontent.com/elripalda/Porpoise-Dolphin-Emulator-for-PS5/$rev/assets/$name" \
              -o "$root/$name"
            test "$(git hash-object "$root/$name")" = "$expected" || exit 1
          done
          # Compile the pinned original font and icon assets into eboot.bin;
          # /app0 paths are not available to every homebrew launch mode.
          mkdir -p homebrew/ps5nesx/ps5/frontend/assets/porpoise
          cp -R "$root/." homebrew/ps5nesx/ps5/frontend/assets/porpoise/
          curl -fL --retry 5 \
            "https://raw.githubusercontent.com/elripalda/Porpoise-Dolphin-Emulator-for-PS5/$rev/assets/fonts/OFL.txt" \
            -o "$root/fonts/OFL.txt"
      - name: Verify exact upstream source hashes
        run: |
          set -euo pipefail
          root=homebrew/ps5nesx/ps5/porpoise_original/src
          test "$(git hash-object "$root/ui_app_views.cpp")" = a98f455313dd926238c9d76a72d5fd7f50e6ee2d
          # Original Gfx now has additional stage-specific startup diagnostics
          # while its actual shaders and drawing pipeline remain unchanged.
          grep -q 'original Vulkan pipeline FAILED' "$root/ui_gfx.cpp"
          grep -q 'original font atlas FAILED' "$root/ui_gfx.cpp"
          test "$(git hash-object "$root/ui_frag.inc")" = 27007d02d4279a2cf6cb9e8324a2dced93da5e59
      - name: Restore pinned original PS5NESX embedded fonts
        shell: bash
        run: |
          set -euo pipefail
          # The partial native-source import deliberately excluded the legacy
          # PCSX2 bin/ directory, but fe_ps5.cpp still embeds these two fonts.
          # Fetch only the two required files, pinned to the imported source.
          root="$GITHUB_WORKSPACE/homebrew/ps5nesx"
          rev="$(tr -d '\r\n' < "$root/UPSTREAM_COMMIT")"
          test "$rev" = "aa401fb83c830164421d30fe808a6714f0e6cd7c"
          mkdir -p "$root/bin/resources/fonts"
          for entry in \
            'Roboto-Regular.ttf 500b1045b0c94d83d2e6798aaf1faa55a2dab6fc' \
            'promptfont.otf 77f8d39a6d3700494bb133c5f0ec67c762794ffa'; do
            read -r filename expected <<< "$entry"
            curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
              "https://raw.githubusercontent.com/Yahballon/PS5NESX/$rev/bin/resources/fonts/$filename" \
              -o "$root/bin/resources/fonts/$filename"
            actual="$(git hash-object "$root/bin/resources/fonts/$filename")"
            if [[ "$actual" != "$expected" ]]; then
              echo "Upstream font integrity mismatch: $filename" >&2
              exit 1
            fi
          done
          test -s "$root/bin/resources/fonts/Roboto-Regular.ttf"
          test -s "$root/bin/resources/fonts/promptfont.otf"
          echo "Verified both original embedded font files from pinned source revision"
      - name: Restore native PS5 graphics cache shared with MesenX
        id: graphics
        uses: actions/cache/restore@v4
        with:
          path: homebrew/ps5-mesenx/build/deps
          key: ps5-mesenx-graphics-v1-${{ hashFiles('homebrew/ps5-mesenx/scripts/bootstrap_native.sh') }}
      - name: Bootstrap pinned PS5 Vulkan and payload SDK when not cached
        if: steps.graphics.outputs.cache-hit != 'true'
        timeout-minutes: 280
        run: bash homebrew/ps5-mesenx/scripts/bootstrap_native.sh
      - name: Save native graphics cache for reuse
        if: steps.graphics.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: homebrew/ps5-mesenx/build/deps
          key: ps5-mesenx-graphics-v1-${{ hashFiles('homebrew/ps5-mesenx/scripts/bootstrap_native.sh') }}
      - name: Resolve PS5NESX network and filesystem dependencies
        timeout-minutes: 70
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/homebrew/ps5nesx"
          deps="$root/deps"
          mkdir -p "$deps"
          ln -s "$GITHUB_WORKSPACE/homebrew/ps5-mesenx/build/deps/PS5_Vulkan" "$deps/PS5_Vulkan"
          test -s "$deps/PS5_Vulkan/build/driver/ps5/libps5vk.ps5.a"
          git clone -q --depth 1 --branch libnfs-5.0.3 \
            https://github.com/sahlberg/libnfs.git "$deps/libnfs"
          bash "$root/ps5/tools/build-libnfs.sh" \
            "$deps/libnfs" "$deps/libnfs-output" \
            "$deps/PS5_Vulkan/.deps/native/ps5-payload-sdk/toolchain/prospero.cmake"
          git clone -q --depth 1 \
            https://github.com/blackbearreloaded/ps5-native-app-boilerplate.git \
            "$deps/filesystem-helper"
          bash "$deps/filesystem-helper/tools/setup-pacbrew-dependencies.sh" --resolve libcurl
          for lib in curl psl ssl crypto zstd z; do
            test -s "$deps/filesystem-helper/.deps/pacbrew/v0.40.2/sysroot/user/homebrew/lib/lib$lib.a"
          done
          test -s "$deps/libnfs-output/install/lib/libnfs.a"
      - name: Build missing native PSBC objects and AGC link imports
        timeout-minutes: 40
        env:
          PS5_VULKAN_DIR: ${{ github.workspace }}/homebrew/ps5-mesenx/build/deps/PS5_Vulkan
          PS5_PAYLOAD_SDK: ${{ github.workspace }}/homebrew/ps5-mesenx/build/deps/PS5_Vulkan/.deps/native/ps5-payload-sdk
        run: |
          python3 homebrew/ps5-mesenx/scripts/build_generated_psbc.py
          python3 homebrew/ps5-mesenx/scripts/build_agc_imports.py
          test -s homebrew/ps5-mesenx/build/ps5-core/generated-psbc.ps5.a
          test -s homebrew/ps5-mesenx/build/ps5-core/agc-imports/libSceAgc.so
          test -s homebrew/ps5-mesenx/build/ps5-core/agc-imports/libSceAgcDriver.so
      - name: Restore signed prior Lapy helper (source no longer public)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ps5nesx-helper-baseline"
          gh release download ps5nesx-v1.0.11 --repo "$GITHUB_REPOSITORY" --pattern PPSA99204.zip --dir "$RUNNER_TEMP/ps5nesx-helper-baseline"
          echo "1dca2ad14d5e02f71eb8e2a71b527b92297f060a79d5df9b4613f01ff51d8500  $RUNNER_TEMP/ps5nesx-helper-baseline/PPSA99204.zip" | sha256sum -c -
          unzip -Z1 "$RUNNER_TEMP/ps5nesx-helper-baseline/PPSA99204.zip" | grep -Fx 'PPSA99204/lapy.elf'
          unzip -Z1 "$RUNNER_TEMP/ps5nesx-helper-baseline/PPSA99204.zip" | grep -Fx 'PPSA99204/lapy-manifest.json'
      - name: Build and sign PS5NESX from tmp_lap source
        timeout-minutes: 110
        shell: bash
        run: |
          set -euo pipefail
          cd homebrew/ps5nesx
          export PS5NES_DEPS="$PWD/deps"
          export PS5_PAYLOAD_SDK="$PS5NES_DEPS/PS5_Vulkan/.deps/native/ps5-payload-sdk"
          export LIBNFS_PREFIX="$PS5NES_DEPS/libnfs-output/install"
          export LIBZ_PREFIX="$PS5NES_DEPS/filesystem-helper/.deps/pacbrew/v0.40.2/sysroot/user/homebrew"
          export PS5NES_PSBC_GENERATED="$GITHUB_WORKSPACE/homebrew/ps5-mesenx/build/ps5-core/generated-psbc.ps5.a"
          export PS5NES_AGC_STUB_DIR="$GITHUB_WORKSPACE/homebrew/ps5-mesenx/build/ps5-core/agc-imports"
          export PS5NES_LAPY_BASELINE="$RUNNER_TEMP/ps5nesx-helper-baseline/PPSA99204.zip"
          # build_shelf.py generates the UI version and title metadata from app.json.
          bash nes/tools/build.sh
          mkdir -p dist
          python3 - <<'PY'
          import zipfile,json,struct
          from pathlib import Path
          src=list(Path('nes/build-shelf').glob('PS5NES-v*-by-YAHBALLON.zip'))
          assert len(src)==1,src
          meta=json.loads(Path('app.json').read_text())
          version=meta['version']
          assert src[0].name==f'PS5NES-v{version}-by-YAHBALLON.zip'
          dst=Path('dist/PPSA99204.zip')
          dst.write_bytes(src[0].read_bytes())
          assert dst.stat().st_size>1_000_000
          with zipfile.ZipFile(dst) as archive:
              assert archive.testzip() is None
              for name in ['PPSA99204/eboot.bin','PPSA99204/sce_module/libc.prx',
                           'PPSA99204/sce_sys/icon0.png','PPSA99204/lapy.elf',
                           'PPSA99204/lapy-manifest.json']:
                  assert name in archive.namelist(),name
              param=json.loads(archive.read('PPSA99204/sce_sys/param.json'))
              assert param['titleId']=='PPSA99204'
              major,minor,patch=map(int,version.split('.'))
              assert param['contentVersion']==f'{major:02d}.{minor:03d}.{patch:03d}'
              manifest=json.loads(archive.read('PPSA99204/build-manifest.json'))
              assert manifest['version']==version and manifest['build_tag']==f'v{version} by YAHBALLON'
              assert archive.read('PPSA99204/eboot.bin')[:4]==struct.pack('<I',0x1D3D154F)
          print('Validated signed PS5NESX release',dst.stat().st_size)
          PY
      - name: Upload installable PS5 TESTBUILD ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PS5NESX-${{ steps.info.outputs.version }}-PPSA99204
          path: homebrew/ps5nesx/dist/PPSA99204.zip
          if-no-files-found: error
      - name: Publish immutable versioned GitHub Release for TESTBUILDS
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.info.outputs.tag }}
          VERSION: ${{ steps.info.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump app.json version for a new TESTBUILD." >&2
            exit 1
          fi
          gh release create "$TAG" homebrew/ps5nesx/dist/PPSA99204.zip \
            --repo "$GITHUB_REPOSITORY" --target main \
            --title "PS5NESX v$VERSION by YAHBALLON" \
            --notes "Native PS5NESX source built from tmp_lap/homebrew/ps5nesx. Install PPSA99204.zip. Core: FCEUmm."
