name: Build PSJukebox
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'homebrew/psjukebox/**'
      - '.github/workflows/build-psjukebox.yml'
  push:
    branches: [main]
    paths:
      - 'homebrew/psjukebox/**'
      - '.github/workflows/build-psjukebox.yml'
permissions:
  contents: write
jobs:
  ps5:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 ninja-build make wget curl unzip tar git python3 python3-pil pkg-config ca-certificates g++ libavformat-dev libavcodec-dev libavutil-dev libswresample-dev libsdl2-dev zlib1g-dev zip
      - name: Native library regression tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror homebrew/psjukebox/native/library.cpp homebrew/psjukebox/tests/library_test.cpp -o /tmp/psjukebox-test
          /tmp/psjukebox-test
          g++ -std=c++20 -Wall -Wextra -Werror homebrew/psjukebox/tests/stick_nav_test.cpp -o /tmp/psjukebox-stick-test
          /tmp/psjukebox-stick-test
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            homebrew/psjukebox/tests/cover_browse_test.cpp \
            -o /tmp/psjukebox-cover-browse-test
          /tmp/psjukebox-cover-browse-test
          # Check integration as well as the standalone input and geometry math.
          python3 - <<'PY'
          from pathlib import Path
          code=Path('homebrew/psjukebox/native/main.cpp').read_text()
          assert 'jukebox::allows_live_album_browse(screen)' in code
          assert 'screen=0;headerIndex=0;' in code
          assert 'player.skip(10*analogSeekDirection)' in code
          assert 'if((screen==0||screen==2)&&(pressed&hui::pad_bits::kDown))' in code
          assert 'jukebox::cover_slot(position)' in code
          assert 'jukebox::album_browse_step(' in code
          assert 'coverView&&(pressed&hui::pad_bits::kLeft)' in code
          assert 'coverView&&(pressed&hui::pad_bits::kRight)' in code
          assert 'if(havePlayingSong&&analogSeekDirection)player.skip(10*analogSeekDirection)' in code
          assert 'if(dir==-1)pressed|=hui::pad_bits::kLeft;' not in code
          assert 'if(dir==1)pressed|=hui::pad_bits::kRight;' not in code
          assert 'if(pressed&hui::pad_bits::kL1)next_track(-1);' not in code
          assert 'if(pressed&hui::pad_bits::kR1)next_track(1);' not in code
          print('PASS: live player controls connected to browser and album layout')
          PY
          g++ -std=c++20 -O2 -Wall -Wextra -Werror homebrew/psjukebox/tests/cover_motion_test.cpp -o /tmp/psjukebox-cover-motion-test
          /tmp/psjukebox-cover-motion-test
          g++ -std=c++20 -Wall -Wextra -Werror homebrew/psjukebox/native/favorites.cpp homebrew/psjukebox/tests/favorites_test.cpp -o /tmp/psjukebox-favorites-test
          /tmp/psjukebox-favorites-test
          mkdir -p /tmp/psjukebox-zip-test
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          p=Path('/tmp/psjukebox-zip-test/Demo.album')
          with zipfile.ZipFile(p,'w') as z:
            z.writestr('cover.jpg',bytes([255,216])+bytes(600),compress_type=zipfile.ZIP_DEFLATED)
            z.writestr('background.png',bytes([137,80,78,71,13,10,26,10])+bytes(700),compress_type=zipfile.ZIP_STORED)
            z.writestr('Tupac.artist',b'',compress_type=zipfile.ZIP_STORED)
            z.writestr('01. Hail Mary.mp3',b'ID3'+bytes(3000),compress_type=zipfile.ZIP_DEFLATED)
            z.writestr('Wrap/02. Other Track.mp3',b'ID3'+bytes(3100),compress_type=zipfile.ZIP_STORED)
            z.writestr('some_meta.xml',b'<xml>ignored</xml>')
            z.writestr('../evil.mp3',b'ID3'+bytes(3000))
          PY
          g++ -std=c++20 -Wall -Wextra -Werror -O2 \
            homebrew/psjukebox/native/album_archive.cpp \
            homebrew/psjukebox/native/library.cpp \
            homebrew/psjukebox/tests/archive_test.cpp -lz -o /tmp/psjukebox-album-test
          /tmp/psjukebox-album-test /tmp/psjukebox-zip-test/Demo.album /tmp/psjukebox-zip-test
          # Real PS5 v0.1.9 import returned ALBUM_OK tracks=0 because
          # opendir(AlbumCache/Music) failed with errno=1. This regression
          # denies directory enumeration, requiring the ZIP metadata index.
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Wl,--wrap=opendir \
            homebrew/psjukebox/native/album_archive.cpp \
            homebrew/psjukebox/native/library.cpp \
            homebrew/psjukebox/tests/archive_catalog_test.cpp -lz -o /tmp/jbx-archive-index-test
          /tmp/jbx-archive-index-test /tmp/psjukebox-zip-test/Demo.album /tmp/psjukebox-zip-test/AlbumCache
          # Real PS5 scan runs on a small pthread stack; a 64 KiB stack
          # reproduces the v0.1.8 crash from the two local ZIP buffers.
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread \
            homebrew/psjukebox/native/album_archive.cpp \
            homebrew/psjukebox/native/library.cpp \
            homebrew/psjukebox/tests/album_stack_test.cpp \
            -lz -o /tmp/psjukebox-album-stack-test
          /tmp/psjukebox-album-stack-test /tmp/psjukebox-zip-test/Demo.album /tmp/psjukebox-zip-test
          # Regression for actual PS5 errno=1 during lstat/fstat: a readable
          # archive must still unpack into app-managed cache and rescan.
          g++ -std=c++20 -Wall -Wextra -Werror -O2 -DPS5_DENY_FILE_STAT_TEST \
            -Wl,--wrap=lstat -Wl,--wrap=fstat \
            homebrew/psjukebox/native/album_archive.cpp \
            homebrew/psjukebox/native/library.cpp \
            homebrew/psjukebox/tests/archive_test.cpp -lz -o /tmp/psjukebox-sandbox-album-test
          /tmp/psjukebox-sandbox-album-test /tmp/psjukebox-zip-test/Demo.album /tmp/psjukebox-zip-test
          git clone --depth=1 https://github.com/sahlberg/libsmb2.git /tmp/jbx-libsmb2
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -I/tmp/jbx-libsmb2/include -c homebrew/psjukebox/native/smb_music.cpp -o /tmp/psjukebox-smb.o
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/psjukebox-zip-test/Music')
          p.mkdir(exist_ok=True)
          (p/'Demo.album').write_bytes(Path('/tmp/psjukebox-zip-test/Demo.album').read_bytes())
          PY
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            homebrew/psjukebox/native/library.cpp \
            homebrew/psjukebox/tests/root_album_test.cpp -o /tmp/psjukebox-root-album-test
          /tmp/psjukebox-root-album-test /tmp/psjukebox-zip-test/Music
          g++ -std=c++20 -O2 -pthread -Wall -Wextra -c homebrew/psjukebox/native/audio_player.cpp $(pkg-config --cflags libavformat libavcodec libavutil libswresample sdl2) -o /tmp/psjukebox-player.o
      - name: Host USB helper integration test
        run: |
          set -euo pipefail
          mkdir -p "/tmp/jbx-fixture/Bob Marley/Legend" "/tmp/jbx-fixture/Bob Marley/Exodus" \
            "/tmp/jbx-fixture/Tupac/All Eyez on Me" "/tmp/jbx-fixture/wu-tang" /tmp/jbx-test-runtime
          python3 - <<'PY'
          from pathlib import Path
          artist=Path('/tmp/jbx-fixture/Bob Marley')
          (artist/'logo.png').write_bytes(bytes([137,80,78,71,13,10,26,10])+bytes(256))
          (artist/'theme.ini').write_text('accent=#44cc77\nsecondary=#101010\n')
          (artist/'Legend'/'cover.jpg').write_bytes(bytes([255,216])+bytes(512))
          (artist/'Legend'/'background.png').write_bytes(bytes([137,80,78,71,13,10,26,10])+bytes(512))
          (artist/'Legend'/'01-One-Love.mp3').write_bytes(b'ID3'+bytes(2500))
          (artist/'Exodus'/'01-Mystic.flac').write_bytes(b'fLaC'+bytes(2600))
          (artist/'Legend'/'skip.exe').write_bytes(b'excluded')
          (Path('/tmp/jbx-fixture/Tupac/All Eyez on Me')/'cover.jpg').write_bytes(bytes([255,216])+bytes(512))
          (Path('/tmp/jbx-fixture/wu-tang')/'01 - Intro.mp3').write_bytes(b'ID3'+bytes(2000))
          import zipfile
          with zipfile.ZipFile('/tmp/jbx-fixture/RootAlbum.album','w') as z:
            z.writestr('Tupac.artist',b'')
            z.writestr('01. Hail Mary.mp3',b'ID3'+bytes(2000))

          import zipfile
          with zipfile.ZipFile('/tmp/jbx-fixture/Tupac/Killuminati.album','w') as z:
            z.writestr('cover.jpg',bytes(200),compress_type=zipfile.ZIP_DEFLATED)
            z.writestr('01. Hail Mary.mp3',b'ID3'+bytes(2200),compress_type=zipfile.ZIP_DEFLATED)
          (artist/'Legend'/'symlink.mp3').symlink_to(artist/'Legend'/'01-One-Love.mp3')
          PY
          gcc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -DJUKEBOX_TEST_ROOT='"/tmp/jbx-fixture"' -DJUKEBOX_PORT=19188 \
            homebrew/psjukebox/helper/jbxscan.c -o /tmp/jbx-helper-test
          /tmp/jbx-helper-test >/tmp/jbx-helper.log 2>&1 &
          helper_pid=$!
          trap 'kill "$helper_pid" 2>/dev/null || true' EXIT
          sleep 0.3
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread \
            -DJUKEBOX_BRIDGE_PORT=19188 -DJUKEBOX_DATA_ROOT='"/tmp/jbx-test-runtime"' \
            homebrew/psjukebox/native/library.cpp \
            homebrew/psjukebox/native/remote_bridge.cpp \
            homebrew/psjukebox/tests/bridge_test.cpp -o /tmp/jbx-bridge-test
          /tmp/jbx-bridge-test
      - name: Prepare app and assets
        run: |
          git clone --depth=1 https://github.com/Yahballon/PS5-DevBridge.git /tmp/devbridge
          cp -a /tmp/devbridge/templates/simple-calc ./app
          cp homebrew/psjukebox/native/*.cpp homebrew/psjukebox/native/*.hpp app/src/
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/nothings/stb/2c980bb59875b0d32144a71867fbdebb2f77cd20/stb_image.h -o app/src/stb_image.h
          python3 homebrew/psjukebox/tools/prepare.py app
      - name: Prepare PS5 OpenGL SDK
        working-directory: app
        env:
          PS5_CLANG: clang-18
          USE_CCACHE: '0'
          BUILD_JOBS: '4'
        run: bash tools/prepare-opengl.sh
      - name: Prepare POSIX archive
        run: |
          mkdir -p app/build/jb-json
          cp app/.deps/native/ps5-payload-sdk/target/lib/libc.a app/build/jb-json/libjb-posix.a
          llvm-objcopy-18 --redefine-sym=openlog=jb_sdk_openlog --redefine-sym=closelog=jb_sdk_closelog --redefine-sym=mkstemp=jb_sdk_mkstemp --redefine-sym=mkstemps=jb_sdk_mkstemps --redefine-sym=getpwuid_r=jb_sdk_getpwuid_r app/build/jb-json/libjb-posix.a
          test -s app/build/jb-json/libjb-posix.a
      - name: Compile read-only Jukebox ELF helper
        run: |
          make -C homebrew/psjukebox/helper PS5_PAYLOAD_SDK="$GITHUB_WORKSPACE/app/.deps/native/ps5-payload-sdk"
          cp homebrew/psjukebox/helper/jbxscan.elf app/jbxscan.elf
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/jbxscan.elf')
          assert p.is_file() and p.stat().st_size>1024
          assert p.read_bytes()[:4]==bytes([0x7f,0x45,0x4c,0x46])
          PY
      - name: Native PS5 compile
        working-directory: app
        env:
          PS5_CLANG: clang-18
          USE_CCACHE: '0'
          BUILD_JOBS: '4'
        run: make USE_CCACHE=0 BUILD_JOBS=4 PACBREW_PACKAGES='libavformat libavcodec libavutil libswresample sdl2 zlib libsmb2' APP_ROOT_FILES=jbxscan.elf app
      - name: Verify package
        run: python3 homebrew/psjukebox/tools/verify.py app/dist/PPSA99947.zip
      - name: Upload installable test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PSJukebox-v0.1.12
          path: app/dist/PPSA99947.zip
          if-no-files-found: error
      - name: Publish verified PSJukebox TESTBUILD release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(python3 -c 'import json;print(json.load(open("homebrew/psjukebox/app.json"))["releaseTag"])')"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists; refusing to overwrite published bytes."
            exit 1
          fi
          gh release create "$tag" "app/dist/PPSA99947.zip" --target "$GITHUB_SHA" --title "PSJukebox v0.1.12 (TESTBUILD)" --notes-file homebrew/psjukebox/RELEASE_NOTES.md
          gh release view "$tag" --json tagName,assets,url --jq '{tag:.tagName,url:.url,assets:[.assets[].name]}'
