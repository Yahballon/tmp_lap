name: ThemeChanger H264 Bitstream Diagnostics
on:
  push:
    branches: [fix/themechanger-v0.3.10-playback-persistence]
    paths: ['.github/workflows/themechanger-h264-probe.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg g++ libssl-dev
      - name: Build native MotionBGS downloader and inspect H264 reference frames
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          pem=Path('/etc/ssl/certs/ca-certificates.crt').read_text()
          Path('homebrew/themechanger/native/ca_bundle.inc').write_text('static constexpr char kCaBundle[] = R"PS5CABUNDLE('+pem+')PS5CABUNDLE";\n')
          PY
          cat > /tmp/dl.cpp <<'CPP'
          #include "motion_download.hpp"
          #include <atomic>
          #include <cstdio>
          #include <string>
          int main(int argc,char**argv){
           if(argc!=3)return 1;
           std::atomic<int> p{0};std::string err;
           if(!motion::fetch_file(argv[1],argv[2],p,err)){
            fprintf(stderr,"download failed: %s\n",err.c_str());return 1;
           }
           return 0;
          }
          CPP
          g++ -std=c++20 -O2 -pthread -Ihomebrew/themechanger/native /tmp/dl.cpp homebrew/themechanger/native/motion_download.cpp -lssl -lcrypto -o /tmp/theme-dl
          for pair in "1132 thousand-sunny-one-piece" "1115 sanji-smoking-one-piece" "10118 wandering-samurai" "5411 bmw-m5-in-dark"; do
            set -- $pair
            echo "==== SAMPLE $2 ===="
            /tmp/theme-dl "https://motionbgs.com/dl/hd/$1/" "/tmp/$1.mp4"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,profile,level,pix_fmt,refs,has_b_frames,field_order,r_frame_rate,avg_frame_rate,nb_frames,sample_aspect_ratio,start_time,duration,bit_rate -of compact=p=0 "/tmp/$1.mp4"
            ffmpeg -hide_banner -v verbose -i "/tmp/$1.mp4" -vf "vfrdet" -f null - 2>&1 | grep -E "VFR:|frame=|speed=" | tail -4 || true
            ffmpeg -hide_banner -v trace -i "/tmp/$1.mp4" -c copy -bsf:v trace_headers -f null - 2>&1 | grep -E "max_num_ref_frames|num_ref_frames|level_idc|pic_order_cnt_type" | head -12 || true
          done
