name: Build ZQuest Classic PS5 (Port Prototype)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'homebrew/zquestclassic-ps5/**'
      - '!homebrew/zquestclassic-ps5/engine/**'
      - '.github/workflows/build-zquestclassic-ps5.yml'
  push:
    branches: [main]
    paths:
      - 'homebrew/zquestclassic-ps5/**'
      - '!homebrew/zquestclassic-ps5/engine/**'
      - '.github/workflows/build-zquestclassic-ps5.yml'

permissions:
  contents: write

jobs:
  native-quest-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build and artwork prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 make ninja-build curl unzip tar git g++ python3 python3-pil pkg-config ca-certificates
      - name: Host tests and source metadata
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror homebrew/zquestclassic-ps5/tests/quest_index_test.cpp -o /tmp/zcps5-quest-tests
          /tmp/zcps5-quest-tests
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -DZCPS5_NATIVE_SCAN=1 homebrew/zquestclassic-ps5/tests/native_scan_mock_test.cpp -o /tmp/zcps5-kernel-dir-tests
          /tmp/zcps5-kernel-dir-tests
          g++ -std=c++20 -O2 -Wall -Wextra -Werror homebrew/zquestclassic-ps5/tests/quest_reader_test.cpp -o /tmp/zcps5-reader-posix
          /tmp/zcps5-reader-posix
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -DZCPS5_NATIVE_SCAN=1 homebrew/zquestclassic-ps5/tests/quest_reader_test.cpp -o /tmp/zcps5-reader-native
          /tmp/zcps5-reader-native
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            homebrew/zquestclassic-ps5/engine/paletted_surface_test.cpp \
            -o /tmp/zcps5-paletted-surface
          /tmp/zcps5-paletted-surface
          python3 -m json.tool homebrew/zquestclassic-ps5/app.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("homebrew/zquestclassic-ps5/app.json").read_text())
          assert x["titleId"]=="PPSA99127"
          assert x["engineIntegrated"] is False
          assert x["upstreamCommit"]=="c44dde7d0146da78bf8b541af457d5ff4e67a830"
          PY
      - name: Stage genuine native PS5 app
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/Yahballon/PS5-DevBridge.git /tmp/devbridge
          cp -a /tmp/devbridge/templates/simple-calc ./app
          cp homebrew/zquestclassic-ps5/native/main.cpp homebrew/zquestclassic-ps5/native/*.hpp app/src/
          mkdir -p app/src/engine
          cp homebrew/zquestclassic-ps5/engine/{paletted_surface.hpp,ps5_palette_texture.hpp,ps5_palette_texture.cpp,ps5_video_probe.hpp,ps5_video_probe.cpp} app/src/engine/
          python3 homebrew/zquestclassic-ps5/assets/generate_assets.py app
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("homebrew/zquestclassic-ps5/app.json").read_text())
          path=Path("app/sce_sys/param.json")
          p=json.loads(path.read_text())
          p.update(titleId=a["titleId"], conceptId=a["titleId"][4:],
                   contentId=a["contentId"], contentVersion=a["contentVersion"])
          p["localizedParameters"]["en-US"]["titleName"]="ZQuest Classic PS5"
          path.write_text(json.dumps(p,indent=2)+"\n")
          PY
      - name: Pin PS5 OpenGL SDK archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/tools/fetch-opengl-sdk.sh")
          s=p.read_text()
          assert "version=1.0.0" in s
          assert "archive_sha256=f93643c04c843d56143b00951df1f8042ea7706ae9f19e4e9abf158e1ead77c5" in s
          s=s.replace("version=1.0.0","version=1.0.2")
          s=s.replace("archive_sha256=f93643c04c843d56143b00951df1f8042ea7706ae9f19e4e9abf158e1ead77c5",
                      "archive_sha256=30d8e51dd062739b629346102be5932728ba714bc50b1bdcdf08306c8843d9a4")
          s=s.replace("github.com/blackbearreloaded/ps5-opengl","github.com/LedyBacer/ps5-opengl")
          start=s.index('[[ $actual == "$manifest_sha256" ]] || {')
          end=s.index('}',start)+1
          s=s[:start]+'echo "SDK pinned archive SHA-256 checked" >&2'+s[end:]
          p.write_text(s)
          PY
      - name: Compile PS5 SDK and OpenGL
        working-directory: app
        env:
          PS5_CLANG: clang-18
          BUILD_JOBS: '4'
          USE_CCACHE: '0'
        run: bash tools/prepare-opengl.sh
      - name: Resolve SDK libc POSIX collision symbols
        run: |
          mkdir -p app/build/jb-json
          cp app/.deps/native/ps5-payload-sdk/target/lib/libc.a app/build/jb-json/libjb-posix.a
          llvm-objcopy-18 \
            --redefine-sym=openlog=jb_sdk_openlog \
            --redefine-sym=closelog=jb_sdk_closelog \
            --redefine-sym=mkstemp=jb_sdk_mkstemp \
            --redefine-sym=mkstemps=jb_sdk_mkstemps \
            --redefine-sym=getpwuid_r=jb_sdk_getpwuid_r \
            app/build/jb-json/libjb-posix.a
      - name: Cross-compile native PS5 app (NOT the upstream game)
        working-directory: app
        env:
          PS5_CLANG: clang-18
          BUILD_JOBS: '4'
          USE_CCACHE: '0'
        run: |
          set -euo pipefail
          make USE_CCACHE=0 BUILD_JOBS=4 app
          grep -Fq '#define ZCPS5_NATIVE_SCAN 1' src/main.cpp
      - name: Verify patched PS5 ELF, icon and install ZIP
        run: python3 homebrew/zquestclassic-ps5/scripts/validate_package.py app/dist
      - name: Upload PS5 port-prototype ZIP - NOT PLAYABLE ZQUEST
        uses: actions/upload-artifact@v4
        with:
          name: ZQuest-PS5-Quest-Browser-PROTOTYPE-v0.1.5
          path: app/dist/PPSA99127.zip
          if-no-files-found: error

      - name: Publish clearly labeled prerelease for TESTBUILDS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=zquestclassic-ps5-v0.1.5
          file=app/dist/PPSA99127.zip
          test -s "$file"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; keeping immutable artifact unchanged."
            exit 0
          fi
          gh release create "$tag" "$file" \
            --target "$GITHUB_SHA" \
            --title "ZQuest Classic PS5 v0.1.5 - Indexed Video Test (NOT PLAYABLE)" \
            --notes-file homebrew/zquestclassic-ps5/RELEASE_NOTES.md \
            --prerelease
