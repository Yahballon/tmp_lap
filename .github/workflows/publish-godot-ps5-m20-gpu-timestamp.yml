name: Publish Godot PS5 M20 GPU Timestamp Workaround TESTBUILD
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful signed M13 native frame profiler build from trusted feature branch"
        required: true
  workflow_run:
    workflows: ['Godot PS5 M20 Nonblocking GPU Timestamp Trial v0.2.4']
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-godot-ps5-m20-gpu-timestamp
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'perf/godot-ps5-m20-timestamp-wait-fix' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == 'Yahballon/tmp_lap')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Strictly verify successful signed native build from trusted branch
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.PS5_RELEASE_TOKEN || github.token }}
          PARENT_RUN: ${{ github.event.workflow_run.id || '0' }}
          REQUESTED_RUN: ${{ inputs.run_id || '0' }}
        run: |
          set -euo pipefail
          run="$PARENT_RUN"
          if [ "$run" = 0 ]; then run="$REQUESTED_RUN"; fi
          [[ "$run" =~ ^[0-9]+$ ]] || exit 2
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > /tmp/m20-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" > /tmp/m20-artifacts.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.load(open('/tmp/m20-run.json'))
          assert r['repository']['full_name']=='Yahballon/tmp_lap'
          assert r['head_repository']['full_name']=='Yahballon/tmp_lap'
          assert r['head_branch']=='perf/godot-ps5-m20-timestamp-wait-fix'
          assert r['name']=='Godot PS5 M20 Nonblocking GPU Timestamp Trial v0.2.4'
          assert r['event']=='push'
          assert r['status']=='completed' and r['conclusion']=='success'
          matches=[a for a in json.load(open('/tmp/m20-artifacts.json'))['artifacts']
            if a['name']=='Godot-PS5-M20-NO-GL-TIMESTAMPS-v0.2.4-PS5-HARDWARE-UNTESTED'
            and not a['expired'] and a.get('workflow_run',{}).get('head_sha')==r['head_sha']]
          assert len(matches)==1, f'M13 signed native profiler artifact missing: {matches}'
          Path('/tmp/m20-build-sha').write_text(r['head_sha'])
          print('GODOT_PS5_M20_SIGNED_RELEASE_SOURCE_VERIFIED',r['id'],r['head_sha'])
          PY
          mkdir -p /tmp/m20-release
          gh run download "$run" --repo "$GITHUB_REPOSITORY" \
            --name Godot-PS5-M20-NO-GL-TIMESTAMPS-v0.2.4-PS5-HARDWARE-UNTESTED \
            --dir /tmp/m20-release
          test -s /tmp/m20-release/PPSA99847.zip
      - name: Independently validate installable PS5 signed AudioOut title
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,struct,zipfile
          p=Path('/tmp/m20-release/PPSA99847.zip')
          assert p.stat().st_size>1_000_000
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert all(n.startswith('PPSA99847/') and '..' not in Path(n).parts for n in names)
              for name in ('eboot.bin','assets/godot/visual-smoke.pck',
                    'assets/godot/physics-smoke.pck','assets/godot/m10b-font-ui.pck'):
                  assert 'PPSA99847/'+name in names
              data=z.read('PPSA99847/eboot.bin')
              assert len(data)>5_000_000 and data[:4]==struct.pack('<I',0x1d3d154f)
              meta=json.loads(z.read('PPSA99847/sce_sys/param.json'))
              assert meta['titleId']=='PPSA99847'
              assert meta['contentId']=='UP9000-PPSA99847_00-GODOTGLES3CANVAS'
              assert meta['contentVersion']=='01.000.015'
          print('GODOT_PS5_M20_SIGNED_ZIP_OK',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Publish v0.2.4 PS5 native frame-profiler TESTBUILD (experimental)
        env:
          GH_TOKEN: ${{ secrets.PS5_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          tag=godot-ps5-gles3-canvas-v0.2.4
          cat > /tmp/m20-notes.md <<'NOTES'
          Experimental Godot PS5 GLES3 v0.2.4 (M20) GPU timestamp readback avoidance trial.

          Two real PS5 TAR #39 M19 tests confirmed the bundled Pong scene suffers from multi-second stalls inside RenderingServer::draw. M19 timed 23 OpenGL commands: initial glClear up to 645ms and instanced draws ~274ms; later all measured GL calls are <2ms while the whole draw function blocks up to 18+seconds.

          Upstream Godot 4.7.2 drivers/gles3/storage/utilities.cpp synchronously reads GPU timestamps with glGetQueryObjectui64v(...GL_QUERY_RESULT...). Such an API can block waiting for GPU. This specific call was NOT covered by M19. M20 experimentally compiles out only the internal GLES3 *GPU profiling* timestamp issue/readback on PS5; original physics, GDScript, GLES3 rendering commands, audio, PCK files, controls and VSync=1 are preserved. It retains all previous M13–M19 CPU/GL instrumentation.

          This is a targeted *hypothesis*, not a proven PS5 lag fix. Expect GODOT_PS5_M20_GPU_TIMESTAMP_SYNC_DISABLED in stdout. Test bundled Pong for at least 60 seconds to see whether late stalls disappear; then M12d platformer with normal sound. If not improved, rollback to signed v0.2.3. Original M12d PCK remains external and untouched.
          Source: https://github.com/Yahballon/tmp_lap/tree/perf/godot-ps5-m20-timestamp-wait-fix/homebrew/godot-ps5

          NOTES
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx PPSA99847.zip
          else
            gh release create "$tag" /tmp/m20-release/PPSA99847.zip \
              --repo "$GITHUB_REPOSITORY" --target perf/godot-ps5-m20-timestamp-wait-fix \
              --title 'Godot PS5 GLES3 Canvas v0.2.4 – GPU Timestamp Query Bypass' \
              --notes-file /tmp/m20-notes.md --prerelease
          fi
      - name: Update TESTBUILDS version.json with verified release
        env:
          GH_TOKEN: ${{ secrets.PS5_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          python3 tools/test-version-catalog.py
          python3 tools/test-catalog-triggers.py
          python3 tools/update-version.py
          python3 -m json.tool version.json >/dev/null
          python3 - <<'PY'
          import json
          j=json.load(open('version.json'))
          matches=[x for x in j['apps'] if x['title_id']=='PPSA99847']
          assert len(matches)==1
          app=matches[0]
          assert app['version']=='0.2.4'
          assert app['tag']=='godot-ps5-gles3-canvas-v0.2.4'
          assert app['zip_url'].endswith('/PPSA99847.zip')
          assert j['app_count']==len(j['apps'])
          print('GODOT_PS5_M20_TESTBUILD_CATALOG_OK')
          PY
          if [ -n "$(git status --porcelain -- version.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add version.json
            git commit -m 'chore(testbuilds): publish Godot PS5 M20 GPU timestamp bypass v0.2.4 [skip ci]'
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              git push origin HEAD:main && exit 0
              sleep 3
            done
            exit 1
          fi
