name: Update TESTBUILDS Catalog
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/update-version-catalog.yml'
      - '.github/workflows/build-*.yml'
      - 'homebrew/*/app.json'
      - 'tools/update-version.py'
      - 'tools/test-version-catalog.py'
      - 'tools/test-catalog-triggers.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-version-catalog.yml'
      - 'tools/update-version.py'
      - 'tools/test-version-catalog.py'
      - 'tools/test-catalog-triggers.py'
  release:
    types: [published]
  workflow_run:
    # Exact GitHub Actions 'name:' values of the independent release workflows.
    # Release events emitted by GITHUB_TOKEN are not forwarded to other
    # workflows, so workflow_run completion is the reliable instant trigger.
    workflows:
      - Build PS5 Crypto Tracker
      - Build Starbound Sprint
      - Build WWW Speedtest
      - Build PS5 Payload LauncherX
      - Build Starbound Rebased (ShadowMount test)
      - Build PS5 Torrent Flow
      - Build PS5 Ebook Reader
      - Build PS5 PSTUBE
      - Build PS5 Audiobook Reader
      - Build PS5 System Info
      - Build PS5 MicroPython
      - Build PS5 Uninstaller
      - Build Drink Roulette PS5
      - Build Snake PS5
      - Build Bible Reader for PS5
      - Build PS5 ThemeChanger
      - Build PS5DreamcastX (native Flycast)
      - Publish PS5DreamcastX Release
      - Publish PS5DreamcastX TESTBUILD
      - Build PS5MesenX (native MesenCE)
      - Build PSJukebox
      - Publish PS5MesenX TESTBUILD
      - Import PS5NESX Sources
      - Build PS5NESX Native
      - Build NESYX Native
    types: [completed]
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: testbuilds-version-catalog
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate release discovery and workflow subscriptions
        run: |
          python3 tools/test-version-catalog.py
          python3 tools/test-catalog-triggers.py
  catalog:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh TESTBUILDS JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/test-version-catalog.py
          python3 tools/test-catalog-triggers.py
          python3 tools/update-version.py
          python3 -m json.tool version.json >/dev/null
      - name: Commit new version.json
        run: |
          if [ -z "$(git status --porcelain -- version.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: update TESTBUILDS catalog [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
