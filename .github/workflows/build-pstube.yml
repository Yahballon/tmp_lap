name: Build PS5 PSTUBE
on:
  workflow_dispatch:
  pull_request:
    paths: ['homebrew/pstube/**', '.github/workflows/build-pstube.yml']
  push:
    branches: [main]
    paths: ['homebrew/pstube/**', '.github/workflows/build-pstube.yml']
permissions:
  contents: write
jobs:
  ps5:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 ninja-build make wget curl unzip tar git python3 python3-pil pkg-config ca-certificates g++ libssl-dev ffmpeg
      - name: Prepare PS5 source and assets
        run: |
          git clone --depth=1 https://github.com/Yahballon/PS5-DevBridge.git /tmp/devbridge
          cp -a /tmp/devbridge/templates/simple-calc ./app
          cp homebrew/pstube/native/*.cpp homebrew/pstube/native/*.hpp app/src/
          python3 homebrew/pstube/assets/generate_icon.py app/sce_sys/icon0.png
          cp app/sce_sys/icon0.png app/assets/icon0.png
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('app/sce_sys/param.json')
          d=json.loads(p.read_text())
          d.update(titleId='PPSA99762',conceptId='99762',contentId='UP9000-PPSA99762_00-PSTUBEYAHBALLON1',contentVersion='01.000.005')
          d['localizedParameters']['en-US']['titleName']='PSTUBE'
          p.write_text(json.dumps(d,indent=2)+'\n')
          pem=Path('/etc/ssl/certs/ca-certificates.crt').read_text()
          Path('app/src/ca_bundle.inc').write_text('static constexpr char kCaBundle[] = R"PS5CABUNDLE(' + pem + ')PS5CABUNDLE";\n')
          PY
      - name: Test live catalog JSON parsing (host)
        run: |
          g++ -std=c++20 -O2 -pthread -Iapp/src homebrew/pstube/tests/catalog_parser_test.cpp \
            app/src/pstube.cpp app/src/transfer.cpp app/src/thumbnails.cpp \
            -lssl -lcrypto -o /tmp/pstube-catalog-test
          /tmp/pstube-catalog-test
      - name: Verify native C++ Android API stream resolution
        run: |
          g++ -std=c++20 -O2 -pthread -Iapp/src \
            homebrew/pstube/tests/native_player_test.cpp \
            app/src/pstube.cpp app/src/transfer.cpp app/src/thumbnails.cpp \
            -lssl -lcrypto -o /tmp/pstube-native-player-test
          /tmp/pstube-native-player-test
      - name: Verify native full MP4 download (network diagnostic)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          g++ -std=c++20 -O2 -pthread -Iapp/src \
            homebrew/pstube/tests/native_download_test.cpp \
            app/src/pstube.cpp app/src/transfer.cpp app/src/thumbnails.cpp \
            -lssl -lcrypto -o /tmp/pstube-native-download-test
          timeout 110s /tmp/pstube-native-download-test
      - name: Probe public API availability (non-blocking diagnostic)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import urllib.request, json, concurrent.futures
          domains=('inv.nadeko.net','invidious.nerdvpn.de','yt.chocolatemoo53.com','invidious.tiekoetter.com')
          def check(domain):
              try:
                  request=urllib.request.Request('https://'+domain+'/api/v1/search?q=ps5&type=video',
                      headers={'User-Agent':'PSTUBE/0.5.0','Accept':'application/json'})
                  with urllib.request.urlopen(request,timeout=8) as response:
                      data=json.load(response)
                  valid=isinstance(data,list) and sum(bool(x.get('videoId')) for x in data if isinstance(x,dict))
                  return domain, str(valid)+' videos'
              except Exception as error:return domain,type(error).__name__+': '+str(error)[:90]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
              for host,message in executor.map(check,domains):
                  print('Catalog provider:',host,message)
          PY
      - name: Exercise C++ renderer parser with live YouTube HTML (diagnostic)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import urllib.request
          request=urllib.request.Request('https://www.youtube.com/results?search_query=ps5',
            headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36',
                     'Accept':'text/html,application/json;q=0.9,*/*;q=0.8','Accept-Encoding':'identity'})
          with urllib.request.urlopen(request,timeout=15) as response:
              html=response.read(5*1024*1024)
          open('/tmp/pstube-youtube.html','wb').write(html)
          print('Live YouTube HTML bytes:',len(html))
          PY
          /tmp/pstube-catalog-test /tmp/pstube-youtube.html
      - name: Probe public video playback formats (diagnostic)
        continue-on-error: true
        run: python3 homebrew/pstube/tests/probe_watch_formats.py
      - name: Verify actual JPEG over our native HTTPS transport
        continue-on-error: true
        run: |
          g++ -std=c++20 -O2 -pthread -Iapp/src homebrew/pstube/tests/thumbnail_http_test.cpp app/src/transfer.cpp -lssl -lcrypto -o /tmp/pstube-thumbnail-http-test
          /tmp/pstube-thumbnail-http-test
      - name: Generate licensed in-app video and audio self-test
        run: |
          mkdir -p app/assets/videos
          ffmpeg -hide_banner -loglevel error -nostdin -y -threads 2 \
            -f lavfi -i 'testsrc2=size=640x360:rate=25' \
            -f lavfi -i 'sine=frequency=440:sample_rate=48000' \
            -t 5 -c:v libx264 -pix_fmt yuv420p -preset veryfast -crf 30 \
            -c:a aac -b:a 96k -movflags +faststart app/assets/videos/pstube-selftest.mp4
      - name: Probe native Innertube direct media support (diagnostic)
        continue-on-error: true
        run: python3 homebrew/pstube/tests/probe_native_innertube.py
      - name: Prepare native OpenGL SDK
        working-directory: app
        env:
          PS5_CLANG: clang-18
          USE_CCACHE: '0'
          BUILD_JOBS: '4'
        run: bash tools/prepare-opengl.sh
      - name: Prepare POSIX compatibility archive
        run: |
          mkdir -p app/build/jb-json
          cp app/.deps/native/ps5-payload-sdk/target/lib/libc.a app/build/jb-json/libjb-posix.a
          llvm-objcopy-18 --redefine-sym=openlog=jb_sdk_openlog --redefine-sym=closelog=jb_sdk_closelog --redefine-sym=mkstemp=jb_sdk_mkstemp --redefine-sym=mkstemps=jb_sdk_mkstemps --redefine-sym=getpwuid_r=jb_sdk_getpwuid_r app/build/jb-json/libjb-posix.a
      - name: Compile and package native PSTUBE
        working-directory: app
        env:
          PS5_CLANG: clang-18
          USE_CCACHE: '0'
          BUILD_JOBS: '4'
        run: make USE_CCACHE=0 BUILD_JOBS=4 PACBREW_PACKAGES='openssl libavformat libavcodec libavutil libswscale libswresample sdl2' app
      - name: Validate package
        run: |
          python3 - <<'PY'
          import json,pathlib,struct,zipfile
          root=pathlib.Path('app/dist/PPSA99762')
          executable=(root/'eboot.bin').read_bytes()
          assert len(executable)>1000 and struct.unpack('<I',executable[:4])[0]==0x1D3D154F
          assert b'v0.5.0' in executable
          d=json.loads((root/'sce_sys/param.json').read_text())
          assert d['titleId']=='PPSA99762' and d['contentVersion']=='01.000.005'
          for f in ['sce_sys/icon0.png','sce_module/libc.prx','assets/fonts/inter-semibold.huifont','assets/videos/pstube-selftest.mp4']:
            assert (root/f).is_file(),f
          with zipfile.ZipFile('app/dist/PPSA99762.zip') as z:
            assert z.testzip() is None
            assert 'PPSA99762/eboot.bin' in z.namelist()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PSTUBE-v0.5.0
          path: app/dist/PPSA99762.zip
          if-no-files-found: error
      - name: Publish alpha release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view pstube-v0.5.0 >/dev/null 2>&1; then exit 0; fi
          gh release create pstube-v0.5.0 app/dist/PPSA99762.zip --target "$GITHUB_SHA" --title "PSTUBE v0.5.0 (Instant Streaming & Infinite Scroll)" --notes-file homebrew/pstube/RELEASE_NOTES.md
