name: Build PS5 PSTUBE
on:
  workflow_dispatch:
  pull_request:
    paths: ['homebrew/pstube/**', '.github/workflows/build-pstube.yml']
  push:
    branches: [main]
    paths: ['homebrew/pstube/**', '.github/workflows/build-pstube.yml']
permissions:
  contents: write
jobs:
  ps5:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 ninja-build make wget curl unzip tar git python3 python3-pil pkg-config ca-certificates g++ libssl-dev ffmpeg libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev libsdl2-dev
      - name: Prepare PS5 source and assets
        run: |
          git clone --depth=1 https://github.com/Yahballon/PS5-DevBridge.git /tmp/devbridge
          cp -a /tmp/devbridge/templates/simple-calc ./app
          cp homebrew/pstube/native/*.cpp homebrew/pstube/native/*.hpp app/src/
          python3 homebrew/pstube/assets/generate_icon.py app/sce_sys/icon0.png
          cp app/sce_sys/icon0.png app/assets/icon0.png
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('app/sce_sys/param.json')
          d=json.loads(p.read_text())
          d.update(titleId='PPSA99762',conceptId='99762',contentId='UP9000-PPSA99762_00-PSTUBEYAHBALLON1',contentVersion='01.000.012')
          d['localizedParameters']['en-US']['titleName']='PSTUBE'
          p.write_text(json.dumps(d,indent=2)+'\n')
          pem=Path('/etc/ssl/certs/ca-certificates.crt').read_text()
          Path('app/src/ca_bundle.inc').write_text('static constexpr char kCaBundle[] = R"PS5CABUNDLE(' + pem + ')PS5CABUNDLE";\n')
          PY
      - name: Check real YouTube HD HTTPS Range and Client headers
        continue-on-error: true
        timeout-minutes: 3
        run: |
          g++ -std=c++20 -O2 -pthread -Iapp/src \
            homebrew/pstube/tests/probe_native_hd_http.cpp \
            app/src/pstube.cpp app/src/transfer.cpp app/src/thumbnails.cpp \
            -lssl -lcrypto -o /tmp/pstube-hd-http-probe
          timeout 50s /tmp/pstube-hd-http-probe
          python3 homebrew/pstube/tests/probe_hd_http.py
      - name: Decode real HD AVC and AAC over HTTPS with native FFmpeg
        timeout-minutes: 6
        run: |
          g++ -std=c++20 -O2 -pthread -DPSTUBE_HOST_TEST -Iapp/src \
            homebrew/pstube/tests/remote_hd_decode_test.cpp \
            app/src/pstube.cpp app/src/transfer.cpp app/src/thumbnails.cpp app/src/media.cpp app/src/range_media.cpp \
            $(pkg-config --cflags --libs libavformat libavcodec libavutil libswscale libswresample sdl2) -lssl -lcrypto \
            -lssl -lcrypto -o /tmp/pstube-remote-hd-test
          SDL_AUDIODRIVER=dummy timeout 295s /tmp/pstube-remote-hd-test
      - name: Test live catalog JSON parsing (host)
        run: |
          g++ -std=c++20 -O2 -pthread -Iapp/src homebrew/pstube/tests/catalog_parser_test.cpp \
            app/src/pstube.cpp app/src/transfer.cpp app/src/thumbnails.cpp \
            -lssl -lcrypto -o /tmp/pstube-catalog-test
          /tmp/pstube-catalog-test
      - name: Validate YouTube continuation JSON and pagination (native C++)
        run: |
          g++ -std=c++20 -O2 -pthread -Iapp/src \
            homebrew/pstube/tests/pagination_test.cpp \
            app/src/pstube.cpp app/src/transfer.cpp app/src/thumbnails.cpp \
            -lssl -lcrypto -o /tmp/pstube-pagination-test
          /tmp/pstube-pagination-test
      - name: Test real YouTube page 2 over native HTTPS (network diagnostic)
        continue-on-error: true
        timeout-minutes: 2
        run: |
          g++ -std=c++20 -O2 -pthread -Iapp/src \
            homebrew/pstube/tests/live_pagination_test.cpp \
            app/src/pstube.cpp app/src/transfer.cpp app/src/thumbnails.cpp \
            -lssl -lcrypto -o /tmp/pstube-live-pagination-test
          timeout 80s /tmp/pstube-live-pagination-test
      - name: Verify native C++ Android API stream resolution
        run: |
          g++ -std=c++20 -O2 -pthread -Iapp/src \
            homebrew/pstube/tests/native_player_test.cpp \
            app/src/pstube.cpp app/src/transfer.cpp app/src/thumbnails.cpp \
            -lssl -lcrypto -o /tmp/pstube-native-player-test
          /tmp/pstube-native-player-test
      - name: Verify native FFmpeg reads HTTPS video before download completes (diagnostic)
        continue-on-error: true
        timeout-minutes: 2
        run: |
          /tmp/pstube-native-player-test /tmp/pstube-stream-uri.txt
          python3 - <<'PY'
          import os,subprocess,re
          path="/tmp/pstube-stream-uri.txt"
          with open(path) as handle: url=handle.read().strip()
          os.remove(path)
          if not (url.startswith("https://") and ".googlevideo.com" in url[:200]):
              raise SystemExit("Unsafe test URI")
          try:
              result=subprocess.run([
                "ffprobe","-v","error","-tls_verify","1","-ca_file",
                "/etc/ssl/certs/ca-certificates.crt","-rw_timeout","12000000",
                "-probesize","500000","-analyzeduration","2000000",
                "-select_streams","v:0","-show_entries",
                "stream=codec_name,width,height","-of","default=nw=1",url
              ],capture_output=True,text=True,timeout=40)
              if result.returncode:
                  print("HTTPS FFmpeg probe failed; status",result.returncode,
                        "HTTP403", "403" in result.stderr,
                        "TLS", "certificate" in result.stderr.lower())
                  raise SystemExit(result.returncode)
              print("Native FFmpeg HTTPS can probe first video frames:",
                    result.stdout.strip()[:180])
          finally:
              pass
          PY
      - name: Verify native full MP4 download (network diagnostic)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          g++ -std=c++20 -O2 -pthread -Iapp/src \
            homebrew/pstube/tests/native_download_test.cpp \
            app/src/pstube.cpp app/src/transfer.cpp app/src/thumbnails.cpp \
            -lssl -lcrypto -o /tmp/pstube-native-download-test
          timeout 110s /tmp/pstube-native-download-test
      - name: Diagnose available real YouTube HD video/audio formats
        continue-on-error: true
        run: python3 homebrew/pstube/tests/probe_hd_formats.py
      - name: Test HD source format selection (host)
        run: |
          g++ -std=c++20 -O2 -pthread -Iapp/src \
            homebrew/pstube/tests/quality_selection_test.cpp \
            app/src/pstube.cpp app/src/transfer.cpp app/src/thumbnails.cpp \
            -lssl -lcrypto -o /tmp/pstube-quality-test
          /tmp/pstube-quality-test
      - name: Assert real native 720p and 1080p H.264 plus AAC resolution
        timeout-minutes: 2
        run: |
          g++ -std=c++20 -O2 -pthread -Iapp/src \
            homebrew/pstube/tests/live_hd_resolution_test.cpp \
            app/src/pstube.cpp app/src/transfer.cpp app/src/thumbnails.cpp \
            -lssl -lcrypto -o /tmp/pstube-live-hd
          timeout 95s /tmp/pstube-live-hd
      - name: Test native YouTube continuation with two real pages
        timeout-minutes: 2
        run: |
          g++ -std=c++20 -O2 -pthread -Iapp/src \
            homebrew/pstube/tests/native_search_pagination_test.cpp \
            app/src/pstube.cpp app/src/transfer.cpp app/src/thumbnails.cpp \
            -lssl -lcrypto -o /tmp/pstube-native-pagination
          timeout 100s /tmp/pstube-native-pagination
      - name: Probe public API availability (non-blocking diagnostic)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import urllib.request, json, concurrent.futures
          domains=('inv.nadeko.net','invidious.nerdvpn.de','yt.chocolatemoo53.com','invidious.tiekoetter.com')
          def check(domain):
              try:
                  request=urllib.request.Request('https://'+domain+'/api/v1/search?q=ps5&type=video',
                      headers={'User-Agent':'PSTUBE/0.7.3','Accept':'application/json'})
                  with urllib.request.urlopen(request,timeout=8) as response:
                      data=json.load(response)
                  valid=isinstance(data,list) and sum(bool(x.get('videoId')) for x in data if isinstance(x,dict))
                  return domain, str(valid)+' videos'
              except Exception as error:return domain,type(error).__name__+': '+str(error)[:90]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
              for host,message in executor.map(check,domains):
                  print('Catalog provider:',host,message)
          PY
      - name: Exercise C++ renderer parser with live YouTube HTML (diagnostic)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import urllib.request
          request=urllib.request.Request('https://www.youtube.com/results?search_query=ps5',
            headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36',
                     'Accept':'text/html,application/json;q=0.9,*/*;q=0.8','Accept-Encoding':'identity'})
          with urllib.request.urlopen(request,timeout=15) as response:
              html=response.read(5*1024*1024)
          open('/tmp/pstube-youtube.html','wb').write(html)
          print('Live YouTube HTML bytes:',len(html))
          PY
          /tmp/pstube-catalog-test /tmp/pstube-youtube.html
      - name: Probe public video playback formats (diagnostic)
        continue-on-error: true
        run: python3 homebrew/pstube/tests/probe_watch_formats.py
      - name: Verify actual JPEG over our native HTTPS transport
        continue-on-error: true
        run: |
          g++ -std=c++20 -O2 -pthread -Iapp/src homebrew/pstube/tests/thumbnail_http_test.cpp app/src/transfer.cpp -lssl -lcrypto -o /tmp/pstube-thumbnail-http-test
          /tmp/pstube-thumbnail-http-test
      - name: Generate licensed in-app video and audio self-test
        run: |
          mkdir -p app/assets/videos
          ffmpeg -hide_banner -loglevel error -nostdin -y -threads 2 \
            -f lavfi -i 'testsrc2=size=640x360:rate=25' \
            -f lavfi -i 'sine=frequency=440:sample_rate=48000' \
            -t 5 -c:v libx264 -pix_fmt yuv420p -preset veryfast -crf 30 \
            -c:a aac -b:a 96k -movflags +faststart app/assets/videos/pstube-selftest.mp4
      - name: Probe native Innertube direct media support (diagnostic)
        continue-on-error: true
        run: python3 homebrew/pstube/tests/probe_native_innertube.py
      - name: Test FFmpeg seek, rewind, pause and audio pipeline (host)
        run: |
          g++ -std=c++20 -O2 -pthread -Iapp/src -Ihomebrew/pstube/native \
            homebrew/pstube/tests/media_seek_test.cpp app/src/media.cpp app/src/range_media.cpp \
            $(pkg-config --cflags --libs libavformat libavcodec libavutil libswscale libswresample sdl2) -lssl -lcrypto \
            -o /tmp/pstube-media-seek-test
          SDL_AUDIODRIVER=dummy timeout 25s /tmp/pstube-media-seek-test app/assets/videos/pstube-selftest.mp4
      - name: Exercise native HD video and separate AAC audio
        run: |
          ffmpeg -hide_banner -loglevel error -nostdin -y -threads 2 \
            -f lavfi -i 'testsrc2=size=1280x720:rate=25' \
            -t 8 -c:v libx264 -preset ultrafast -crf 38 -pix_fmt yuv420p -an \
            -movflags +faststart /tmp/pstube-hd-test.mp4
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -f lavfi -i 'sine=frequency=440:sample_rate=48000' \
            -t 8 -c:a aac -b:a 128k /tmp/pstube-hd-audio.m4a
          g++ -std=c++20 -O2 -pthread -Iapp/src -Ihomebrew/pstube/native \
            homebrew/pstube/tests/adaptive_media_test.cpp app/src/media.cpp app/src/range_media.cpp \
            $(pkg-config --cflags --libs libavformat libavcodec libavutil libswscale libswresample sdl2) -lssl -lcrypto \
            -o /tmp/pstube-adaptive-test
          SDL_AUDIODRIVER=dummy timeout 35s /tmp/pstube-adaptive-test \
            /tmp/pstube-hd-test.mp4 /tmp/pstube-hd-audio.m4a
      - name: Prepare native OpenGL SDK
        working-directory: app
        env:
          PS5_CLANG: clang-18
          USE_CCACHE: '0'
          BUILD_JOBS: '4'
        run: bash tools/prepare-opengl.sh
      - name: Prepare POSIX compatibility archive
        run: |
          mkdir -p app/build/jb-json
          cp app/.deps/native/ps5-payload-sdk/target/lib/libc.a app/build/jb-json/libjb-posix.a
          llvm-objcopy-18 --redefine-sym=openlog=jb_sdk_openlog --redefine-sym=closelog=jb_sdk_closelog --redefine-sym=mkstemp=jb_sdk_mkstemp --redefine-sym=mkstemps=jb_sdk_mkstemps --redefine-sym=getpwuid_r=jb_sdk_getpwuid_r app/build/jb-json/libjb-posix.a
      - name: Compile and package native PSTUBE
        working-directory: app
        env:
          PS5_CLANG: clang-18
          USE_CCACHE: '0'
          BUILD_JOBS: '4'
        run: make USE_CCACHE=0 BUILD_JOBS=4 PACBREW_PACKAGES='openssl libavformat libavcodec libavutil libswscale libswresample sdl2' app
      - name: Validate package
        run: |
          python3 - <<'PY'
          import json,pathlib,struct,zipfile
          root=pathlib.Path('app/dist/PPSA99762')
          executable=(root/'eboot.bin').read_bytes()
          assert len(executable)>1000 and struct.unpack('<I',executable[:4])[0]==0x1D3D154F
          assert b'v0.7.3' in executable
          d=json.loads((root/'sce_sys/param.json').read_text())
          assert d['titleId']=='PPSA99762' and d['contentVersion']=='01.000.012'
          for f in ['sce_sys/icon0.png','sce_module/libc.prx','assets/fonts/inter-semibold.huifont','assets/videos/pstube-selftest.mp4']:
            assert (root/f).is_file(),f
          with zipfile.ZipFile('app/dist/PPSA99762.zip') as z:
            assert z.testzip() is None
            assert 'PPSA99762/eboot.bin' in z.namelist()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PSTUBE-v0.7.3
          path: app/dist/PPSA99762.zip
          if-no-files-found: error
      - name: Publish alpha release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view pstube-v0.7.3 >/dev/null 2>&1; then exit 0; fi
          gh release create pstube-v0.7.3 app/dist/PPSA99762.zip --target "$GITHUB_SHA" --title "PSTUBE v0.7.3 (Selectable HD Quality 720p/1080p)" --notes-file homebrew/pstube/RELEASE_NOTES.md
