name: Build WWW Speedtest
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'homebrew/www-speedtest/**'
      - '.github/workflows/build-www-speedtest.yml'
  push:
    branches: [main]
    paths:
      - 'homebrew/www-speedtest/**'
      - '.github/workflows/build-www-speedtest.yml'
permissions:
  contents: write
jobs:
  ps5:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 ninja-build make wget curl unzip tar git python3 pkg-config ca-certificates python3-pil
      - name: Fetch native PS5 scaffold
        run: |
          git clone --depth=1 https://github.com/Yahballon/PS5-DevBridge.git /tmp/devbridge
          cp -a /tmp/devbridge/templates/simple-calc ./app
      - name: Insert app source and metadata
        run: |
          cp homebrew/www-speedtest/native/*.cpp homebrew/www-speedtest/native/*.hpp app/src/
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("app/sce_sys/param.json")
          d=json.loads(p.read_text())
          d["titleId"]="PPSA99573"
          d["conceptId"]="99573"
          d["contentId"]="UP9000-PPSA99573_00-WWWSPEEDTESTPS5A"
          d["contentVersion"]="01.001.003"
          d["localizedParameters"]["en-US"]["titleName"]="WWW Speedtest"
          p.write_text(json.dumps(d,indent=2)+"\n")
          ca=pathlib.Path("/etc/ssl/certs/ca-certificates.crt").read_text()
          pathlib.Path("app/src/ca_bundle.inc").write_text('static const char kCaBundle[] = R"PS5CABUNDLE('+ca+')PS5CABUNDLE";\n')
          PY
          python3 homebrew/www-speedtest/assets/generate_icon.py
          mkdir -p app/assets
          cp /etc/ssl/certs/ca-certificates.crt app/assets/cacert.pem
      - name: Prepare PS5 OpenGL SDK
        working-directory: app
        env:
          USE_CCACHE: "0"
          BUILD_JOBS: "4"
          PS5_CLANG: clang-18
        run: bash tools/prepare-opengl.sh
      - name: Fix SDK POSIX symbols
        run: |
          mkdir -p app/build/jb-json
          cp app/.deps/native/ps5-payload-sdk/target/lib/libc.a app/build/jb-json/libjb-posix.a
          llvm-objcopy-18 --redefine-sym=openlog=jb_sdk_openlog --redefine-sym=closelog=jb_sdk_closelog --redefine-sym=mkstemp=jb_sdk_mkstemp --redefine-sym=mkstemps=jb_sdk_mkstemps --redefine-sym=getpwuid_r=jb_sdk_getpwuid_r app/build/jb-json/libjb-posix.a
      - name: Build app
        working-directory: app
        env:
          USE_CCACHE: "0"
          BUILD_JOBS: "4"
          PS5_CLANG: clang-18
        run: make USE_CCACHE=0 BUILD_JOBS=4 PACBREW_PACKAGES=openssl app
      - name: Verify native ZIP
        run: |
          python3 - <<'PY'
          import json,pathlib,struct,zipfile
          root=pathlib.Path("app/dist/PPSA99573")
          p=root/"eboot.bin"
          assert p.is_file() and p.stat().st_size>0
          assert struct.unpack("<I",p.read_bytes()[:4])[0]==0x1D3D154F
          for f in ("sce_sys/param.json","sce_sys/icon0.png","sce_module/libc.prx","assets/cacert.pem"):
              assert (root/f).is_file(),f
          meta=json.loads((root/"sce_sys/param.json").read_text())
          assert meta["titleId"]=="PPSA99573"
          assert b"v0.4.3" in p.read_bytes()
          with zipfile.ZipFile("app/dist/PPSA99573.zip") as z:
              assert z.testzip() is None
              assert "PPSA99573/eboot.bin" in z.namelist()
              assert "PPSA99573/sce_sys/icon0.png" in z.namelist()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: WWW-Speedtest-v0.4.3-PPSA99573
          path: app/dist/PPSA99573.zip
          if-no-files-found: error
      - name: Publish verified release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view www-speedtest-v0.4.3 >/dev/null 2>&1; then exit 0; fi
          gh release create www-speedtest-v0.4.3 app/dist/PPSA99573.zip --target "$GITHUB_SHA" --title "WWW Speedtest v0.4.3" --notes "Native PS5 Cloudflare HTTPS speedtest. Download/upload speed, connection latency, jitter, live graphs and DualSense navigation. Extract ZIP to /data/homebrew/. Requires jailbreak/homebrew loader. Real PS5 hardware testing pending. Real locally saved test history and screenshot-inspired dashboard. Geographic LibreSpeed server options available with server-side uptime limitations. IP/ISP detection unavailable."
