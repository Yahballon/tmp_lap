name: Build Drink Roulette PS5
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'homebrew/drink-roulette/**'
      - '.github/workflows/build-drink-roulette.yml'
  push:
    branches: [main]
    paths:
      - 'homebrew/drink-roulette/**'
      - '.github/workflows/build-drink-roulette.yml'
permissions:
  contents: write
jobs:
  ps5:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Prepare host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 ninja-build make wget curl unzip tar git g++ python3 python3-pil pkg-config ca-certificates
      - name: Host game-engine regression tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror homebrew/drink-roulette/tests/game_test.cpp -o /tmp/drink-roulette-test
          /tmp/drink-roulette-test
          python3 -m json.tool homebrew/drink-roulette/app.json >/dev/null
      - name: Prepare original native PS5 framework
        run: |
          git clone --depth=1 https://github.com/Yahballon/PS5-DevBridge.git /tmp/devbridge
          cp -a /tmp/devbridge/templates/simple-calc ./app
          cp homebrew/drink-roulette/native/main.cpp homebrew/drink-roulette/native/game.hpp app/src/
          python3 homebrew/drink-roulette/assets/generate_assets.py app
          if [ -f homebrew/drink-roulette/assets/menu_background.jpg ]; then
            cp homebrew/drink-roulette/assets/menu_background.jpg app/assets/menu_background.jpg
          fi
          python3 - <<'PY'
          import json, pathlib
          app=json.loads(pathlib.Path('homebrew/drink-roulette/app.json').read_text())
          path=pathlib.Path('app/sce_sys/param.json')
          p=json.loads(path.read_text())
          p.update(titleId=app['titleId'],conceptId=app['titleId'][4:],contentId=app['contentId'],contentVersion=app['contentVersion'])
          p['localizedParameters']['en-US']['titleName']='Drink Roulette'
          path.write_text(json.dumps(p,indent=2)+'\n')
          PY
      - name: Prepare native PS5 OpenGL toolchain
        working-directory: app
        env:
          USE_CCACHE: '0'
          BUILD_JOBS: '4'
          PS5_CLANG: clang-18
        run: bash tools/prepare-opengl.sh
      - name: Resolve POSIX compatibility symbols
        run: |
          mkdir -p app/build/jb-json
          cp app/.deps/native/ps5-payload-sdk/target/lib/libc.a app/build/jb-json/libjb-posix.a
          llvm-objcopy-18 --redefine-sym=openlog=jb_sdk_openlog --redefine-sym=closelog=jb_sdk_closelog --redefine-sym=mkstemp=jb_sdk_mkstemp --redefine-sym=mkstemps=jb_sdk_mkstemps --redefine-sym=getpwuid_r=jb_sdk_getpwuid_r app/build/jb-json/libjb-posix.a
      - name: Compile native PS5 homebrew
        working-directory: app
        env:
          USE_CCACHE: '0'
          BUILD_JOBS: '4'
          PS5_CLANG: clang-18
        run: make USE_CCACHE=0 BUILD_JOBS=4 app
      - name: Verify install folder and ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,struct,zipfile
          root=Path('app/dist/PPSA99841')
          elf=(root/'eboot.bin').read_bytes()
          assert len(elf)>1000
          assert elf[:4]==struct.pack('<I',0x1d3d154f)
          assert b'v0.1.0' in elf
          meta=json.loads((root/'sce_sys/param.json').read_text())
          assert meta['titleId']=='PPSA99841'
          assert meta['contentId']=='UP9000-PPSA99841_00-DRINKROULETTE001'
          names=['eboot.bin','sce_sys/icon0.png','sce_module/libc.prx','assets/fonts/inter-semibold.huifont','assets/generated_scene.jpg']
          for n in names: assert (root/n).is_file(),n
          with zipfile.ZipFile('app/dist/PPSA99841.zip') as z:
            assert z.testzip() is None
            for n in names: assert f'PPSA99841/{n}' in z.namelist(),n
          print('PS5 eboot, launcher assets, metadata and ZIP verified')
          PY
      - name: Upload test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Drink-Roulette-v0.1.0-PPSA99841
          path: app/dist/PPSA99841.zip
          if-no-files-found: error
      - name: Publish verified TESTBUILDS release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view drink-roulette-v0.1.0 >/dev/null 2>&1; then
            echo 'Release exists; refusing to replace immutable assets'
            exit 1
          fi
          gh release create drink-roulette-v0.1.0 app/dist/PPSA99841.zip --target "$GITHUB_SHA" --title "Drink Roulette v0.1.0" --notes-file homebrew/drink-roulette/RELEASE_NOTES.md
