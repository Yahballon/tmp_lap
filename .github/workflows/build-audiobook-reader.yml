name: Build PS5 Audiobook Reader
on:
  workflow_dispatch:
  pull_request:
    paths: ['homebrew/audiobook-reader/**', '.github/workflows/build-audiobook-reader.yml']
  push:
    branches: [main]
    paths: ['homebrew/audiobook-reader/**', '.github/workflows/build-audiobook-reader.yml']
permissions:
  contents: write
jobs:
  ps5:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 ninja-build make wget curl unzip tar git python3 python3-pil pkg-config ca-certificates g++ libavformat-dev libavcodec-dev libavutil-dev libswresample-dev libsdl2-dev ffmpeg
      - name: Test audiobook library
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror             -D'AUDIOBOOK_DATA_ROOT="/tmp/ps5-audiobook-ci"'             homebrew/audiobook-reader/native/library.cpp             homebrew/audiobook-reader/tests/library_test.cpp             -o /tmp/audiobook-library-test
          /tmp/audiobook-library-test
      - name: Test live chapter transitions, seeks and chapterless books
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            homebrew/audiobook-reader/tests/chapter_tracking_test.cpp \
            -o /tmp/audiobook-chapter-tracking-test
          /tmp/audiobook-chapter-tracking-test
      - name: Test native M4B parser and player compilation on host
        run: |
          g++ -std=c++20 -O2 -pthread -Wall -Wextra             -Ihomebrew/audiobook-reader/native -c             homebrew/audiobook-reader/native/chapters.cpp             $(pkg-config --cflags libavformat libavcodec libavutil)             -o /tmp/audiobook-chapters.o
          g++ -std=c++20 -O2 -pthread -Wall -Wextra             -Ihomebrew/audiobook-reader/native -c             homebrew/audiobook-reader/native/audio_player.cpp             $(pkg-config --cflags libavformat libavcodec libavutil libswresample sdl2)             -o /tmp/audiobook-player.o
          ffmpeg -hide_banner -loglevel error -nostdin -y -f lavfi -i 'sine=frequency=440:sample_rate=48000' -t 3 -c:a aac -b:a 96k -f mp4 /tmp/audiobook-test.m4b
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1 /tmp/audiobook-test.m4b | grep -q aac
      - name: Test embedded M4B album art extraction
        run: |
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          im=Image.new('RGB',(192,256),(28,68,111))
          d=ImageDraw.Draw(im);d.rectangle((18,18,174,238),outline='white',width=5)
          d.ellipse((53,89,139,178),outline='yellow',width=8)
          im.save('/tmp/audio-cover-fixture.jpg',quality=88)
          PY
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -f lavfi -i 'sine=frequency=440:sample_rate=48000' -i /tmp/audio-cover-fixture.jpg \
            -map 0:a -map 1:v -t 2 -c:a aac -c:v mjpeg -disposition:v:0 attached_pic \
            -f mp4 /tmp/audiobook-with-cover.m4b
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread \
            -D'AUDIOBOOK_DATA_ROOT="/tmp/ps5-audiobook-ci"' \
            -Ihomebrew/audiobook-reader/native \
            homebrew/audiobook-reader/native/cover_extract.cpp \
            homebrew/audiobook-reader/native/mp4_cover.cpp \
            homebrew/audiobook-reader/tests/cover_test.cpp \
            $(pkg-config --cflags --libs libavformat libavcodec libavutil) \
            -o /tmp/audiobook-cover-test
          /tmp/audiobook-cover-test /tmp/audiobook-with-cover.m4b /tmp/audiobook-test.m4b
      - name: Validate iTunes MP4 covr box parsing
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          def box(name,data):
              return struct.pack('>I4s',len(data)+8,name.encode())+data
          image=Path('/tmp/audio-cover-fixture.jpg').read_bytes()
          data=box('data',struct.pack('>II',13,0)+image)
          fixture=box('moov',box('udta',box('meta',bytes(4)+
              box('ilst',box('covr',data)))))
          Path('/tmp/itunes-covr-box.m4b').write_bytes(fixture)
          PY
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread \
            -D'AUDIOBOOK_DATA_ROOT="/tmp/ps5-audiobook-ci"' \
            homebrew/audiobook-reader/native/mp4_cover.cpp \
            homebrew/audiobook-reader/tests/mp4_covr_test.cpp \
            -o /tmp/itunes-covr-test
          /tmp/itunes-covr-test /tmp/itunes-covr-box.m4b /tmp/audiobook-test.m4b
      - name: Verify USB ABooks mount diagnostics
        run: |
          mkdir -p /tmp/audiobook-diagnostics/ABooks
          printf 'test' > /tmp/audiobook-diagnostics/ABooks/First.m4b
          gcc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -DAUDIOBOOK_USB_TEST \
            -DAUDIOBOOK_USB_ROOT='"/tmp/audiobook-diagnostics/ABooks"' \
            homebrew/audiobook-reader/helper/abookscan.c -o /tmp/abookscan-diagnostic
          /tmp/abookscan-diagnostic > /tmp/abookscan-catalog
          python3 - <<'PY'
          from pathlib import Path
          data=Path('/tmp/abookscan-catalog').read_bytes()
          assert b'ABOOK1\n' in data
          assert b'ROOT /tmp/audiobook-diagnostics/ABooks\n' in data
          assert b'First.m4b' in data
          assert data.endswith(b'DONE\n')
          print('PASS: ABooks catalog root and M4B listing')
          PY
          gcc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -DAUDIOBOOK_USB_TEST \
            -DAUDIOBOOK_USB_ROOT='"/tmp/audiobook-diagnostics/missing"' \
            homebrew/audiobook-reader/helper/abookscan.c -o /tmp/abookscan-missing
          /tmp/abookscan-missing > /tmp/abookscan-error
          python3 - <<'PY'
          from pathlib import Path
          data=Path('/tmp/abookscan-error').read_bytes()
          assert data.startswith(b'ABOOK1\nERROR ')
          assert data.endswith(b'DONE\n')
          print('PASS: missing ABooks mount returns actionable terminal diagnostic')
          PY
      - name: Test USB ABooks discovery and interrupted transfers
        run: |
          python3 homebrew/audiobook-reader/tests/generate_usb_transfer_fixture.py /tmp/audiobook-usb-ci
          mkdir -p /tmp/audiobook-usb-ci/AudioBookReader/Books
          cp /tmp/audiobook-test.m4b /tmp/audiobook-usb-ci/AudioBookReader/Books/LocalVoice.m4b
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path('/tmp/audiobook-usb-ci')
          Image.new('RGB',(64,80),(75,112,154)).save(root/'ABooks/cover.jpg')
          Image.new('RGB',(64,80),(80,159,93)).save(root/'AudioBookReader/Books/cover.png')
          PY
          gcc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -DAUDIOBOOK_LOCAL_ROOT='"/tmp/audiobook-usb-ci/AudioBookReader/Books"' \
            -DAUDIOBOOK_USB_ROOT='"/tmp/audiobook-usb-ci/ABooks"' \
            -DPORT=19177 -DAUDIOBOOK_USB_TEST_DROP_ONCE \
            homebrew/audiobook-reader/helper/abookscan.c -o /tmp/audiobook-usb-server
          /tmp/audiobook-usb-server > /tmp/audiobook-usb.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import socket,time
          for attempt in range(80):
              try:
                  with socket.create_connection(('127.0.0.1',19177),0.2):
                      break
              except (ConnectionRefusedError,TimeoutError,OSError):
                  time.sleep(0.1)
          else: raise AssertionError("Audiobook USB helper did not bind")
          PY
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread \
            -DAUDIOBOOK_USB_BRIDGE_PORT=19177 \
            -D'AUDIOBOOK_DATA_ROOT="/tmp/audiobook-usb-ci/AudioBookReader"' \
            -Ihomebrew/audiobook-reader/native \
            homebrew/audiobook-reader/native/usb_bridge.cpp \
            homebrew/audiobook-reader/tests/usb_transfer_test.cpp \
            -o /tmp/audiobook-usb-test
          /tmp/audiobook-usb-test /tmp/audiobook-usb-ci
      - name: Prepare PS5 scaffold and artwork
        run: |
          git clone --depth=1 https://github.com/Yahballon/PS5-DevBridge.git /tmp/devbridge
          cp -a /tmp/devbridge/templates/simple-calc ./app
          cp homebrew/audiobook-reader/native/*.cpp homebrew/audiobook-reader/native/*.hpp app/src/
          # Pinned stb decoder: same source revision used by the PS5 Ebook Reader.
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/nothings/stb/2c980bb59875b0d32144a71867fbdebb2f77cd20/stb_image.h \
            -o app/src/stb_image.h
          test -s app/src/stb_image.h
          mkdir -p app/assets/ABooks
          cp homebrew/audiobook-reader/assets/ABooks/README.txt app/assets/ABooks/README.txt
          if test -s homebrew/audiobook-reader/sce_sys/icon0.png; then
            python3 -c "from PIL import Image; Image.open('homebrew/audiobook-reader/sce_sys/icon0.png').convert('RGB').resize((512,512),Image.Resampling.LANCZOS).save('app/sce_sys/icon0.png')"
          else
            python3 homebrew/audiobook-reader/assets/generate_icon.py app/sce_sys/icon0.png
          fi
          cp app/sce_sys/icon0.png app/assets/icon0.png
          python3 - <<'PY'
          from pathlib import Path
          import json
          metadata=json.loads(Path('homebrew/audiobook-reader/app.json').read_text())
          path=Path('app/sce_sys/param.json')
          param=json.loads(path.read_text())
          param.update(titleId=metadata['titleId'], conceptId=metadata['titleId'][4:],
            contentId=metadata['contentId'], contentVersion=metadata['contentVersion'])
          param['localizedParameters']['en-US']['titleName']=metadata['name']
          path.write_text(json.dumps(param,indent=2)+'\n')
          PY
      - name: Prepare native OpenGL SDK
        working-directory: app
        env:
          PS5_CLANG: clang-18
          USE_CCACHE: '0'
          BUILD_JOBS: '4'
        run: bash tools/prepare-opengl.sh
      - name: Prepare POSIX archive
        run: |
          mkdir -p app/build/jb-json
          cp app/.deps/native/ps5-payload-sdk/target/lib/libc.a app/build/jb-json/libjb-posix.a
          llvm-objcopy-18 --redefine-sym=openlog=jb_sdk_openlog --redefine-sym=closelog=jb_sdk_closelog --redefine-sym=mkstemp=jb_sdk_mkstemp --redefine-sym=mkstemps=jb_sdk_mkstemps --redefine-sym=getpwuid_r=jb_sdk_getpwuid_r app/build/jb-json/libjb-posix.a
      - name: Build read-only ABooks ELF USB helper
        run: |
          make -C homebrew/audiobook-reader/helper PS5_PAYLOAD_SDK="$GITHUB_WORKSPACE/app/.deps/native/ps5-payload-sdk"
          cp homebrew/audiobook-reader/helper/abookscan.elf app/abookscan.elf
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/abookscan.elf')
          assert p.is_file() and p.stat().st_size>1024
          assert p.read_bytes()[:6]==b'\x7fELF\x02\x01'
          PY
      - name: Build native PS5 app
        working-directory: app
        env:
          PS5_CLANG: clang-18
          USE_CCACHE: '0'
          BUILD_JOBS: '4'
        run: make USE_CCACHE=0 BUILD_JOBS=4 PACBREW_PACKAGES='libavformat libavcodec libavutil libswresample sdl2' APP_ROOT_FILES=abookscan.elf app
      - name: Verify installation ZIP
        run: |
          python3 - <<'PY'
          import json,pathlib,struct,zipfile
          metadata=json.loads(pathlib.Path('homebrew/audiobook-reader/app.json').read_text())
          title=metadata['titleId'];root=pathlib.Path('app/dist')/title
          exe=(root/'eboot.bin').read_bytes()
          assert len(exe)>1000 and struct.unpack('<I',exe[:4])[0]==0x1D3D154F
          assert b'v0.2.4' in exe
          param=json.loads((root/'sce_sys/param.json').read_text())
          assert param['titleId']==title and param['contentVersion']==metadata['contentVersion']
          for file in ['sce_sys/icon0.png','sce_module/libc.prx','assets/icon0.png','assets/fonts/inter-semibold.huifont','assets/ABooks/README.txt','abookscan.elf']:
            assert (root/file).is_file(),file
          with zipfile.ZipFile(pathlib.Path('app/dist')/(title+'.zip')) as archive:
            assert archive.testzip() is None
            assert title+'/eboot.bin' in archive.namelist()
            assert title+'/sce_sys/icon0.png' in archive.namelist()
            assert title+'/abookscan.elf' in archive.namelist()
          print('Verified installable',title+'.zip')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Audiobook-Reader-v0.2.4
          path: app/dist/PPSA99784.zip
          if-no-files-found: error
      - name: Publish release after main branch build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view audiobook-reader-v0.2.4 >/dev/null 2>&1; then exit 0; fi
          gh release create audiobook-reader-v0.2.4 app/dist/PPSA99784.zip --target "$GITHUB_SHA" --title "Audiobook Reader v0.2.4" --notes-file homebrew/audiobook-reader/RELEASE_NOTES.md
