name: Publish Godot PS5 AudioOut TESTBUILD
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful signed M11d AudioOut PS5 build on trusted engine branch"
        required: true
  workflow_run:
    workflows: ['Godot PS5 M11d Native AudioOut Thread Fix v0.1.6 (experimental)']
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-godot-ps5-m11d-freetype
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'feature/godot-ps5-engine-foundation' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == 'Yahballon/tmp_lap')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Strictly verify successful signed native build from trusted branch
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.PS5_RELEASE_TOKEN || github.token }}
          PARENT_RUN: ${{ github.event.workflow_run.id || '0' }}
          REQUESTED_RUN: ${{ inputs.run_id || '0' }}
        run: |
          set -euo pipefail
          run="$PARENT_RUN"
          if [ "$run" = 0 ]; then run="$REQUESTED_RUN"; fi
          [[ "$run" =~ ^[0-9]+$ ]] || exit 2
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > /tmp/m11d-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" > /tmp/m11d-artifacts.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.load(open('/tmp/m11d-run.json'))
          assert r['repository']['full_name']=='Yahballon/tmp_lap'
          assert r['head_repository']['full_name']=='Yahballon/tmp_lap'
          assert r['head_branch']=='feature/godot-ps5-engine-foundation'
          assert r['name']=='Godot PS5 M11d Native AudioOut Thread Fix v0.1.6 (experimental)'
          assert r['event']=='push'
          assert r['status']=='completed' and r['conclusion']=='success'
          matches=[a for a in json.load(open('/tmp/m11d-artifacts.json'))['artifacts']
            if a['name']=='Godot-PS5-M11d-NATIVE-AUDIOOUT-v0.1.6-PS5-HARDWARE-UNTESTED'
            and not a['expired'] and a.get('workflow_run',{}).get('head_sha')==r['head_sha']]
          assert len(matches)==1, f'M11d signed AudioOut artifact missing: {matches}'
          Path('/tmp/m11d-build-sha').write_text(r['head_sha'])
          print('GODOT_PS5_M10C_SIGNED_RELEASE_SOURCE_VERIFIED',r['id'],r['head_sha'])
          PY
          mkdir -p /tmp/m11d-release
          gh run download "$run" --repo "$GITHUB_REPOSITORY" \
            --name Godot-PS5-M11d-NATIVE-AUDIOOUT-v0.1.6-PS5-HARDWARE-UNTESTED \
            --dir /tmp/m11d-release
          test -s /tmp/m11d-release/PPSA99847.zip
      - name: Independently validate installable PS5 signed AudioOut title
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,struct,zipfile
          p=Path('/tmp/m11d-release/PPSA99847.zip')
          assert p.stat().st_size>1_000_000
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert all(n.startswith('PPSA99847/') and '..' not in Path(n).parts for n in names)
              for name in ('eboot.bin','assets/godot/visual-smoke.pck',
                    'assets/godot/physics-smoke.pck','assets/godot/m10b-font-ui.pck'):
                  assert 'PPSA99847/'+name in names
              data=z.read('PPSA99847/eboot.bin')
              assert len(data)>5_000_000 and data[:4]==struct.pack('<I',0x1d3d154f)
              meta=json.loads(z.read('PPSA99847/sce_sys/param.json'))
              assert meta['titleId']=='PPSA99847'
              assert meta['contentId']=='UP9000-PPSA99847_00-GODOTGLES3CANVAS'
              assert meta['contentVersion']=='01.000.007'
          print('GODOT_PS5_M10C_SIGNED_ZIP_OK',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Publish v0.1.6 experimental TESTBUILD release
        env:
          GH_TOKEN: ${{ secrets.PS5_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          tag=godot-ps5-gles3-canvas-v0.1.6
          cat > /tmp/m11d-notes.md <<'NOTES'
          EXPERIMENTAL Godot PS5 GLES3 Canvas v0.1.6 – fixes AudioOut worker thread startup.
          PS5 test logs from v0.1.5 prove sceAudioOutInit rc=0 and sceAudioOutOpen handle=536870912, but driver erroneously fell back to dummy because it compared Godot 4.7.2 Thread::ID (successful nonzero) to Error OK=0, closing a live AudioOut handle. AudioOutOutput error logs were also broken by unsupported %llu formatting.
          v0.1.6 fixes Thread::start usage using thread.is_started(), keeps the AudioOut handle alive, and logs native output return codes correctly.
          AUDIO IS NOT YET CONFIRMED AUDIBLE ON HARDWARE. An actual PS5 listening test is REQUIRED, even after green GitHub CI.
          Preserve previously tested v0.1.4 as stable rollback (GLES3, Physics2D, FreeType, game save support).
          Keep /data/GodotPS5/games/m11-audio.pck and set /data/GodotPS5/launch.txt to m11-audio.pck.
          Listen for six tones, press X to replay, then export gles3-stdout.log, gles3-stderr.log and gles3-runtime.log.
          Required diagnostics: M11D_AUDIOOUT_THREAD_STARTED, M11C_AUDIOOUT_READY, M11D_AUDIOOUT_OUTPUT_OK, and no dummy driver warning. Only audible sound proves hardware success.
          Original Godot 4.7.2, opt-in libSceAudioOut via SDK import stub (no proprietary system module redistributed).
          Source: https://github.com/Yahballon/tmp_lap/tree/feature/godot-ps5-engine-foundation/homebrew/godot-ps5

          NOTES
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx PPSA99847.zip
          else
            gh release create "$tag" /tmp/m11d-release/PPSA99847.zip \
              --repo "$GITHUB_REPOSITORY" --target feature/godot-ps5-engine-foundation \
              --title 'Godot PS5 GLES3 Canvas v0.1.6 – Native AudioOut (experimental)' \
              --notes-file /tmp/m11d-notes.md --prerelease
          fi
      - name: Update TESTBUILDS version.json with verified release
        env:
          GH_TOKEN: ${{ secrets.PS5_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          python3 tools/test-version-catalog.py
          python3 tools/test-catalog-triggers.py
          python3 tools/update-version.py
          python3 -m json.tool version.json >/dev/null
          python3 - <<'PY'
          import json
          j=json.load(open('version.json'))
          matches=[x for x in j['apps'] if x['title_id']=='PPSA99847']
          assert len(matches)==1
          app=matches[0]
          assert app['version']=='0.1.6'
          assert app['tag']=='godot-ps5-gles3-canvas-v0.1.6'
          assert app['zip_url'].endswith('/PPSA99847.zip')
          assert j['app_count']==len(j['apps'])
          print('GODOT_PS5_M10C_TESTBUILD_CATALOG_OK')
          PY
          if [ -n "$(git status --porcelain -- version.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add version.json
            git commit -m 'chore(testbuilds): publish Godot GLES3 AudioOut v0.1.6 [skip ci]'
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              git push origin HEAD:main && exit 0
              sleep 3
            done
            exit 1
          fi
