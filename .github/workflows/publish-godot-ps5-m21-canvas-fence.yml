name: Publish Godot PS5 M21 Canvas Fence Trial TESTBUILD
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful signed M13 native frame profiler build from trusted feature branch"
        required: true
  workflow_run:
    workflows: ['Godot PS5 M21 Nonblocking Canvas Fence Trial v0.2.5']
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-godot-ps5-m21-canvas-fence
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'perf/godot-ps5-m21-nonblocking-canvas-fence' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == 'Yahballon/tmp_lap')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Strictly verify successful signed native build from trusted branch
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.PS5_RELEASE_TOKEN || github.token }}
          PARENT_RUN: ${{ github.event.workflow_run.id || '0' }}
          REQUESTED_RUN: ${{ inputs.run_id || '0' }}
        run: |
          set -euo pipefail
          run="$PARENT_RUN"
          if [ "$run" = 0 ]; then run="$REQUESTED_RUN"; fi
          [[ "$run" =~ ^[0-9]+$ ]] || exit 2
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > /tmp/m21-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" > /tmp/m21-artifacts.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.load(open('/tmp/m21-run.json'))
          assert r['repository']['full_name']=='Yahballon/tmp_lap'
          assert r['head_repository']['full_name']=='Yahballon/tmp_lap'
          assert r['head_branch']=='perf/godot-ps5-m21-nonblocking-canvas-fence'
          assert r['name']=='Godot PS5 M21 Nonblocking Canvas Fence Trial v0.2.5'
          assert r['event']=='push'
          assert r['status']=='completed' and r['conclusion']=='success'
          matches=[a for a in json.load(open('/tmp/m21-artifacts.json'))['artifacts']
            if a['name']=='Godot-PS5-M21-CANVAS-FENCE-v0.2.5-PS5-HARDWARE-UNTESTED'
            and not a['expired'] and a.get('workflow_run',{}).get('head_sha')==r['head_sha']]
          assert len(matches)==1, f'M13 signed native profiler artifact missing: {matches}'
          Path('/tmp/m21-build-sha').write_text(r['head_sha'])
          print('GODOT_PS5_M21_SIGNED_RELEASE_SOURCE_VERIFIED',r['id'],r['head_sha'])
          PY
          mkdir -p /tmp/m21-release
          gh run download "$run" --repo "$GITHUB_REPOSITORY" \
            --name Godot-PS5-M21-CANVAS-FENCE-v0.2.5-PS5-HARDWARE-UNTESTED \
            --dir /tmp/m21-release
          test -s /tmp/m21-release/PPSA99847.zip
      - name: Independently validate installable PS5 signed AudioOut title
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,struct,zipfile
          p=Path('/tmp/m21-release/PPSA99847.zip')
          assert p.stat().st_size>1_000_000
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert all(n.startswith('PPSA99847/') and '..' not in Path(n).parts for n in names)
              for name in ('eboot.bin','assets/godot/visual-smoke.pck',
                    'assets/godot/physics-smoke.pck','assets/godot/m10b-font-ui.pck'):
                  assert 'PPSA99847/'+name in names
              data=z.read('PPSA99847/eboot.bin')
              assert len(data)>5_000_000 and data[:4]==struct.pack('<I',0x1d3d154f)
              meta=json.loads(z.read('PPSA99847/sce_sys/param.json'))
              assert meta['titleId']=='PPSA99847'
              assert meta['contentId']=='UP9000-PPSA99847_00-GODOTGLES3CANVAS'
              assert meta['contentVersion']=='01.000.016'
          print('GODOT_PS5_M21_SIGNED_ZIP_OK',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Publish v0.2.5 PS5 native frame-profiler TESTBUILD (experimental)
        env:
          GH_TOKEN: ${{ secrets.PS5_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          tag=godot-ps5-gles3-canvas-v0.2.5
          cat > /tmp/m21-notes.md <<'NOTES'
          Experimental Godot PS5 GLES3 v0.2.5 (M21) – Nonblocking canvas GPU fence status.

          Hardware TAR #40 confirms v0.2.4 M20 and 1080p bundled Pong actually running. Removing GPU timestamp readbacks did not solve the stutter; main thread render wall time peaked at 48 seconds, while CPU time was under 25ms per frame. Original draw calls stay fast, final EGL swap ~0.1ms.

          Found a different previously-unmeasured Godot 4.7.2 call in RasterizerCanvasGLES3::canvas_render_items: glGetSynciv(...,GL_SYNC_STATUS), executed once when reusing the 2D instance buffer ring. This may be a blocking query in the experimental PS5 OpenGL/Mesa driver. M21 PS5-native GLES3-only overlay replaces that status query with glClientWaitSync(fence,0,0), a timeout-zero, nonblocking poll. The status mapping preserves GL_UNSIGNALED until the GPU actually reports GL_ALREADY_SIGNALED or GL_CONDITION_SATISFIED. On GL_WAIT_FAILED it retains the original status query fallback. Existing canvas data buffer lifetime paths and original GL drawing remain.

          M19 now counts/times glClientWaitSync calls, allowing attribution if even the zero-timeout driver implementation blocks. M13–M20 profiling, VSync=1, native AudioOut, PCK files, GDScript, physics and controls all remain.
          THIS IS AN UNVERIFIED HARDWARE PERFORMANCE HYPOTHESIS, not a confirmed game fix. Test bundled Pong for at least 60 sec and then the original m12d-platformer-asset2201.pck if smooth. Older v0.2.4 remains available as rollback.
          Source: https://github.com/Yahballon/tmp_lap/tree/perf/godot-ps5-m21-nonblocking-canvas-fence/homebrew/godot-ps5

          NOTES
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx PPSA99847.zip
          else
            gh release create "$tag" /tmp/m21-release/PPSA99847.zip \
              --repo "$GITHUB_REPOSITORY" --target perf/godot-ps5-m21-nonblocking-canvas-fence \
              --title 'Godot PS5 GLES3 Canvas v0.2.5 – Nonblocking Canvas Fence Trial' \
              --notes-file /tmp/m21-notes.md --prerelease
          fi
      - name: Update TESTBUILDS version.json with verified release
        env:
          GH_TOKEN: ${{ secrets.PS5_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          python3 tools/test-version-catalog.py
          python3 tools/test-catalog-triggers.py
          python3 tools/update-version.py
          python3 -m json.tool version.json >/dev/null
          python3 - <<'PY'
          import json
          j=json.load(open('version.json'))
          matches=[x for x in j['apps'] if x['title_id']=='PPSA99847']
          assert len(matches)==1
          app=matches[0]
          assert app['version']=='0.2.5'
          assert app['tag']=='godot-ps5-gles3-canvas-v0.2.5'
          assert app['zip_url'].endswith('/PPSA99847.zip')
          assert j['app_count']==len(j['apps'])
          print('GODOT_PS5_M21_TESTBUILD_CATALOG_OK')
          PY
          if [ -n "$(git status --porcelain -- version.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add version.json
            git commit -m 'chore(testbuilds): publish Godot PS5 M20 GPU timestamp bypass v0.2.5 [skip ci]'
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              git push origin HEAD:main && exit 0
              sleep 3
            done
            exit 1
          fi
