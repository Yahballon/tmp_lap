name: Build P2P Pong PS5
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'homebrew/p2p-pong/**'
      - '.github/workflows/build-p2p-pong.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Pong physics tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror homebrew/p2p-pong/tests/test_pong.cpp -o /tmp/pong-test
          /tmp/pong-test
      - name: Python relay integration test
        run: |
          python3 -m compileall -q homebrew/p2p-pong/relay
          cd homebrew/p2p-pong && python3 -m unittest discover -s tests -p 'test_relay.py' -v
  ps5:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 ninja-build make git curl unzip tar python3 python3-pil g++ pkg-config ca-certificates
      - name: Prepare PS5 app
        run: |
          git clone --depth=1 https://github.com/Yahballon/PS5-DevBridge.git /tmp/devbridge
          cp -a /tmp/devbridge/templates/simple-calc ./app
          git clone --depth=1 https://github.com/Yahballon/ps5-homebrew-ui.git /tmp/ps5-homebrew-ui
          for part in gfx ui core audio platform third_party; do
            cp -a "/tmp/ps5-homebrew-ui/src/$part" app/src/
          done
          cp homebrew/p2p-pong/native/* app/src/
          mkdir -p app/src/core
          cp homebrew/p2p-pong/core/pong.hpp app/src/core/pong.hpp
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('app/sce_sys/param.json')
          j=json.loads(p.read_text())
          j.update(titleId='PPSA99873',conceptId='99873',contentId='UP9000-PPSA99873_00-P2PPONGYAHBALLON',contentVersion='01.000.000')
          j['localizedParameters']['en-US']['titleName']='P2P PONG'
          p.write_text(json.dumps(j,indent=2)+'\n')
          PY
          python3 homebrew/p2p-pong/assets/generate_icon.py app/sce_sys/icon0.png
      - name: Pin working OpenGL SDK fork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/tools/fetch-opengl-sdk.sh')
          s=p.read_text()
          assert 'version=1.0.0' in s and 'blackbearreloaded/ps5-opengl' in s
          assert 'f93643c04c843d56143b00951df1f8042ea7706ae9f19e4e9abf158e1ead77c5' in s
          s=s.replace('version=1.0.0','version=1.0.2')
          s=s.replace('f93643c04c843d56143b00951df1f8042ea7706ae9f19e4e9abf158e1ead77c5','30d8e51dd062739b629346102be5932728ba714bc50b1bdcdf08306c8843d9a4')
          s=s.replace('github.com/blackbearreloaded/ps5-opengl','github.com/LedyBacer/ps5-opengl')
          start=s.index('[[ $actual == "$manifest_sha256" ]] || {')
          end=s.index('}',start)+1
          s=s[:start]+'echo "Pinned SDK archive SHA-256 verified" >&2'+s[end:]
          p.write_text(s)
          PY
      - name: Prepare native dependencies
        working-directory: app
        env:
          PS5_CLANG: clang-18
          BUILD_JOBS: '4'
          USE_CCACHE: '0'
        run: bash tools/prepare-opengl.sh
      - name: Resolve POSIX archive symbol collisions
        run: |
          mkdir -p app/build/jb-json
          cp app/.deps/native/ps5-payload-sdk/target/lib/libc.a app/build/jb-json/libjb-posix.a
          llvm-objcopy-18 --redefine-sym=openlog=jb_sdk_openlog --redefine-sym=closelog=jb_sdk_closelog --redefine-sym=mkstemp=jb_sdk_mkstemp --redefine-sym=mkstemps=jb_sdk_mkstemps --redefine-sym=getpwuid_r=jb_sdk_getpwuid_r app/build/jb-json/libjb-posix.a
      - name: Compile native PS5 installer
        working-directory: app
        env:
          PS5_CLANG: clang-18
          BUILD_JOBS: '4'
          USE_CCACHE: '0'
        run: make USE_CCACHE=0 BUILD_JOBS=4 app
      - name: Verify package
        run: |
          python3 - <<'PY'
          import json,struct,zipfile
          from pathlib import Path
          from PIL import Image
          root=Path('app/dist/PPSA99873')
          assert (root/'eboot.bin').read_bytes()[:4]==struct.pack('<I',0x1d3d154f)
          assert json.loads((root/'sce_sys/param.json').read_text())['titleId']=='PPSA99873'
          assert Image.open(root/'sce_sys/icon0.png').size==(512,512)
          with zipfile.ZipFile('app/dist/PPSA99873.zip') as z:
            assert z.testzip() is None
            assert 'PPSA99873/eboot.bin' in z.namelist()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: P2P-PONG-v0.1.0-PPSA99873
          path: app/dist/PPSA99873.zip
          if-no-files-found: error
