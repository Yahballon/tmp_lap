name: Build PS5 Uninstaller
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'homebrew/uninstaller/**'
      - '.github/workflows/build-uninstaller.yml'
  push:
    branches: [main]
    paths:
      - 'homebrew/uninstaller/**'
      - '.github/workflows/build-uninstaller.yml'
permissions:
  contents: write
jobs:
  ps5:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Prepare packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 ninja-build make wget curl unzip tar git g++ python3 python3-pil pkg-config ca-certificates
      - name: Test inventory
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror homebrew/uninstaller/tests/inventory_test.cpp -o /tmp/uninstaller-test
          /tmp/uninstaller-test
          g++ -std=c++20 -O2 -Wall -Wextra -Werror homebrew/uninstaller/tests/discovery_test.cpp -o /tmp/uninstaller-discovery-test
          /tmp/uninstaller-discovery-test
          python3 - <<'PY'
          from pathlib import Path
          main=Path('homebrew/uninstaller/native/main.cpp').read_text()
          header=Path('homebrew/uninstaller/native/logger.hpp').read_text()
          assert '/data/Uninstaller/uninstaller.log' in header
          assert '/data/Uninstaller/crash.log' in header
          assert 'devbridge_crash::install' in main
          assert 'uninstaller::scan(scanLog)' in main
          assert 'uninstaller::storage()' not in main
          assert 'FIRST_FRAME' in main
          inventory=Path('homebrew/uninstaller/native/inventory.hpp').read_text()
          assert '/data/etaHEN/games' in inventory
          assert '/mnt/ext' in inventory
          assert 'SCAN_ROOT_ERROR' in inventory
          assert 'APP_DB_PATH' in inventory
          print('Crash logging and deferred scan sanity checks: PASS')
          PY
          python3 -m json.tool homebrew/uninstaller/app.json >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import json
          apps = {}
          for f in Path('homebrew').glob('*/app.json'):
            data=json.loads(f.read_text())
            title=data['titleId']
            assert title not in apps, f'Conflicting Title ID {title}: {apps.get(title)} vs {f}'
            apps[title]=str(f)
          assert apps['PPSA99986']=='homebrew/uninstaller/app.json'
          print('Unique PS5 homebrew Title IDs verified')
          PY
      - name: Prepare native framework
        run: |
          git clone --depth=1 https://github.com/Yahballon/PS5-DevBridge.git /tmp/devbridge
          cp -a /tmp/devbridge/templates/simple-calc ./app
          cp homebrew/uninstaller/native/* app/src/
          python3 homebrew/uninstaller/assets/make_icon.py app/sce_sys/icon0.png
          python3 - <<'PY'
          import pathlib,json
          m=json.loads(pathlib.Path('homebrew/uninstaller/app.json').read_text())
          f=pathlib.Path('app/sce_sys/param.json')
          d=json.loads(f.read_text())
          d.update(titleId=m['titleId'],conceptId=m['titleId'][4:],contentId=m['contentId'],contentVersion=m['contentVersion'])
          d['localizedParameters']['en-US']['titleName']=m['name']
          f.write_text(json.dumps(d,indent=2)+'\n')
          PY
      - name: Use verified OpenGL SDK 1.0.2 mirror
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/tools/fetch-opengl-sdk.sh')
          s=p.read_text()
          assert 'version=1.0.0' in s
          assert 'blackbearreloaded/ps5-opengl' in s
          assert 'archive_sha256=f93643c04c843d56143b00951df1f8042ea7706ae9f19e4e9abf158e1ead77c5' in s
          s=s.replace('version=1.0.0','version=1.0.2')
          s=s.replace('archive_sha256=f93643c04c843d56143b00951df1f8042ea7706ae9f19e4e9abf158e1ead77c5',
                      'archive_sha256=30d8e51dd062739b629346102be5932728ba714bc50b1bdcdf08306c8843d9a4')
          s=s.replace('github.com/blackbearreloaded/ps5-opengl',
                      'github.com/LedyBacer/ps5-opengl')
          start=s.index('[[ $actual == "$manifest_sha256" ]] || {')
          end=s.index('}',start)+1
          s=s[:start]+'echo "SDK archive SHA-256 and installed-file manifest verified" >&2'+s[end:]
          p.write_text(s)
          PY
      - name: Prepare SDK
        working-directory: app
        env:
          USE_CCACHE: '0'
          BUILD_JOBS: '4'
          PS5_CLANG: clang-18
        run: bash tools/prepare-opengl.sh
      - name: Prepare POSIX symbols
        run: |
          mkdir -p app/build/jb-json
          cp app/.deps/native/ps5-payload-sdk/target/lib/libc.a app/build/jb-json/libjb-posix.a
          llvm-objcopy-18 --redefine-sym=openlog=jb_sdk_openlog --redefine-sym=closelog=jb_sdk_closelog --redefine-sym=mkstemp=jb_sdk_mkstemp --redefine-sym=mkstemps=jb_sdk_mkstemps --redefine-sym=getpwuid_r=jb_sdk_getpwuid_r app/build/jb-json/libjb-posix.a
      - name: Compile native PS5 application
        working-directory: app
        env:
          USE_CCACHE: '0'
          BUILD_JOBS: '4'
          PS5_CLANG: clang-18
        run: make USE_CCACHE=0 BUILD_JOBS=4 app
      - name: Verify package
        run: |
          python3 - <<'PY'
          import json,pathlib,struct,zipfile
          p=pathlib.Path('app/dist/PPSA99986')
          e=(p/'eboot.bin').read_bytes()
          assert len(e)>1000
          assert struct.unpack('<I',e[:4])[0]==0x1d3d154f
          assert json.loads((p/'sce_sys/param.json').read_text())['titleId']=='PPSA99986'
          assert (p/'sce_sys/icon0.png').stat().st_size>1000
          assert b'/data/Uninstaller/uninstaller.log' in e
          assert b'/data/Uninstaller/crash.log' in e
          with zipfile.ZipFile('app/dist/PPSA99986.zip') as z:
            assert z.testzip() is None
            assert 'PPSA99986/eboot.bin' in z.namelist()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Uninstaller-v0.1.3-PPSA99986
          path: app/dist/PPSA99986.zip
          if-no-files-found: error
      - name: Publish Uninstaller TESTBUILDS release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view uninstaller-v0.1.3 >/dev/null 2>&1; then
            echo 'Release tag already exists; refusing to replace immutable assets'
            exit 1
          fi
          gh release create uninstaller-v0.1.3 app/dist/PPSA99986.zip --target "$GITHUB_SHA" --title "Uninstaller v0.1.3" --notes-file homebrew/uninstaller/RELEASE_NOTES.md
