name: Build External Godot PS5 PCK (host acceptance)
on:
  workflow_dispatch:
  pull_request:
    branches: [main, feature/godot-ps5-engine-foundation]
  push:
    branches: [feature/godot-ps5-engine-foundation]
    paths:
      - 'homebrew/godot-ps5/samples/external-pack-smoke/**'
      - 'homebrew/godot-ps5/tests/test_external_pck_bundle.py'
      - '.github/workflows/build-godot-ps5-external-pck.yml'
permissions:
  contents: read
jobs:
  external-pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check PS5 ZIP packager (host mocks, not a Godot runtime test)
        run: python3 homebrew/godot-ps5/tests/test_external_pck_bundle.py
      - name: Download official Godot 4.7.2 binary
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot-linux.zip
          unzip -q /tmp/godot-linux.zip -d /tmp/
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Build and validate independent game PCK
        run: |
          set -euo pipefail
          godot=/tmp/Godot_v4.7.2-stable_linux.x86_64
          project=homebrew/godot-ps5/samples/external-pack-smoke
          "$godot" --headless --path "$project" --script res://make_pack.gd 2>&1 | tee /tmp/external-pack.log
          grep -Fq GODOT_PS5_EXTERNAL_PCK_WRITTEN /tmp/external-pack.log
          test -s "$project/external-smoke.pck"
          # --quit-after is a safety net; verify the second scene completed.
          "$godot" --headless --main-pack "$project/external-smoke.pck" --quit-after 500 2>&1 | tee /tmp/external-scene.log
          for marker in GODOT_PS5_EXTERNAL_MAIN_READY GODOT_PS5_EXTERNAL_ASSET_OK GODOT_PS5_EXTERNAL_SCENE_CHANGE_REQUESTED GODOT_PS5_EXTERNAL_SECOND_SCENE_READY GODOT_PS5_EXTERNAL_FINISHED; do
            grep -Fq "$marker" /tmp/external-scene.log
          done
          if grep -iE 'SCRIPT ERROR|Parse Error|Failed to load script|GODOT_PS5_EXTERNAL_.*FAILED' /tmp/external-scene.log; then exit 1; fi
      - name: Create checksummed PS5-ready starter ZIP
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot-m8c-artifacts
          pck=homebrew/godot-ps5/samples/external-pack-smoke/external-smoke.pck
          python3 homebrew/godot-ps5/samples/external-pack-smoke/make_ps5_test_bundle.py \
            "$pck" /tmp/godot-m8c-artifacts | tee /tmp/external-bundle.log
          grep -Fq GODOT_PS5_EXTERNAL_BUNDLE_READY /tmp/external-bundle.log
          cp "$pck" /tmp/godot-m8c-artifacts/external-smoke.pck
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          p=Path("/tmp/godot-m8c-artifacts/GodotPS5-M8c-External-PCK-PS5-TEST.zip")
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert set(z.namelist()) == {
                  "GodotPS5/games/external-smoke.pck",
                  "GodotPS5/launch.txt",
                  "GodotPS5/README-M8c.txt",
                  "GodotPS5/external-smoke.sha256"}
          print("GODOT_PS5_EXTERNAL_BUNDLE_STRUCTURE_OK")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Godot-PS5-M8c-External-PCK-PS5-READY-HOST-TESTED
          path: /tmp/godot-m8c-artifacts/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Godot-PS5-External-PCK-Host-Logs
          path: |
            /tmp/external-pack.log
            /tmp/external-scene.log
            /tmp/external-bundle.log
          if-no-files-found: warn
