name: Build FITBREW PS5
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'homebrew/fitbrew/native/**'
      - 'homebrew/fitbrew/assets/**'
      - 'homebrew/fitbrew/tests/**'
      - 'homebrew/fitbrew/app.json'
      - '.github/workflows/build-fitbrew.yml'
  push:
    branches: [main]
    paths: ['homebrew/fitbrew/**', '.github/workflows/build-fitbrew.yml']
permissions:
  contents: write
jobs:
  ps5:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 ninja-build make git curl unzip tar python3 python3-pil g++ pkg-config ca-certificates
      - name: Import original FITBREW AI photo sources
        run: python3 homebrew/fitbrew/assets/import_ai_photos.py
      - name: Exercise validation, workout engine and metadata
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic homebrew/fitbrew/tests/workout_test.cpp -o /tmp/fitbrew-test
          /tmp/fitbrew-test
          python3 homebrew/fitbrew/tests/art_test.py
          python3 -m json.tool homebrew/fitbrew/app.json >/dev/null
      - name: Stage native app and original real-photo artwork
        run: |
          git clone --depth=1 https://github.com/Yahballon/PS5-DevBridge.git /tmp/devbridge
          cp -a /tmp/devbridge/templates/simple-calc ./app
          git clone --depth=1 https://github.com/Yahballon/ps5-homebrew-ui.git /tmp/ps5-homebrew-ui
          for part in gfx ui core audio platform third_party; do
            cp -a "/tmp/ps5-homebrew-ui/src/$part" app/src/
          done
          cp homebrew/fitbrew/native/main.cpp homebrew/fitbrew/native/workout.hpp app/src/
          python3 homebrew/fitbrew/assets/generate_assets.py app
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for i in range(12):
            p=Path(f'app/assets/pose_{i}.rgba')
            assert p.stat().st_size==512*512*4, p
            with Image.open(f'app/assets/pose_{i}.jpg') as jpg:
              assert jpg.size==(512,512)
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('homebrew/fitbrew/app.json').read_text())
          p=Path('app/sce_sys/param.json');meta=json.loads(p.read_text())
          meta.update(titleId=data['titleId'],conceptId=data['titleId'][4:],contentId=data['contentId'],contentVersion=data['contentVersion'])
          meta['localizedParameters']['en-US']['titleName']='FITBREW'
          p.write_text(json.dumps(meta,indent=2)+'\n')
          PY
      - name: Select tested PS5 OpenGL SDK fork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/tools/fetch-opengl-sdk.sh')
          s=p.read_text()
          assert 'version=1.0.0' in s
          assert 'blackbearreloaded/ps5-opengl' in s
          assert 'archive_sha256=f93643c04c843d56143b00951df1f8042ea7706ae9f19e4e9abf158e1ead77c5' in s
          s=s.replace('version=1.0.0','version=1.0.2')
          s=s.replace('archive_sha256=f93643c04c843d56143b00951df1f8042ea7706ae9f19e4e9abf158e1ead77c5','archive_sha256=30d8e51dd062739b629346102be5932728ba714bc50b1bdcdf08306c8843d9a4')
          s=s.replace('github.com/blackbearreloaded/ps5-opengl','github.com/LedyBacer/ps5-opengl')
          start=s.index('[[ $actual == "$manifest_sha256" ]] || {');end=s.index('}',start)+1
          s=s[:start]+'echo "Pinned SDK archive SHA-256 verified" >&2'+s[end:]
          p.write_text(s)
          PY
      - name: Fetch and compile native OpenGL dependencies
        working-directory: app
        env:
          PS5_CLANG: clang-18
          BUILD_JOBS: '4'
          USE_CCACHE: '0'
        run: bash tools/prepare-opengl.sh
      - name: Rename native POSIX collisions
        run: |
          mkdir -p app/build/jb-json
          cp app/.deps/native/ps5-payload-sdk/target/lib/libc.a app/build/jb-json/libjb-posix.a
          llvm-objcopy-18 --redefine-sym=openlog=jb_sdk_openlog --redefine-sym=closelog=jb_sdk_closelog --redefine-sym=mkstemp=jb_sdk_mkstemp --redefine-sym=mkstemps=jb_sdk_mkstemps --redefine-sym=getpwuid_r=jb_sdk_getpwuid_r app/build/jb-json/libjb-posix.a
      - name: Compile and package FITBREW
        working-directory: app
        env:
          PS5_CLANG: clang-18
          BUILD_JOBS: '4'
          USE_CCACHE: '0'
        run: make USE_CCACHE=0 BUILD_JOBS=4 app
      - name: Verify real installable binary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json,struct,zipfile
          root=Path('app/dist/PPSA99790')
          exe=(root/'eboot.bin').read_bytes()
          assert len(exe)>1000 and exe[:4]==struct.pack('<I',0x1d3d154f)
          assert json.loads((root/'sce_sys/param.json').read_text())['titleId']=='PPSA99790'
          assert Image.open(root/'sce_sys/icon0.png').size==(512,512)
          assets=['eboot.bin','sce_sys/icon0.png','sce_sys/param.json','sce_module/libc.prx','assets/fonts/inter-semibold.huifont']+[f'assets/pose_{i}.{ext}' for i in range(12) for ext in ('jpg','rgba')]
          for a in assets: assert (root/a).is_file(),a
          for i in range(12): assert (root/f'assets/pose_{i}.rgba').stat().st_size==512*512*4
          with zipfile.ZipFile('app/dist/PPSA99790.zip') as z:
            assert z.testzip() is None
            for a in assets: assert 'PPSA99790/'+a in z.namelist(),a
          print('PASS FITBREW installer verification')
          PY
      # Check in the original generated images once. Subsequent releases then
      # build from genuine GitHub source assets even after temporary import URLs
      # expire. GITHUB_TOKEN pushes do not recursively start Actions workflows.
      - name: Persist all 12 AI images in GitHub source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add homebrew/fitbrew/assets/pose_*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "assets(fitbrew): vendor 12 original AI workout images [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: FITBREW-v0.1.3-PPSA99790
          path: app/dist/PPSA99790.zip
          if-no-files-found: error
      - name: Publish TESTBUILDS-compatible FITBREW release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view fitbrew-v0.1.3 >/dev/null 2>&1; then
            # Rebuilding an unchanged source tree is allowed; replacing a released
            # binary from changed source under the same version is NOT allowed.
            git fetch --depth=1 origin refs/tags/fitbrew-v0.1.3
            release_sha=$(git rev-list -n 1 FETCH_HEAD)
            if ! git diff --quiet "$release_sha" "$GITHUB_SHA" -- homebrew/fitbrew/native homebrew/fitbrew/assets homebrew/fitbrew/app.json; then
              echo 'FITBREW source changed: bump version/tag before publishing.'
              exit 1
            fi
            echo 'Existing immutable FITBREW release matches this source; skipping republish.'
            exit 0
          fi
          gh release create fitbrew-v0.1.3 app/dist/PPSA99790.zip --target "$(git rev-parse HEAD)" --title 'FITBREW by YAHBALLON v0.1.3' --notes-file homebrew/fitbrew/RELEASE_NOTES.md
