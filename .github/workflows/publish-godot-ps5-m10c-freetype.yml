name: Publish Godot PS5 FreeType TESTBUILD
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful signed M10c FreeType PS5 build on trusted engine branch"
        required: true
  workflow_run:
    workflows: ['Godot PS5 M10c Native FreeType/Label v0.1.4 (experimental)']
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-godot-ps5-m10c-freetype
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'feature/godot-ps5-engine-foundation' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == 'Yahballon/tmp_lap')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Strictly verify successful signed native build from trusted branch
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.PS5_RELEASE_TOKEN || github.token }}
          PARENT_RUN: ${{ github.event.workflow_run.id || '0' }}
          REQUESTED_RUN: ${{ inputs.run_id || '0' }}
        run: |
          set -euo pipefail
          run="$PARENT_RUN"
          if [ "$run" = 0 ]; then run="$REQUESTED_RUN"; fi
          [[ "$run" =~ ^[0-9]+$ ]] || exit 2
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > /tmp/m10c-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" > /tmp/m10c-artifacts.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.load(open('/tmp/m10c-run.json'))
          assert r['repository']['full_name']=='Yahballon/tmp_lap'
          assert r['head_repository']['full_name']=='Yahballon/tmp_lap'
          assert r['head_branch']=='feature/godot-ps5-engine-foundation'
          assert r['name']=='Godot PS5 M10c Native FreeType/Label v0.1.4 (experimental)'
          assert r['event']=='push'
          assert r['status']=='completed' and r['conclusion']=='success'
          matches=[a for a in json.load(open('/tmp/m10c-artifacts.json'))['artifacts']
            if a['name']=='Godot-PS5-M10c-NATIVE-FREETYPE-v0.1.4-PS5-HARDWARE-UNTESTED'
            and not a['expired'] and a.get('workflow_run',{}).get('head_sha')==r['head_sha']]
          assert len(matches)==1, f'M10c signed FreeType artifact missing: {matches}'
          Path('/tmp/m10c-build-sha').write_text(r['head_sha'])
          print('GODOT_PS5_M10C_SIGNED_RELEASE_SOURCE_VERIFIED',r['id'],r['head_sha'])
          PY
          mkdir -p /tmp/m10c-release
          gh run download "$run" --repo "$GITHUB_REPOSITORY" \
            --name Godot-PS5-M10c-NATIVE-FREETYPE-v0.1.4-PS5-HARDWARE-UNTESTED \
            --dir /tmp/m10c-release
          test -s /tmp/m10c-release/PPSA99847.zip
      - name: Independently validate installable PS5 signed FreeType title
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,struct,zipfile
          p=Path('/tmp/m10c-release/PPSA99847.zip')
          assert p.stat().st_size>1_000_000
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert all(n.startswith('PPSA99847/') and '..' not in Path(n).parts for n in names)
              for name in ('eboot.bin','assets/godot/visual-smoke.pck',
                    'assets/godot/physics-smoke.pck','assets/godot/m10b-font-ui.pck'):
                  assert 'PPSA99847/'+name in names
              data=z.read('PPSA99847/eboot.bin')
              assert len(data)>5_000_000 and data[:4]==struct.pack('<I',0x1d3d154f)
              meta=json.loads(z.read('PPSA99847/sce_sys/param.json'))
              assert meta['titleId']=='PPSA99847'
              assert meta['contentId']=='UP9000-PPSA99847_00-GODOTGLES3CANVAS'
              assert meta['contentVersion']=='01.000.005'
          print('GODOT_PS5_M10C_SIGNED_ZIP_OK',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Publish v0.1.4 experimental TESTBUILD release
        env:
          GH_TOKEN: ${{ secrets.PS5_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          tag=godot-ps5-gles3-canvas-v0.1.4
          cat > /tmp/m10c-notes.md <<'NOTES'
          EXPERIMENTAL Godot PS5 GLES3 Canvas2D v0.1.4 – original FreeType and TextServerFallback.
          Title ID PPSA99847. Native Godot 4.7.2 engine, signed PS5 build.
          Repairs M10b Font/Label test on v0.1.3 failing with "engine is compiled without FreeType support" (GODOT_RETURN=93).
          Native font fix is COMPILED and HOST VERIFIED; real PS5 font/Unicode rendering NOT YET CONFIRMED.
          Known-good PS5 PhysicsServer2D and TileMapLayer tested on v0.1.3. Pong remains the bundled default.
          To retest: keep /data/GodotPS5/games/m10b-font-ui.pck and set /data/GodotPS5/launch.txt to m10b-font-ui.pck.
          Expected result: five rendered Godot Labels including umlauts; X changes title color; logs FONT_METRICS_OK, LABEL_TREE_READY, FONT_TEST_FINISHED; GODOT_RETURN=0.
          Logs: /data/GodotPS5/gles3-stdout.log, gles3-runtime.log, gles3-stderr.log.
          Revert to the separately published v0.1.2 or previously supplied v0.1.3 installer if needed.
          Godot source: https://github.com/Yahballon/tmp_lap/tree/feature/godot-ps5-engine-foundation/homebrew/godot-ps5
          Godot license: MIT. Font fixture Press Start 2P license: SIL OFL 1.1 inside m10b-font-ui.pck.
          PS5 graphics glue has separate GPL requirements. Review sources/licenses prior to redistributing.
          NOTES
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx PPSA99847.zip
          else
            gh release create "$tag" /tmp/m10c-release/PPSA99847.zip \
              --repo "$GITHUB_REPOSITORY" --target feature/godot-ps5-engine-foundation \
              --title 'Godot PS5 GLES3 Canvas v0.1.4 – FreeType/Label fix (experimental)' \
              --notes-file /tmp/m10c-notes.md --prerelease
          fi
      - name: Update TESTBUILDS version.json with verified release
        env:
          GH_TOKEN: ${{ secrets.PS5_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          python3 tools/test-version-catalog.py
          python3 tools/test-catalog-triggers.py
          python3 tools/update-version.py
          python3 -m json.tool version.json >/dev/null
          python3 - <<'PY'
          import json
          j=json.load(open('version.json'))
          matches=[x for x in j['apps'] if x['title_id']=='PPSA99847']
          assert len(matches)==1
          app=matches[0]
          assert app['version']=='0.1.4'
          assert app['tag']=='godot-ps5-gles3-canvas-v0.1.4'
          assert app['zip_url'].endswith('/PPSA99847.zip')
          assert j['app_count']==len(j['apps'])
          print('GODOT_PS5_M10C_TESTBUILD_CATALOG_OK')
          PY
          if [ -n "$(git status --porcelain -- version.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add version.json
            git commit -m 'chore(testbuilds): publish Godot GLES3 FreeType v0.1.4 [skip ci]'
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              git push origin HEAD:main && exit 0
              sleep 3
            done
            exit 1
          fi
