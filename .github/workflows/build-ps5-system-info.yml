name: Build PS5 System Info
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'homebrew/ps5-system-info/**'
      - '.github/workflows/build-ps5-system-info.yml'
  push:
    branches: [main]
    paths:
      - 'homebrew/ps5-system-info/**'
      - '.github/workflows/build-ps5-system-info.yml'
permissions:
  contents: write
jobs:
  ps5:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 ninja-build make wget curl unzip tar git python3 python3-pil pkg-config ca-certificates
      - name: Test host-side diagnostics
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror homebrew/ps5-system-info/native/data.cpp homebrew/ps5-system-info/tests/data_test.cpp -o /tmp/ps5-info-test
          /tmp/ps5-info-test
      - name: Prepare native framework
        run: |
          git clone --depth=1 https://github.com/Yahballon/PS5-DevBridge.git /tmp/devbridge
          cp -a /tmp/devbridge/templates/simple-calc ./app
          cp homebrew/ps5-system-info/native/*.cpp homebrew/ps5-system-info/native/*.hpp app/src/
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('app/sce_sys/param.json')
          d=json.loads(p.read_text())
          d.update(titleId='PPSA99786',conceptId='99786',contentId='UP9000-PPSA99786_00-PS5SYSTEMINFO001',contentVersion='01.000.001')
          d['localizedParameters']['en-US']['titleName']='PS5 System Info'
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          python3 homebrew/ps5-system-info/assets/generate_icon.py app/sce_sys/icon0.png
          mkdir -p app/assets
          cp app/sce_sys/icon0.png app/assets/icon0.png
      - name: Prepare PS5 OpenGL SDK
        working-directory: app
        env:
          USE_CCACHE: '0'
          BUILD_JOBS: '4'
          PS5_CLANG: clang-18
        run: bash tools/prepare-opengl.sh
      - name: Prepare POSIX compatibility symbols
        run: |
          mkdir -p app/build/jb-json
          cp app/.deps/native/ps5-payload-sdk/target/lib/libc.a app/build/jb-json/libjb-posix.a
          llvm-objcopy-18 --redefine-sym=openlog=jb_sdk_openlog --redefine-sym=closelog=jb_sdk_closelog --redefine-sym=mkstemp=jb_sdk_mkstemp --redefine-sym=mkstemps=jb_sdk_mkstemps --redefine-sym=getpwuid_r=jb_sdk_getpwuid_r app/build/jb-json/libjb-posix.a
      - name: Compile PS5 native executable
        working-directory: app
        env:
          USE_CCACHE: '0'
          BUILD_JOBS: '4'
          PS5_CLANG: clang-18
        run: make USE_CCACHE=0 BUILD_JOBS=4 app
      - name: Verify PS5 installer
        run: |
          python3 - <<'PY'
          import json,pathlib,zipfile,struct
          p=pathlib.Path('app/dist/PPSA99786')
          elf=(p/'eboot.bin').read_bytes()
          assert len(elf)>1000
          assert struct.unpack('<I',elf[:4])[0]==0x1d3d154f
          assert b'v0.1.0' in elf
          meta=json.loads((p/'sce_sys/param.json').read_text())
          assert meta['titleId']=='PPSA99786'
          assert meta['contentId']=='UP9000-PPSA99786_00-PS5SYSTEMINFO001'
          assert meta['contentVersion']=='01.000.001'
          for name in ['sce_sys/icon0.png','sce_module/libc.prx','assets/fonts/inter-semibold.huifont']:
            assert (p/name).is_file(),name
          with zipfile.ZipFile('app/dist/PPSA99786.zip') as z:
            assert z.testzip() is None
            for name in ['eboot.bin','sce_sys/icon0.png','sce_module/libc.prx','assets/fonts/inter-semibold.huifont']:
              assert 'PPSA99786/'+name in z.namelist(),name
          print('Native installer ZIP and metadata verified')
          PY
      - name: Upload installation ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PS5-System-Info-v0.1.0-PPSA99786
          path: app/dist/PPSA99786.zip
          if-no-files-found: error
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view ps5-system-info-v0.1.0 >/dev/null 2>&1; then
            echo 'Existing release retained'
            exit 0
          fi
          gh release create ps5-system-info-v0.1.0 app/dist/PPSA99786.zip --target "$GITHUB_SHA" --title "PS5 System Info v0.1.0" --notes-file homebrew/ps5-system-info/RELEASE_NOTES.md
