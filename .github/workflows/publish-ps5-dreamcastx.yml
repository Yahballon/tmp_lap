name: Publish PS5DreamcastX Release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional verified build run (empty = newest matching build)
        required: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-ps5-dreamcastx.yml'
  workflow_run:
    workflows:
      - Build PS5DreamcastX (native Flycast)
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-ps5-dreamcastx
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4
      - name: Find newest successful matching signed PS5 artifact
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_RUN_ID: ${{ inputs.run_id }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          app=json.loads(Path('homebrew/ps5-dreamcastx/app.json').read_text())
          assert app['titleId']=='PPSA99765' and app['installFolder']=='PS5DreamcastX'
          version=app['version']
          assert app['releaseTag']==f'ps5-dreamcastx-v{version}'
          root='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          def get(url):
              req=urllib.request.Request(url,headers={
                  'Accept':'application/vnd.github+json',
                  'Authorization':'Bearer '+token,
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'PS5DreamcastX-release-publisher'})
              with urllib.request.urlopen(req,timeout=30) as resp:
                  return json.load(resp)
          chosen=None
          manual=os.getenv('MANUAL_RUN_ID','')
          if manual:
              assert manual.isdigit()
              run=get(root+'/actions/runs/'+manual)
              assert run['status']=='completed' and run['conclusion']=='success'
              candidates=[run]
          else:
              data=get(root+'/actions/workflows/build-ps5-dreamcastx.yml/runs'
                       '?branch=main&status=success&per_page=15')
              candidates=data.get('workflow_runs',[])
          for run in candidates:
              if run.get('conclusion')!='success' or run.get('head_branch')!='main':
                  continue
              artifact_data=get(root+'/actions/runs/'+str(run['id'])+'/artifacts?per_page=50')
              if any(a['name']=='PS5DreamcastX-v'+version and
                     not a.get('expired',False) for a in artifact_data.get('artifacts',[])):
                  chosen=run
                  break
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('version='+version+'\n')
              out.write('tag='+app['releaseTag']+'\n')
              out.write('ready='+('true' if chosen else 'false')+'\n')
              if chosen:
                  out.write('run_id='+str(chosen['id'])+'\n')
                  out.write('build_sha='+chosen['head_sha']+'\n')
          if chosen:
              print('Verified',app['releaseTag'],'native PS5 build run',chosen['id'])
          else:
              print('No successful native artifact for',app['releaseTag'],'yet; will retry on schedule')
          PY
      - name: Download original native PS5 artifact
        if: steps.build.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: PS5DreamcastX-v${{ steps.build.outputs.version }}
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: homebrew/ps5-dreamcastx/dist
      - name: Verify signed ZIP
        if: steps.build.outputs.ready == 'true'
        working-directory: homebrew/ps5-dreamcastx
        run: |
          python3 scripts/verify_package.py dist/PPSA99765.zip
          sha256sum dist/PPSA99765.zip
      - name: Ensure verified build tag exists
        if: steps.build.outputs.ready == 'true'
        env:
          TAG: ${{ steps.build.outputs.tag }}
          # Source snapshot reproduces the native build's PS5DreamcastX tree,
          # based on last successfully released tag. This skips unrelated
          # PS5MesenX workflow-file history that GITHUB_TOKEN may not tag.
          RELEASE_SOURCE_SHA: b33de3990b8a8a8518836667919343d377556039
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Git tag $TAG exists."
          else
            # Actions checkout is shallow at the publisher commit. The
            # signed app was built from another commit; fetch that exact
            # object before tagging it (otherwise git tag exits 128).
            git fetch --no-tags --depth=1 origin "$RELEASE_SOURCE_SHA"
            git tag "$TAG" "$RELEASE_SOURCE_SHA"
            git push origin "refs/tags/$TAG"
          fi
      - name: Publish versioned GitHub Release
        if: steps.build.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.build.outputs.tag }}
          RELEASE_SOURCE_SHA: b33de3990b8a8a8518836667919343d377556039
        working-directory: homebrew/ps5-dreamcastx
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to change."
            exit 0
          fi
          gh release create "$TAG" dist/PPSA99765.zip \
            --repo "${{ github.repository }}" \
            --target "$RELEASE_SOURCE_SHA" \
            --title "DreamXcast v${{ steps.build.outputs.version }}" \
            --notes-file RELEASE_NOTES.md
