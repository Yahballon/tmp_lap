name: Publish Godot PS5 M22 Bounded Canvas Ring TESTBUILD
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful signed M13 native frame profiler build from trusted feature branch"
        required: true
  workflow_run:
    workflows: ['Godot PS5 M22 Bounded Canvas Ring Trial v0.2.6']
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-godot-ps5-m22-bounded-canvas-ring
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'perf/godot-ps5-m22-bounded-canvas-ring' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == 'Yahballon/tmp_lap')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Strictly verify successful signed native build from trusted branch
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.PS5_RELEASE_TOKEN || github.token }}
          PARENT_RUN: ${{ github.event.workflow_run.id || '0' }}
          REQUESTED_RUN: ${{ inputs.run_id || '0' }}
        run: |
          set -euo pipefail
          run="$PARENT_RUN"
          if [ "$run" = 0 ]; then run="$REQUESTED_RUN"; fi
          [[ "$run" =~ ^[0-9]+$ ]] || exit 2
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > /tmp/m22-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" > /tmp/m22-artifacts.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.load(open('/tmp/m22-run.json'))
          assert r['repository']['full_name']=='Yahballon/tmp_lap'
          assert r['head_repository']['full_name']=='Yahballon/tmp_lap'
          assert r['head_branch']=='perf/godot-ps5-m22-bounded-canvas-ring'
          assert r['name']=='Godot PS5 M22 Bounded Canvas Ring Trial v0.2.6'
          assert r['event']=='push'
          assert r['status']=='completed' and r['conclusion']=='success'
          matches=[a for a in json.load(open('/tmp/m22-artifacts.json'))['artifacts']
            if a['name']=='Godot-PS5-M22-BOUNDED-CANVAS-v0.2.6-PS5-HARDWARE-UNTESTED'
            and not a['expired'] and a.get('workflow_run',{}).get('head_sha')==r['head_sha']]
          assert len(matches)==1, f'M13 signed native profiler artifact missing: {matches}'
          Path('/tmp/m22-build-sha').write_text(r['head_sha'])
          print('GODOT_PS5_M22_SIGNED_RELEASE_SOURCE_VERIFIED',r['id'],r['head_sha'])
          PY
          mkdir -p /tmp/m22-release
          gh run download "$run" --repo "$GITHUB_REPOSITORY" \
            --name Godot-PS5-M22-BOUNDED-CANVAS-v0.2.6-PS5-HARDWARE-UNTESTED \
            --dir /tmp/m22-release
          test -s /tmp/m22-release/PPSA99847.zip
      - name: Independently validate installable PS5 signed AudioOut title
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,struct,zipfile
          p=Path('/tmp/m22-release/PPSA99847.zip')
          assert p.stat().st_size>1_000_000
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert all(n.startswith('PPSA99847/') and '..' not in Path(n).parts for n in names)
              for name in ('eboot.bin','assets/godot/visual-smoke.pck',
                    'assets/godot/physics-smoke.pck','assets/godot/m10b-font-ui.pck'):
                  assert 'PPSA99847/'+name in names
              data=z.read('PPSA99847/eboot.bin')
              assert len(data)>5_000_000 and data[:4]==struct.pack('<I',0x1d3d154f)
              meta=json.loads(z.read('PPSA99847/sce_sys/param.json'))
              assert meta['titleId']=='PPSA99847'
              assert meta['contentId']=='UP9000-PPSA99847_00-GODOTGLES3CANVAS'
              assert meta['contentVersion']=='01.000.017'
          print('GODOT_PS5_M22_SIGNED_ZIP_OK',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Publish v0.2.6 PS5 native frame-profiler TESTBUILD (experimental)
        env:
          GH_TOKEN: ${{ secrets.PS5_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          tag=godot-ps5-gles3-canvas-v0.2.6
          cat > /tmp/m22-notes.md <<'NOTES'
          Experimental Godot PS5 GLES3 v0.2.6 (M22) – Bounded Canvas2D GL buffer ring.
          
          Physical PS5 TAR #41 proves the M21 v0.2.5 fence status experiment still severely stalls: built-in Pong initially produces 88 frames per 5s and then only 1–4, with Godot RenderingServer::draw up to 9544ms and EGL swap ~0.1ms. Per-call M19 stats show 516 glBufferData calls across 86 frames (six buffer storage updates per frame) and six calls even in later one-frame windows. The original Godot 4.7.2 GLES3 Canvas2D buffer allocation path can insert fresh instance buffer sets when GPU fences stay unsignaled, potentially growing GPU memory usage until the PS5 shared render pool is pressured. Buffer count and actual heap bytes were not previously measured, so this remains a hypothesis rather than proof.
          
          M22 keeps the original 2D rendering but **caps the canvas instance-data buffer object ring to 9 sets** on the experimental PS5 native GLES3 target. On reusing a set it uses standard OpenGL glBufferData(...,nullptr,GL_STREAM_DRAW) orphaning for all instance buffers, light UBO and state UBO. In-flight GPU work keeps its previous backing allocation under conforming GL semantics; the old sync object handle is deleted, not its queued commands. Non-PS5 Godot paths remain unchanged. The previous M13–M21 profilers, VSync=1, native audio, external PCK, physics, scripts and controls remain.
          
          Expect GODOT_PS5_M22_BOUNDED_CANVAS_RING active=1 max_sets=9 orphan=1 and GODOT_PS5_M22_CANVAS_RING cap=9 live_sets=9 orphan_reuses=N. Confirm repeated logs over at least 60 seconds, and compare old M19 glBufferData with FPS/RenderingServer::draw behavior. There may still be driver-level buffer backing allocations and persistent GPU waits. This is a candidate workaround, NOT a confirmed hardware performance fix.
          Keep previous signed v0.2.5 and v0.2.4 as rollback. Test bundled Pong first, then original M12d pack. Source: https://github.com/Yahballon/tmp_lap/tree/perf/godot-ps5-m22-bounded-canvas-ring/homebrew/godot-ps5
          
          NOTES
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx PPSA99847.zip
          else
            gh release create "$tag" /tmp/m22-release/PPSA99847.zip \
              --repo "$GITHUB_REPOSITORY" --target perf/godot-ps5-m22-bounded-canvas-ring \
              --title 'Godot PS5 GLES3 Canvas v0.2.6 – Bounded Canvas Ring Trial' \
              --notes-file /tmp/m22-notes.md --prerelease
          fi
      - name: Update TESTBUILDS version.json with verified release
        env:
          GH_TOKEN: ${{ secrets.PS5_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          python3 tools/test-version-catalog.py
          python3 tools/test-catalog-triggers.py
          python3 tools/update-version.py
          python3 -m json.tool version.json >/dev/null
          python3 - <<'PY'
          import json
          j=json.load(open('version.json'))
          matches=[x for x in j['apps'] if x['title_id']=='PPSA99847']
          assert len(matches)==1
          app=matches[0]
          assert app['version']=='0.2.6'
          assert app['tag']=='godot-ps5-gles3-canvas-v0.2.6'
          assert app['zip_url'].endswith('/PPSA99847.zip')
          assert j['app_count']==len(j['apps'])
          print('GODOT_PS5_M22_TESTBUILD_CATALOG_OK')
          PY
          if [ -n "$(git status --porcelain -- version.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add version.json
            git commit -m 'chore(testbuilds): publish Godot PS5 M20 GPU timestamp bypass v0.2.6 [skip ci]'
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              git push origin HEAD:main && exit 0
              sleep 3
            done
            exit 1
          fi
