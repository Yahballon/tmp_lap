name: Publish Godot PS5 M23 Missing GL Trace TESTBUILD
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful signed M13 native frame profiler build from trusted feature branch"
        required: true
  workflow_run:
    workflows: ['Godot PS5 M23 Missing GL Call Profiler v0.2.7']
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-godot-ps5-m23-missing-gl
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'perf/godot-ps5-m23-missing-gl-waits' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == 'Yahballon/tmp_lap')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Strictly verify successful signed native build from trusted branch
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.PS5_RELEASE_TOKEN || github.token }}
          PARENT_RUN: ${{ github.event.workflow_run.id || '0' }}
          REQUESTED_RUN: ${{ inputs.run_id || '0' }}
        run: |
          set -euo pipefail
          run="$PARENT_RUN"
          if [ "$run" = 0 ]; then run="$REQUESTED_RUN"; fi
          [[ "$run" =~ ^[0-9]+$ ]] || exit 2
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > /tmp/m23-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" > /tmp/m23-artifacts.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.load(open('/tmp/m23-run.json'))
          assert r['repository']['full_name']=='Yahballon/tmp_lap'
          assert r['head_repository']['full_name']=='Yahballon/tmp_lap'
          assert r['head_branch']=='perf/godot-ps5-m23-missing-gl-waits'
          assert r['name']=='Godot PS5 M23 Missing GL Call Profiler v0.2.7'
          assert r['event']=='push'
          assert r['status']=='completed' and r['conclusion']=='success'
          matches=[a for a in json.load(open('/tmp/m23-artifacts.json'))['artifacts']
            if a['name']=='Godot-PS5-M23-MISSING-GL-v0.2.7-PS5-HARDWARE-UNTESTED'
            and not a['expired'] and a.get('workflow_run',{}).get('head_sha')==r['head_sha']]
          assert len(matches)==1, f'M13 signed native profiler artifact missing: {matches}'
          Path('/tmp/m23-build-sha').write_text(r['head_sha'])
          print('GODOT_PS5_M23_SIGNED_RELEASE_SOURCE_VERIFIED',r['id'],r['head_sha'])
          PY
          mkdir -p /tmp/m23-release
          gh run download "$run" --repo "$GITHUB_REPOSITORY" \
            --name Godot-PS5-M23-MISSING-GL-v0.2.7-PS5-HARDWARE-UNTESTED \
            --dir /tmp/m23-release
          test -s /tmp/m23-release/PPSA99847.zip
      - name: Independently validate installable PS5 signed AudioOut title
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,struct,zipfile
          p=Path('/tmp/m23-release/PPSA99847.zip')
          assert p.stat().st_size>1_000_000
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert all(n.startswith('PPSA99847/') and '..' not in Path(n).parts for n in names)
              for name in ('eboot.bin','assets/godot/visual-smoke.pck',
                    'assets/godot/physics-smoke.pck','assets/godot/m10b-font-ui.pck'):
                  assert 'PPSA99847/'+name in names
              data=z.read('PPSA99847/eboot.bin')
              assert len(data)>5_000_000 and data[:4]==struct.pack('<I',0x1d3d154f)
              meta=json.loads(z.read('PPSA99847/sce_sys/param.json'))
              assert meta['titleId']=='PPSA99847'
              assert meta['contentId']=='UP9000-PPSA99847_00-GODOTGLES3CANVAS'
              assert meta['contentVersion']=='01.000.018'
          print('GODOT_PS5_M23_SIGNED_ZIP_OK',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Publish v0.2.7 PS5 native frame-profiler TESTBUILD (experimental)
        env:
          GH_TOKEN: ${{ secrets.PS5_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          tag=godot-ps5-gles3-canvas-v0.2.7
          cat > /tmp/m23-notes.md <<'NOTES'
          Godot PS5 GLES3 v0.2.7 (M23) – missing GL function diagnostic, safety rollback of M22 ring experiment.

          PS5 real TAR #42 proves v0.2.6 M22 activated, but bundled Pong still drops from ~84 frames to 1 frame per 5-second window. The intended M22 buffer ring cap never logged a single triggered reuse (0 GODOT_PS5_M22_CANVAS_RING cap=... entries), so its suspected expanding ring was not supported by the hardware data. M22 buffer ring orphaning is removed from M23; the baseline original Godot GLES3 buffer-ring code is restored.
          Remaining Godot RenderingServer::draw spikes reach ~9544ms and total Main::iteration over 11 seconds, yet original M19-selected 23 GL calls take less than 2ms combined, EGL swap ~0.1ms. Thus a previously UNPROFILED call or external synchronization remains likely.

          M23 adds 32 original-parameter-preserving GLES3 entry point timers including glBindTexture, glBindVertexArray, glGetSynciv, glDeleteSync, glGenBuffers, glTexParameteri, glGetProgramiv, glGetShaderiv, glViewport and shader resource/state binds. GODOT_PS5_M23_EXTRA_GL_TIMING active=1 methods=32, GODOT_PS5_M23_GL_PROFILER_READY, GODOT_PS5_M23_GL_5S and GODOT_PS5_M23_GL_SUMMARY_5S in stdout. No extra GL commands, shaders, sync fences or gameplay changes.
          Retains original VSync=1, native AudioOut, Godot 4.7.2 Pong/M12d PCK, GDScript, Physics2D, controller, and M13–M21 profilers. Diagnostic ONLY, not a confirmed lag fix; requires physical hardware timings. Signed v0.2.6 remains rollback release, though M22 did not improve FPS.

          Source: https://github.com/Yahballon/tmp_lap/tree/perf/godot-ps5-m23-missing-gl-waits/homebrew/godot-ps5

          NOTES
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx PPSA99847.zip
          else
            gh release create "$tag" /tmp/m23-release/PPSA99847.zip \
              --repo "$GITHUB_REPOSITORY" --target perf/godot-ps5-m23-missing-gl-waits \
              --title 'Godot PS5 GLES3 Canvas v0.2.7 – Extended GL Wait Diagnostics' \
              --notes-file /tmp/m23-notes.md --prerelease
          fi
      - name: Update TESTBUILDS version.json with verified release
        env:
          GH_TOKEN: ${{ secrets.PS5_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          python3 tools/test-version-catalog.py
          python3 tools/test-catalog-triggers.py
          python3 tools/update-version.py
          python3 -m json.tool version.json >/dev/null
          python3 - <<'PY'
          import json
          j=json.load(open('version.json'))
          matches=[x for x in j['apps'] if x['title_id']=='PPSA99847']
          assert len(matches)==1
          app=matches[0]
          assert app['version']=='0.2.7'
          assert app['tag']=='godot-ps5-gles3-canvas-v0.2.7'
          assert app['zip_url'].endswith('/PPSA99847.zip')
          assert j['app_count']==len(j['apps'])
          print('GODOT_PS5_M23_TESTBUILD_CATALOG_OK')
          PY
          if [ -n "$(git status --porcelain -- version.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add version.json
            git commit -m 'chore(testbuilds): publish Godot PS5 M20 GPU timestamp bypass v0.2.7 [skip ci]'
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              git push origin HEAD:main && exit 0
              sleep 3
            done
            exit 1
          fi
